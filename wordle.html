<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wordle — onlymakkus</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--black:#0b0b09;--cream:#f2ede4;--orange:#ff4e1a;--orange2:#ff6b3d;--muted:#8f8a7d;--card:#16150f;--border:#2b2920;--green:#538d4e;--yellow:#b59f3b;--gray:#3a3a3c}
    html,body{height:100%;height:calc(var(--vh, 1vh) * 100)}
    body{background:var(--black);color:var(--cream);font-family:'DM Mono',monospace;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
    .cursor{display:none}
    
    @media(hover:none){.cursor{display:none}body{cursor:auto}}
    .topbar{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid var(--border);background:rgba(10,10,8,0.88);backdrop-filter:blur(6px)}
    .topbar-title{font-family:'Bebas Neue';letter-spacing:.15em;font-size:1.05rem;color:var(--cream)}
    .topbar-title span{color:var(--orange)}
    .tb-back{display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--cream);font-family:'DM Mono';font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;padding:0;text-decoration:none;transition:color .2s}
    .tb-back b{font-family:'Bebas Neue';font-size:1.15rem;letter-spacing:.06em;font-weight:400;color:var(--orange)}
    .tb-back:hover{color:var(--orange)}
    main{flex:1;display:flex;flex-direction:column;align-items:center;padding:80px 20px 60px;gap:20px}
    .stats{display:flex;gap:28px;justify-content:center;flex-wrap:wrap}
    .stat-box{text-align:center}
    .stat-val{font-family:'Bebas Neue';font-size:2rem;color:var(--orange);line-height:1}
    .stat-label{font-size:.5rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:2px}
    .grid{display:flex;flex-direction:column;gap:5px}
    .grid-row{display:flex;gap:5px}
    .tile{width:56px;height:56px;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue';font-size:2rem;border:2px solid var(--gray);transition:border-color .1s;user-select:none}
    .tile.filled{border-color:rgba(255,255,255,.3);animation:pop .1s ease}
    .tile.correct{background:var(--green);border-color:var(--green);animation:flip .5s ease forwards}
    .tile.present{background:var(--yellow);border-color:var(--yellow);animation:flip .5s ease forwards}
    .tile.absent{background:var(--gray);border-color:var(--gray);animation:flip .5s ease forwards}
    .tile.shake{animation:shake .4s ease}
    .tile.bounce{animation:bounce .5s ease forwards}
    .keyboard{display:flex;flex-direction:column;gap:7px;align-items:center;width:100%;max-width:480px}
    .kb-row{display:flex;gap:5px;justify-content:center}
    .key{height:54px;min-width:38px;padding:0 5px;display:flex;align-items:center;justify-content:center;background:#818384;color:var(--cream);font-family:'DM Mono';font-size:.72rem;font-weight:500;text-transform:uppercase;border:none;border-radius:2px;transition:background .3s;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    .key.wide{min-width:60px;font-size:.62rem}
    .key.correct{background:var(--green)}
    .key.present{background:var(--yellow)}
    .key.absent{background:var(--gray)}
    .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:var(--cream);color:var(--black);font-family:'DM Mono';font-size:.72rem;font-weight:500;letter-spacing:.1em;padding:10px 22px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:500;white-space:nowrap}
    .toast.show{opacity:1}
    .result-modal{display:none;position:fixed;inset:0;z-index:200;background:rgba(10,10,8,.88);align-items:center;justify-content:center}
    .result-modal.show{display:flex}
    .modal{background:var(--card);border:1px solid var(--border);padding:40px 32px;max-width:380px;width:90%;text-align:center;display:flex;flex-direction:column;gap:16px}
    .modal-title{font-family:'Bebas Neue';font-size:2.8rem;line-height:1}
    .modal-title.win{color:var(--green)}
    .modal-title.lose{color:var(--orange)}
    .modal-word{font-size:.72rem;color:var(--muted)}
    .modal-word strong{color:var(--cream);font-size:1rem;letter-spacing:.15em;display:block}
    .modal-stats{display:flex;gap:20px;justify-content:center}
    .m-stat-val{font-family:'Bebas Neue';font-size:1.8rem;color:var(--orange);line-height:1}
    .m-stat-label{font-size:.5rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
    .modal-timer{font-family:'Bebas Neue';font-size:1.8rem;color:var(--cream)}
    .modal-btn{padding:12px 24px;border:none;font-family:'DM Mono';font-size:.68rem;font-weight:500;letter-spacing:.15em;text-transform:uppercase;transition:all .2s}
    .modal-btn.primary{background:var(--orange);color:var(--black)}
    .modal-btn.primary:hover{background:#ff6b3d}
    .modal-btn.secondary{background:transparent;color:var(--muted);border:1px solid var(--border)}
    .share-txt{font-family:'DM Mono';font-size:.78rem;line-height:1.5;color:var(--cream)}
    footer{padding:32px 40px;border-top:1px solid var(--border);display:flex;justify-content:center;gap:40px;font-size:.6rem;color:var(--muted);letter-spacing:.15em}
    @media(max-width:400px){.tile{width:46px;height:46px;font-size:1.6rem}.key{height:46px;min-width:30px}}
    @keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
    @keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(-90deg)}100%{transform:rotateX(0)}}
    @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
    @keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-18px)}60%{transform:translateY(-8px)}}
  
    /* --- account widget --- */
    .nav-right{display:flex;align-items:center;gap:14px}
    .acct{position:relative;display:flex;align-items:center}
    .acct-login{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--cream);background:transparent;border:1px solid var(--border);padding:7px 12px;cursor:pointer;text-decoration:none;transition:border-color .2s,color .2s}
    .acct-login:hover{border-color:var(--orange);color:var(--orange)}
    .acct-chip{display:flex;align-items:center;gap:9px;background:transparent;border:1px solid var(--border);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;font-family:'DM Mono',monospace;color:var(--cream);transition:border-color .2s}
    .acct-chip:hover{border-color:var(--orange)}
    .acct-av{width:26px;height:26px;border-radius:50%;background:var(--orange);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:.95rem;color:#0a0a08;flex-shrink:0;overflow:hidden;line-height:1}
    .acct-av.lg{width:44px;height:44px;font-size:1.5rem}
    .acct-av.has-img{color:transparent;background-color:var(--card2,#1c1c18)}
    .acct-name{font-size:.68rem;letter-spacing:.06em;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .acct-lvl{font-size:.52rem;letter-spacing:.1em;color:var(--orange);border:1px solid var(--border);border-radius:999px;padding:2px 7px;flex-shrink:0}
    .acct-menu{position:absolute;top:calc(100% + 10px);right:0;min-width:236px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px;flex-direction:column;gap:2px;box-shadow:0 14px 40px rgba(0,0,0,.5);z-index:9000;display:flex}
    .acct-menu-head{display:flex;align-items:center;gap:12px;padding:10px 10px 12px}
    .acct-menu-name{font-size:.82rem;letter-spacing:.04em;color:var(--cream)}
    .acct-menu-title{font-family:'DM Mono',monospace;font-style:italic;font-size:.72rem;letter-spacing:.04em;color:var(--orange);margin-top:2px}
    .acct-xp{padding:8px 10px 12px;border-top:1px solid var(--border)}
    .acct-xp-info{display:flex;justify-content:space-between;font-size:.54rem;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
    .acct-xp-bar{height:6px;border-radius:999px;background:var(--border);overflow:hidden}
    .acct-xp-fill{height:100%;width:0;background:linear-gradient(90deg,var(--orange),#ff6b3d);border-radius:999px;transition:width .5s ease}
    .acct-menu-item{display:block;width:100%;padding:10px;border-radius:8px;font-family:'DM Mono',monospace;font-size:.64rem;letter-spacing:.09em;text-transform:uppercase;color:var(--cream);text-decoration:none;background:transparent;border:none;text-align:left;cursor:pointer;transition:background .15s,color .15s}
    .acct-menu-item:hover{background:var(--card2,#1c1c18)}
    .acct-menu-item.danger{color:var(--muted)}
    .acct-menu-item.danger:hover{color:#ff5555;background:rgba(255,68,68,.09)}
    .acct-login[hidden],.acct-chip[hidden],.acct-menu[hidden],.acct-lvl[hidden],.acct-menu-title[hidden],.acct-xp[hidden]{display:none}

  </style>
</head>
<body>
<div class="cursor" id="cursor"></div>
<div class="toast" id="toast"></div>
<div class="result-modal" id="rModal">
  <div class="modal">
    <div class="modal-title" id="mTitle">GEWONNEN!</div>
    <div class="modal-word" id="mWord"></div>
    <div class="modal-stats">
      <div><div class="m-stat-val" id="mStreak">0</div><div class="m-stat-label">Streak</div></div>
      <div><div class="m-stat-val" id="mPlayed">0</div><div class="m-stat-label">Gespielt</div></div>
      <div><div class="m-stat-val" id="mWin">0%</div><div class="m-stat-label">Gewonnen</div></div>
    </div>
    <div class="share-txt" id="mShare"></div>
    <div style="font-size:.65rem;color:var(--muted)">Nächstes Wort in: <span class="modal-timer" id="mTimer">--:--:--</span></div>
    <div style="display:flex;gap:10px;justify-content:center">
      <button class="modal-btn primary" id="mShare-btn">📋 Teilen</button>
      <button class="modal-btn secondary" id="mClose">Schließen</button>
    </div>
  </div>
</div>
<div class="topbar">
  <a class="tb-back" href="gaming.html">←&nbsp; <b>OM</b> / wordle</a>
  <div class="acct" id="acct">
        <a class="acct-login" id="acctLogin" href="profile.html" hidden>Anmelden</a>
        <button class="acct-chip" id="acctChip" type="button" aria-haspopup="true" aria-expanded="false" hidden>
          <span class="acct-av" id="acctAv"></span>
          <span class="acct-name" id="acctName"></span>
          <span class="acct-lvl" id="acctLvl" hidden></span>
        </button>
        <div class="acct-menu" id="acctMenu" hidden>
          <div class="acct-menu-head">
            <span class="acct-av lg" id="acctAvLg"></span>
            <div>
              <div class="acct-menu-name" id="acctMenuName"></div>
              <div class="acct-menu-title" id="acctMenuTitle" hidden></div>
            </div>
          </div>
          <div class="acct-xp" id="acctXp" hidden>
            <div class="acct-xp-info"><span id="acctXpLabel">Level 1</span><span id="acctXpVal">0 / 100 XP</span></div>
            <div class="acct-xp-bar"><div class="acct-xp-fill" id="acctXpFill"></div></div>
          </div>
          <a class="acct-menu-item" href="profile.html">Profil</a>
          <button class="acct-menu-item danger" id="acctLogout" type="button">Abmelden</button>
        </div>
      </div>
</div>
<main>
  <div class="stats">
    <div class="stat-box"><div class="stat-val" id="s-played">0</div><div class="stat-label">Gespielt</div></div>
    <div class="stat-box"><div class="stat-val" id="s-win">0%</div><div class="stat-label">Gewonnen</div></div>
    <div class="stat-box"><div class="stat-val" id="s-streak">0</div><div class="stat-label">Streak 🔥</div></div>
    <div class="stat-box"><div class="stat-val" id="s-best">0</div><div class="stat-label">Beste Streak</div></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="keyboard" id="keyboard"></div>
</main>
<footer><span>© 2026 onlymakkus.de</span><a href="impressum.html" style="color:var(--muted);text-decoration:none;">Impressum</a><a href="datenschutz.html" style="color:var(--muted);text-decoration:none;">Datenschutz</a><span>täglich neues wort</span></footer>
<script>
function setVH(){
  const h=(window.visualViewport?window.visualViewport.height:window.innerHeight);
  document.documentElement.style.setProperty('--vh',(h*0.01)+'px');
}
setVH();
window.addEventListener('resize',setVH);
window.addEventListener('orientationchange',setVH);
if(window.visualViewport)window.visualViewport.addEventListener('resize',setVH);
const cursor=document.getElementById('cursor');
document.addEventListener('mousemove',e=>{cursor.style.left=e.clientX+'px';cursor.style.top=e.clientY+'px'});
document.querySelectorAll('a,button').forEach(el=>{el.addEventListener('mouseenter',()=>cursor.classList.add('big'));el.addEventListener('mouseleave',()=>cursor.classList.remove('big'))});
let tTimer;
function toast(msg,d=1800){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(tTimer);tTimer=setTimeout(()=>t.classList.remove('show'),d)}

'WISCH','WISSE','WOCHE','WOHNE','WOLKE','WOLLE','WONNE','WORTE','WUCHT','WUNDE','WUNSC','WUERD','WUERF','WURFS','WURST','WURZE','YACHT','ZAHLE','ZAHLU','ZANGE','ZAPFE','ZAUBE','ZEBRA','ZECHE','ZEDER','ZEHNT','ZEICH','ZEIGE','ZEILE','ZEITE','ZELLE','ZENIT','ZENTR','ZEUGE','ZIEGE','ZIELE','ZIFFE','ZIRKU','ZITAT','ZITRO','ZUCHT','ZUEGE','ZUFAL','ZUGES','ZUNGE','ZWANG','ZWECK','ZWEIT','ZWERG'];
const VALID_GUESSES=new Set([...WORDS, ...EXTRA_VALID.filter(w=>w.length===5)]);

function dayIdx(){const s=new Date('2026-01-01'),t=new Date();t.setHours(0,0,0,0);return Math.floor((t-s)/86400000)}
const WORD=WORDS[dayIdx()%WORDS.length];
const ROWS=6,COLS=5;
let curR=0,curC=0,over=false;
let board=Array.from({length:ROWS},()=>Array(COLS).fill(''));
let rev=Array.from({length:ROWS},()=>Array(COLS).fill(false));
const SK='wl_state_'+dayIdx(),STATSK='wl_stats';
function loadStats(){try{return JSON.parse(localStorage.getItem(STATSK))||{played:0,won:0,streak:0,best:0}}catch{return{played:0,won:0,streak:0,best:0}}}
function saveStats(s){localStorage.setItem(STATSK,JSON.stringify(s))}
function saveState(){localStorage.setItem(SK,JSON.stringify({board,curR,curC,over,rev}))}
function updateStatsDisplay(){const s=loadStats();document.getElementById('s-played').textContent=s.played;document.getElementById('s-win').textContent=Math.round((s.won/(s.played||1))*100)+'%';document.getElementById('s-streak').textContent=s.streak;document.getElementById('s-best').textContent=s.best}

// Build grid
const g=document.getElementById('grid');
for(let r=0;r<ROWS;r++){const row=document.createElement('div');row.className='grid-row';for(let c=0;c<COLS;c++){const t=document.createElement('div');t.className='tile';t.id=`t${r}${c}`;row.appendChild(t)}g.appendChild(row)}

// Build keyboard
const KB=[['Q','W','E','R','T','Z','U','I','O','P'],['A','S','D','F','G','H','J','K','L'],['ENTER','Y','X','C','V','B','N','M','⌫']];
const kb=document.getElementById('keyboard');
KB.forEach(row=>{const r=document.createElement('div');r.className='kb-row';row.forEach(k=>{const b=document.createElement('button');b.className='key'+(k.length>1?' wide':'');b.textContent=k;b.dataset.k=k;b.addEventListener('pointerdown',e=>{e.preventDefault();handle(k)});r.appendChild(b)});kb.appendChild(r)});

function tile(r,c){return document.getElementById(`t${r}${c}`)}
function updateTile(r,c){const t=tile(r,c);t.textContent=board[r][c];t.className='tile'+(board[r][c]?' filled':'')}
function getResult(g,a){
  const res=Array(COLS).fill('absent'),aa=a.split(''),used=Array(COLS).fill(false);
  for(let i=0;i<COLS;i++)if(g[i]===aa[i]){res[i]='correct';used[i]=true}
  for(let i=0;i<COLS;i++){if(res[i]==='correct')continue;const idx=aa.findIndex((l,j)=>l===g[i]&&!used[j]);if(idx!==-1){res[i]='present';used[idx]=true}}
  return res;
}
function revealRow(r,cb){
  const guess=board[r].join(''),res=getResult(guess,WORD);
  res.forEach((state,c)=>{
    setTimeout(()=>{
      tile(r,c).className='tile '+state;rev[r][c]=true;
      const btn=document.querySelector(`[data-k="${board[r][c]}"]`);
      if(btn){const p={correct:3,present:2,absent:1},cur=btn.dataset.s;if(!cur||p[state]>p[cur]){btn.className='key '+state;btn.dataset.s=state}}
      if(c===COLS-1&&cb)setTimeout(cb,300);
    },c*120);
  });
}
function handle(key){
  if(over)return;
  if(key==='⌫'||key==='Backspace'){if(curC>0){curC--;board[curR][curC]='';updateTile(curR,curC)}}
  else if(key==='ENTER'||key==='Enter'){
    if(curC<COLS){shakeRow(curR);toast('Zu kurz!');return}
    const guess=board[curR].join('');
    if(!VALID_GUESSES.has(guess)){shakeRow(curR);toast('Kein gültiges Wort!');return}
    revealRow(curR,()=>{
      curR++;curC=0;const won=guess===WORD;
      if(won)setTimeout(()=>{bounceRow(curR-1);endGame(true)},200);
      else if(curR>=ROWS)setTimeout(()=>endGame(false),400);
      saveState();
    });
  } else if(/^[A-Za-z]$/.test(key)){
    if(curC<COLS){board[curR][curC]=key.toUpperCase();updateTile(curR,curC);curC++}
  }
  saveState();
}
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;handle(e.key)});
function shakeRow(r){for(let c=0;c<COLS;c++){const t=tile(r,c);t.classList.add('shake');setTimeout(()=>t.classList.remove('shake'),400)}}
function bounceRow(r){for(let c=0;c<COLS;c++){const t=tile(r,c);setTimeout(()=>{t.classList.add('bounce');setTimeout(()=>t.classList.remove('bounce'),500)},c*80)}}
function getShare(){const e={correct:'🟩',present:'🟨',absent:'⬛'};let l=[`onlymakkus WORDLE #${dayIdx()}\n${curR}/6\n`];for(let r=0;r<curR;r++)l.push(getResult(board[r].join(''),WORD).map(s=>e[s]).join(''));return l.join('\n')}
function startTimer(){function u(){const now=new Date(),tom=new Date(now);tom.setDate(tom.getDate()+1);tom.setHours(0,0,0,0);const d=tom-now,h=String(Math.floor(d/3600000)).padStart(2,'0'),m=String(Math.floor((d%3600000)/60000)).padStart(2,'0'),s=String(Math.floor((d%60000)/1000)).padStart(2,'0');document.getElementById('mTimer').textContent=`${h}:${m}:${s}`}u();setInterval(u,1000)}
function endGame(won,replay){
  over=true;saveState();
  const s=loadStats();
  if(!replay){
    s.played++;
    if(won){s.won++;s.streak++;s.best=Math.max(s.best,s.streak)}else{s.streak=0;toast(WORD,3000)}
    saveStats(s);
  }
  updateStatsDisplay();
  setTimeout(()=>{
    document.getElementById('mTitle').textContent=won?'GEWONNEN! 🎉':'VERLOREN 😔';
    document.getElementById('mTitle').className='modal-title '+(won?'win':'lose');
    document.getElementById('mWord').innerHTML='Das Wort war: <strong>'+WORD+'</strong>';
    document.getElementById('mStreak').textContent=s.streak;
    document.getElementById('mPlayed').textContent=s.played;
    document.getElementById('mWin').textContent=Math.round((s.won/s.played)*100)+'%';
    document.getElementById('mShare').textContent=getShare();
    document.getElementById('rModal').classList.add('show');
    startTimer();
  },won?1600:2000);
}
document.getElementById('mShare-btn').addEventListener('click',()=>{navigator.clipboard.writeText(getShare()).then(()=>toast('📋 Kopiert!'))});
document.getElementById('mClose').addEventListener('click',()=>document.getElementById('rModal').classList.remove('show'));

// Restore state
const saved=localStorage.getItem(SK);
if(saved){
  const st=JSON.parse(saved);board=st.board;curR=st.curR;curC=st.curC;over=st.over;rev=st.rev;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const t=tile(r,c);if(board[r][c])t.textContent=board[r][c];
    if(rev[r][c]){const res=getResult(board[r].join(''),WORD);t.className='tile '+res[c];const btn=document.querySelector(`[data-k="${board[r][c]}"]`);if(btn){btn.className='key '+res[c];btn.dataset.s=res[c]}}
  }
  if(over){
    const won=curR>0&&board[curR-1]&&board[curR-1].join('')===WORD;
    setTimeout(()=>endGame(won,true),300);
  }
}
updateStatsDisplay();
</script>
  <script>
(function(){
  var SESS='om_profile_session';
  var acct=document.getElementById('acct'); if(!acct) return;
  var s=null; try{ s=JSON.parse(localStorage.getItem(SESS)||'null'); }catch(e){ s=null; }
  var login=document.getElementById('acctLogin');
  var chip=document.getElementById('acctChip');
  var menu=document.getElementById('acctMenu');
  function initial(n){ n=(n||'').trim(); return n?n.charAt(0).toUpperCase():'?'; }
  function paintAv(el){ if(!el)return; if(s&&s.avatarUrl){ el.style.backgroundImage='url("'+s.avatarUrl+'")'; el.classList.add('has-img'); el.textContent=''; } else { el.textContent=initial(s&&(s.displayName||s.name)); } }
  if(!s||!s.id){ if(login)login.hidden=false; return; }
  if(chip)chip.hidden=false;
  var name=s.displayName||s.name||'Profil';
  var full=name+(s.discriminator?('#'+s.discriminator):'');
  document.getElementById('acctName').textContent=name;
  document.getElementById('acctMenuName').textContent=full;
  paintAv(document.getElementById('acctAv'));
  paintAv(document.getElementById('acctAvLg'));
  if(s.level!=null){ var lv=document.getElementById('acctLvl'); lv.hidden=false; lv.textContent='LV '+s.level; }
  if(s.title){ var ti=document.getElementById('acctMenuTitle'); ti.hidden=false; ti.textContent=s.title; }
  if(s.xp!=null&&s.xpNext!=null){ var xp=document.getElementById('acctXp'); xp.hidden=false;
    document.getElementById('acctXpLabel').textContent='Level '+(s.level!=null?s.level:1);
    document.getElementById('acctXpVal').textContent=s.xp+' / '+s.xpNext+' XP';
    var pct=s.xpNext?Math.max(0,Math.min(100,s.xp/s.xpNext*100)):0;
    document.getElementById('acctXpFill').style.width=pct+'%';
  }
  function closeM(){ menu.hidden=true; chip.setAttribute('aria-expanded','false'); }
  function openM(){ menu.hidden=false; chip.setAttribute('aria-expanded','true'); }
  chip.addEventListener('click',function(e){ e.stopPropagation(); if(menu.hidden)openM();else closeM(); });
  document.addEventListener('click',function(e){ if(!acct.contains(e.target))closeM(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape')closeM(); });
  var lo=document.getElementById('acctLogout');
  if(lo)lo.addEventListener('click',function(){ try{localStorage.removeItem(SESS);}catch(e){} location.href='profile.html'; });
})();
</script>

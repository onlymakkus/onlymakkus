<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impressum — onlymakkus</title>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    :root, [data-theme="dark"]{
      --bg:#121214;--ink:#f2f0ec;--accent:#ff453a;--accent-text:#ff453a;--muted:#c4c2bc;--faint:#8f8d8a;--line:#2a2a2e;
      --ease:cubic-bezier(.4,0,.2,1);
      color-scheme:dark;
    }
    [data-theme="light"]{
      --bg:#f7f5f0;--ink:#14141a;--accent:#e8231b;--accent-text:#d01f18;--muted:#4a4a52;--faint:#6b6860;--line:#d8d5cc;
      color-scheme:light;
    }

    body{background:var(--bg);color:var(--ink);font-family:'Work Sans',sans-serif;transition:background .3s var(--ease),color .3s var(--ease);-webkit-font-smoothing:antialiased}
    a{color:var(--accent-text)}
    :focus-visible{outline:2px solid var(--accent);outline-offset:3px}

    nav{position:sticky;top:0;z-index:100;padding:14px 28px;display:flex;justify-content:space-between;align-items:center;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
    .nav-logo{font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-decoration:none}
    .nav-logo b{font-family:'Big Shoulders Display';font-weight:700;font-size:1.05rem;letter-spacing:.02em;color:var(--ink)}
    .nav-logo:hover{color:var(--ink)}
    .nav-right{display:flex;align-items:center;gap:14px}
    .nav-link{font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-decoration:none}
    .nav-link:hover{color:var(--accent-text)}
    .theme-toggle{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:transparent;border:1px solid var(--line);padding:7px 11px;cursor:pointer;transition:border-color .18s var(--ease),color .18s var(--ease)}
    .theme-toggle:hover{border-color:var(--accent);color:var(--accent-text)}

    main{max-width:700px;margin:0 auto;padding:56px 24px 100px}
    .page-title{font-family:'Big Shoulders Display';font-weight:800;font-size:clamp(2.6rem,8vw,4.4rem);line-height:.9;letter-spacing:-.005em;text-transform:uppercase;color:var(--ink);margin-bottom:36px}
    h2{font-family:'Big Shoulders Display';font-weight:700;font-size:1.25rem;letter-spacing:.02em;text-transform:uppercase;color:var(--ink);margin:38px 0 12px}
    p,li{font-size:.86rem;line-height:1.9;color:var(--muted)}
    .block{margin-bottom:8px}
    .source{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);font-family:'IBM Plex Mono',monospace;font-size:.62rem;color:var(--faint)}
    .source a{color:var(--faint)}

    footer{max-width:700px;margin:0 auto;padding:28px 24px;border-top:1px solid var(--line);display:flex;justify-content:center;gap:26px;font-family:'IBM Plex Mono',monospace;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);flex-wrap:wrap}
    footer a{color:var(--faint);text-decoration:none}
    footer a:hover{color:var(--accent-text)}

    @media(max-width:560px){ nav{padding:12px 18px} main{padding:40px 18px 80px} }
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="index.html">← <b>OM</b> / impressum</a>
  <div class="nav-right">
    <a class="nav-link" href="datenschutz.html">Datenschutz</a>
    <button class="theme-toggle" id="themeToggle" title="Design wechseln">Light</button>
  </div>
</nav>
<main>
  <h1 class="page-title">Impressum</h1>

  <h2>Angaben gemäß § 5 TMG</h2>
  <p class="block">Markus Sicking</p>
  <p class="block">Postfach 11 27<br>46492 Hamminkeln</p>

  <h2>Kontakt</h2>
  <p class="block">E-Mail: <a href="mailto:info@onlymakkus.de">info@onlymakkus.de</a></p>

  <p class="source">Quelle: <a href="https://www.e-recht24.de" target="_blank" rel="noopener">e-recht24.de</a></p>
</main>
<footer>
  <span>© 2026 onlymakkus.de</span>
  <a href="impressum.html">Impressum</a>
  <a href="datenschutz.html">Datenschutz</a>
  <span>made with pain &amp; supabase</span>
</footer>
<script>
  const THEME_KEY='om_cf_theme';
  const html=document.documentElement;
  const themeToggle=document.getElementById('themeToggle');
  function applyTheme(t){
    html.setAttribute('data-theme',t);
    themeToggle.textContent=t==='dark'?'Light':'Dark';
    localStorage.setItem(THEME_KEY,t);
  }
  applyTheme(localStorage.getItem(THEME_KEY)||'dark');
  themeToggle.addEventListener('click',()=>{
    applyTheme(html.getAttribute('data-theme')==='dark'?'light':'dark');
  });
</script>
</body>
</html>

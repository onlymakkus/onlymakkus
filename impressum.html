<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impressum — onlymakkus</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--black:#0a0a08;--cream:#f2ede4;--orange:#ff4e1a;--muted:#9a9488;--card:#141410;--border:rgba(255,255,255,0.08)}
    body{background:var(--black);color:var(--cream);font-family:'DM Mono',monospace;cursor:none}
    .cursor{position:fixed;width:12px;height:12px;background:var(--orange);border-radius:50%;pointer-events:none;z-index:10000;transform:translate(-50%,-50%);mix-blend-mode:difference;transition:width .15s,height .15s}
    .cursor.big{width:36px;height:36px}
    nav{padding:20px 40px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
    .nav-logo{font-family:'Bebas Neue';font-size:1.4rem;letter-spacing:.1em;color:var(--cream);text-decoration:none}
    .nav-link{font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);text-decoration:none;transition:color .2s}
    .nav-link:hover{color:var(--cream)}
    main{max-width:700px;margin:0 auto;padding:60px 24px 100px}
    h1{font-family:'Bebas Neue';font-size:clamp(2.5rem,8vw,4rem);color:var(--orange);margin-bottom:32px;letter-spacing:.02em}
    h2{font-family:'Bebas Neue';font-size:1.3rem;letter-spacing:.04em;color:var(--cream);margin:36px 0 12px;text-transform:uppercase}
    p,li{font-size:.82rem;line-height:1.9;color:var(--muted)}
    a{color:var(--orange)}
    .block{margin-bottom:8px}
    .source{margin-top:48px;padding-top:20px;border-top:1px solid var(--border);font-size:.65rem;color:rgba(255,255,255,.15)}
    footer{padding:32px 40px;border-top:1px solid var(--border);display:flex;justify-content:center;gap:40px;font-size:.6rem;color:var(--muted);letter-spacing:.15em;flex-wrap:wrap}
    footer a{color:var(--muted);text-decoration:none}
  </style>
</head>
<body>
<div class="cursor" id="cursor"></div>
<nav>
  <a class="nav-logo" href="index.html">← OM</a>
  <a class="nav-link" href="datenschutz.html">Datenschutz</a>
</nav>
<main>
  <h1>Impressum</h1>

  <h2>Angaben gemäß § 5 TMG</h2>
  <p class="block">Markus Sicking</p>
  <p class="block">Postfach<br>Brauereistr. 1<br>46499 Hamminkeln</p>

  <h2>Kontakt</h2>
  <p class="block">E-Mail: <a href="mailto:info@onlymakkus.de">info@onlymakkus.de</a></p>

  <p class="source">Quelle: <a href="https://www.e-recht24.de" target="_blank" rel="noopener">e-recht24.de</a></p>
</main>
<footer>
  <span>© 2026 onlymakkus.de</span>
  <a href="impressum.html">Impressum</a>
  <a href="datenschutz.html">Datenschutz</a>
  <span>made with pain & php</span>
</footer>
<script>
const c=document.getElementById('cursor');
document.addEventListener('mousemove',e=>{c.style.left=e.clientX+'px';c.style.top=e.clientY+'px'});
document.querySelectorAll('a').forEach(el=>{el.addEventListener('mouseenter',()=>c.classList.add('big'));el.addEventListener('mouseleave',()=>c.classList.remove('big'))});
</script>
</body>
</html>

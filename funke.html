<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Der letzte Funke</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0f0a; --bg2:#12160f; --panel:#151a11;
  --phosphor:#8fdb6a; --phosphor-dim:#4a7038; --phosphor-bright:#c4ffab;
  --amber:#e8a33d; --amber-dim:#8a621f;
  --danger:#d9564a; --border:#2a3320;
  --text:#c9d4bc; --text-dim:#5f6d52;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text); font-family:'Space Mono',monospace;
  overflow:hidden; cursor:default;
}
/* CRT scanline + vignette overlay */
.crt{position:fixed;inset:0;pointer-events:none;z-index:500;
  background:
    repeating-linear-gradient(0deg,rgba(0,0,0,0.15) 0px,rgba(0,0,0,0.15) 1px,transparent 1px,transparent 3px),
    radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.45) 100%);
  mix-blend-mode:multiply;
}
.flicker{position:fixed;inset:0;pointer-events:none;z-index:499;background:var(--phosphor);opacity:0;animation:flicker 7s infinite}
@keyframes flicker{0%,96%,100%{opacity:0}97%{opacity:.015}98%{opacity:0}99%{opacity:.02}}

#app{position:relative;height:100vh;display:flex;flex-direction:column}

/* TOP BAR */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0}
.topbar-title{font-family:'Bebas Neue';letter-spacing:.15em;font-size:1rem;color:var(--phosphor)}
.topbar-title span{color:var(--amber)}
.topbar-right{display:flex;gap:14px;align-items:center}
.tb-btn{background:none;border:1px solid var(--border);color:var(--text-dim);font-family:'Space Mono';font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;padding:6px 12px;cursor:pointer;transition:all .15s}
.tb-btn:hover{border-color:var(--phosphor-dim);color:var(--phosphor)}
.chapter-tag{font-size:.6rem;letter-spacing:.15em;color:var(--text-dim);text-transform:uppercase}

/* MAIN SCREEN */
#screen{flex:1;overflow-y:auto;padding:0}
.screen-inner{max-width:720px;margin:0 auto;padding:40px 24px 120px}

/* TITLE SCREEN */
.title-screen{min-height:calc(100vh - 45px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;gap:28px}
.title-logo{font-family:'Bebas Neue';font-size:clamp(2.8rem,10vw,5.5rem);line-height:.9;letter-spacing:.02em;color:var(--phosphor);text-shadow:0 0 24px rgba(143,219,106,.3)}
.title-logo span{color:var(--amber);text-shadow:0 0 24px rgba(232,163,61,.35)}
.title-sub{font-size:.72rem;letter-spacing:.2em;color:var(--text-dim);text-transform:uppercase;max-width:420px;line-height:2}
.title-menu{display:flex;flex-direction:column;gap:2px;margin-top:12px;width:260px}
.title-btn{background:var(--panel);border:1px solid var(--border);color:var(--phosphor);font-family:'Space Mono';font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;padding:14px;cursor:pointer;transition:all .15s;text-align:left}
.title-btn::before{content:'▸ ';color:var(--amber)}
.title-btn:hover{background:var(--phosphor-dim);color:var(--bg);border-color:var(--phosphor)}
.title-btn:disabled{opacity:.3;cursor:not-allowed}
.title-btn:disabled:hover{background:var(--panel);color:var(--phosphor)}
.title-foot{font-size:.6rem;color:var(--text-dim);letter-spacing:.15em;margin-top:20px}

/* STORY TEXT */
.story-block{margin-bottom:20px;opacity:0}
.story-block.show{opacity:1;transition:opacity .4s ease}
.story-loc{font-size:.62rem;letter-spacing:.25em;text-transform:uppercase;color:var(--amber);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.story-loc::before{content:'◆';font-size:.5rem}
.story-p{font-size:.92rem;line-height:1.85;color:var(--text);margin-bottom:14px}
.story-p.narrator{color:var(--text-dim);font-style:italic;font-size:.82rem}
.story-p .hl{color:var(--phosphor-bright)}
.story-speaker{color:var(--amber);font-weight:700;letter-spacing:.03em}
.story-divider{border:none;border-top:1px dashed var(--border);margin:24px 0}

/* CHOICES */
.choices{display:flex;flex-direction:column;gap:2px;margin-top:24px;opacity:0}
.choices.show{opacity:1;transition:opacity .4s ease .1s}
.choice-btn{background:var(--panel);border:1px solid var(--border);color:var(--text);font-family:'Space Mono';font-size:.82rem;line-height:1.5;padding:14px 18px;cursor:pointer;text-align:left;transition:all .15s;display:flex;gap:12px}
.choice-btn:hover{border-color:var(--phosphor);background:rgba(143,219,106,.06)}
.choice-btn:hover .choice-num{color:var(--phosphor-bright)}
.choice-num{color:var(--phosphor-dim);flex-shrink:0;font-weight:700}
.choice-btn.locked{opacity:.35;cursor:not-allowed}
.choice-btn.locked:hover{border-color:var(--border);background:var(--panel)}
.choice-req{font-size:.6rem;color:var(--danger);margin-top:4px;display:block}
.choice-btn.danger .choice-num{color:var(--danger)}

/* CONTINUE PROMPT */
.continue-prompt{margin-top:20px;font-size:.72rem;color:var(--text-dim);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:8px;opacity:0;animation:pulse 1.6s infinite}
.continue-prompt.show{opacity:1}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

/* INVENTORY DRAWER */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:600;opacity:0;pointer-events:none;transition:opacity .25s}
.drawer-overlay.show{opacity:1;pointer-events:all}
.drawer{position:fixed;top:0;right:0;bottom:0;width:320px;max-width:88vw;background:var(--bg2);border-left:1px solid var(--border);z-index:601;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.show{transform:translateX(0)}
.drawer-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.drawer-title{font-family:'Bebas Neue';letter-spacing:.1em;color:var(--phosphor);font-size:1rem}
.drawer-close{background:none;border:none;color:var(--text-dim);font-size:1.2rem;cursor:pointer}
.drawer-body{flex:1;overflow-y:auto;padding:16px 20px}
.inv-empty{color:var(--text-dim);font-size:.72rem;font-style:italic;text-align:center;padding:40px 0}
.inv-item{background:var(--panel);border:1px solid var(--border);padding:12px 14px;margin-bottom:8px}
.inv-item-name{color:var(--phosphor);font-size:.78rem;font-weight:700;margin-bottom:4px}
.inv-item-desc{color:var(--text-dim);font-size:.68rem;line-height:1.6}
.stat-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:.68rem}
.stat-row:last-child{border-bottom:none}
.stat-label{color:var(--text-dim);letter-spacing:.05em;text-transform:uppercase}
.stat-val{color:var(--amber)}
.drawer-section-title{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text-dim);margin:20px 0 10px}
.drawer-section-title:first-child{margin-top:0}

/* END SCREEN */
.end-screen{min-height:calc(100vh - 45px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;gap:20px}
.end-badge{font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:var(--amber)}
.end-title{font-family:'Bebas Neue';font-size:clamp(2rem,7vw,3.5rem);color:var(--phosphor);line-height:1}
.end-text{font-size:.82rem;color:var(--text-dim);max-width:480px;line-height:1.9}

/* TOAST */
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--phosphor-dim);color:var(--phosphor);font-size:.68rem;letter-spacing:.08em;padding:10px 20px;z-index:700;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

/* SCROLLBAR */
#screen::-webkit-scrollbar,.drawer-body::-webkit-scrollbar{width:6px}
#screen::-webkit-scrollbar-thumb,.drawer-body::-webkit-scrollbar-thumb{background:var(--border)}

@media(max-width:480px){
  .screen-inner{padding:28px 16px 100px}
  .drawer{width:100vw;max-width:100vw}
}
</style>
</head>
<body>

<div id="app">
  <div class="topbar">
    <div class="topbar-title">DER LETZTE <span>FUNKE</span></div>
    <div class="topbar-right">
      <span class="chapter-tag" id="chapterTag"></span>
      <button class="tb-btn" id="btnSound">Sound An</button>
      <button class="tb-btn" id="btnInventory">Inventar</button>
      <button class="tb-btn" id="btnSave">Speichern</button>
    </div>
  </div>
  <div id="screen"><div class="screen-inner" id="screenInner"></div></div>
</div>

<div class="drawer-overlay" id="drawerOverlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="drawer-title">STATUS</div>
    <button class="drawer-close" id="drawerClose">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</div>

<div class="toast" id="toast"></div>
<div class="flicker"></div>
<div class="crt"></div>

<script>
/* ══════════════════════════════════════════════════════════════
   ENGINE
   ══════════════════════════════════════════════════════════════ */

const SAVE_KEY = 'funke_save_v1';
const MUTE_KEY = 'funke_sound_muted';
const BASE_VOLUME = 0.2;

let state = {
  node: 'title',
  flags: {},
  inventory: [],
  visitedNodes: []
};

/* ══════════════════════════════════════════════════════════════
   SOUND ENGINE — prozedural erzeugte Ambient-Szenen, keine Dateien
   ══════════════════════════════════════════════════════════════ */

let audioCtx = null, masterGain = null, audioBuilt = false;
/* Sound ist standardmäßig AUS, bis die Szenen-Tags über alle 11 Kapitel integriert sind
   (aktuell nur Kapitel 1-3 getaggt). Wer will, kann ihn über den Topbar-Button aktivieren. */
let soundMuted = localStorage.getItem(MUTE_KEY) !== '0';
const scenes = {};
let pendingScene = null, currentSceneName = null;

function buildGeneratorScene(){
  const bus = audioCtx.createGain(); bus.gain.value = 0; bus.connect(masterGain);
  const o1 = audioCtx.createOscillator(); o1.type='sine'; o1.frequency.value=62;
  const o2 = audioCtx.createOscillator(); o2.type='sine'; o2.frequency.value=62.8;
  const drift = audioCtx.createOscillator(); drift.type='sine'; drift.frequency.value=0.05;
  const driftDepth = audioCtx.createGain(); driftDepth.gain.value=0.4;
  drift.connect(driftDepth); driftDepth.connect(o1.frequency); driftDepth.connect(o2.frequency);
  const lp = audioCtx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=200;
  const droneGain = audioCtx.createGain(); droneGain.gain.value=0.6;
  const breath = audioCtx.createOscillator(); breath.type='sine'; breath.frequency.value=0.08;
  const breathDepth = audioCtx.createGain(); breathDepth.gain.value=0.3;
  breath.connect(breathDepth); breathDepth.connect(droneGain.gain);
  o1.connect(lp); o2.connect(lp); lp.connect(droneGain); droneGain.connect(bus);
  o1.start(); o2.start(); drift.start(); breath.start();

  const buf = audioCtx.createBuffer(1, 4*audioCtx.sampleRate, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const noise = audioCtx.createBufferSource(); noise.buffer=buf; noise.loop=true;
  const bp = audioCtx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2000; bp.Q.value=0.5;
  const wave = audioCtx.createOscillator(); wave.type='sine'; wave.frequency.value=0.035;
  const shaper = audioCtx.createWaveShaper();
  const curve = new Float32Array(256);
  for(let i=0;i<256;i++){ const x=(i/255)*2-1; curve[i]=Math.max(0,x); }
  shaper.curve = curve;
  const waveDepth = audioCtx.createGain(); waveDepth.gain.value=0.5;
  const staticGain = audioCtx.createGain(); staticGain.gain.value=0.12;
  wave.connect(shaper); shaper.connect(waveDepth); waveDepth.connect(staticGain.gain);
  noise.connect(bp); bp.connect(staticGain); staticGain.connect(bus);
  noise.start(); wave.start();
  return bus;
}

function buildWindScene(){
  const bus = audioCtx.createGain(); bus.gain.value = 0; bus.connect(masterGain);
  const buf = audioCtx.createBuffer(1, 4*audioCtx.sampleRate, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const noise = audioCtx.createBufferSource(); noise.buffer=buf; noise.loop=true;
  const hp = audioCtx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=500;
  const lp = audioCtx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2200;
  const windGain = audioCtx.createGain(); windGain.gain.value=0.35;
  const gust = audioCtx.createOscillator(); gust.type='sine'; gust.frequency.value=0.06;
  const gustDepth = audioCtx.createGain(); gustDepth.gain.value=0.3;
  gust.connect(gustDepth); gustDepth.connect(windGain.gain);
  noise.connect(hp); hp.connect(lp); lp.connect(windGain); windGain.connect(bus);
  noise.start(); gust.start();
  return bus;
}

function buildFireScene(){
  const bus = audioCtx.createGain(); bus.gain.value = 0; bus.connect(masterGain);
  const buf = audioCtx.createBuffer(1, 2*audioCtx.sampleRate, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*0.3;
  const rumble = audioCtx.createBufferSource(); rumble.buffer=buf; rumble.loop=true;
  const lp = audioCtx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=300;
  const rumbleGain = audioCtx.createGain(); rumbleGain.gain.value=0.25;
  rumble.connect(lp); lp.connect(rumbleGain); rumbleGain.connect(bus);
  rumble.start();

  function crackle(){
    if(currentSceneName !== 'fire') return;
    const now = audioCtx.currentTime;
    const bufC = audioCtx.createBuffer(1, 0.03*audioCtx.sampleRate, audioCtx.sampleRate);
    const dc = bufC.getChannelData(0);
    for(let i=0;i<dc.length;i++) dc[i]=(Math.random()*2-1)*(1-i/dc.length);
    const src = audioCtx.createBufferSource(); src.buffer=bufC;
    const hp = audioCtx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=1500;
    const g = audioCtx.createGain(); g.gain.value=0.5 + Math.random()*0.4;
    src.connect(hp); hp.connect(g); g.connect(bus);
    src.start(now);
    setTimeout(crackle, 300 + Math.random()*900);
  }
  crackle();
  return bus;
}

function buildSilenceScene(){
  const bus = audioCtx.createGain(); bus.gain.value = 0; bus.connect(masterGain);
  const buf = audioCtx.createBuffer(1, 4*audioCtx.sampleRate, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const noise = audioCtx.createBufferSource(); noise.buffer=buf; noise.loop=true;
  const bp = audioCtx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1200; bp.Q.value=1.2;
  const thinGain = audioCtx.createGain(); thinGain.gain.value=0.08;
  noise.connect(bp); bp.connect(thinGain); thinGain.connect(bus);
  noise.start();
  return bus;
}

function buildAudioGraph(){
  if(audioBuilt) return;
  try{
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = soundMuted ? 0 : BASE_VOLUME;
    masterGain.connect(audioCtx.destination);
    scenes.generator = buildGeneratorScene();
    scenes.wind = buildWindScene();
    scenes.fire = buildFireScene();
    scenes.silence = buildSilenceScene();
    musicGain = audioCtx.createGain();
    musicGain.gain.value = 0;
    musicGain.connect(masterGain);
    audioBuilt = true;
    if(pendingScene) setScene(pendingScene);
    if(pendingMusic) playMusic(pendingMusic);
  }catch(e){ /* Web Audio nicht verfügbar — Spiel läuft trotzdem normal weiter */ }
}

/* ── Musik-Ebene: echte Audiodateien (z.B. Suno-Tracks), separat von den
   prozeduralen Ambient-Szenen. Läuft über denselben masterGain, respektiert
   also Mute-Button und Lautstärke automatisch. ── */
let musicGain = null, pendingMusic = null, currentMusicSource = null, currentMusicTrack = null;
const musicBufferCache = {};
const MUSIC_VOLUME = 0.55;
const MUSIC_TRACKS = {
  title: 'audio/hauptmenue.mp3'
};

async function playMusic(trackKey){
  if(!audioBuilt){ pendingMusic = trackKey; return; }
  if(currentMusicTrack === trackKey) return;
  currentMusicTrack = trackKey;
  const url = MUSIC_TRACKS[trackKey];
  if(!url) return stopMusic();

  try{
    if(!musicBufferCache[trackKey]){
      const res = await fetch(url);
      const arrBuf = await res.arrayBuffer();
      musicBufferCache[trackKey] = await audioCtx.decodeAudioData(arrBuf);
    }
    // falls der Track inzwischen gewechselt hat, während wir geladen haben
    if(currentMusicTrack !== trackKey) return;

    if(currentMusicSource){ try{ currentMusicSource.stop(); }catch(e){} }
    const source = audioCtx.createBufferSource();
    source.buffer = musicBufferCache[trackKey];
    source.loop = true;
    source.connect(musicGain);
    source.start();
    currentMusicSource = source;
    musicGain.gain.setTargetAtTime(MUSIC_VOLUME, audioCtx.currentTime, 1.2);
  }catch(e){ /* Track nicht ladbar (z.B. Datei fehlt) — kein Absturz, nur kein Musik-Layer */ }
}

function stopMusic(){
  currentMusicTrack = null;
  pendingMusic = null;
  if(!audioBuilt || !musicGain) return;
  musicGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.8);
  const src = currentMusicSource;
  currentMusicSource = null;
  if(src) setTimeout(()=>{ try{ src.stop(); }catch(e){} }, 1500);
}

function setScene(name){
  if(!scenes[name]) return;
  if(!audioBuilt){ pendingScene = name; return; }
  currentSceneName = name;
  Object.keys(scenes).forEach(k=>{
    scenes[k].gain.setTargetAtTime(k===name ? 1 : 0, audioCtx.currentTime, 0.8);
  });
}

function updateSoundButton(){
  const btn = document.getElementById('btnSound');
  if(btn) btn.textContent = soundMuted ? 'Sound Aus' : 'Sound An';
}

document.getElementById('btnSound').addEventListener('click', ()=>{
  buildAudioGraph();
  soundMuted = !soundMuted;
  localStorage.setItem(MUTE_KEY, soundMuted ? '1' : '0');
  if(masterGain) masterGain.gain.setTargetAtTime(soundMuted ? 0 : BASE_VOLUME, audioCtx.currentTime, 0.2);
  updateSoundButton();
});
updateSoundButton();

/* Erster Klick/Tastendruck irgendwo startet die Audio-Engine (Autoplay-Regeln der Browser) */
function firstGestureHandler(){
  buildAudioGraph();
  document.removeEventListener('click', firstGestureHandler);
  document.removeEventListener('keydown', firstGestureHandler);
}
document.addEventListener('click', firstGestureHandler);
document.addEventListener('keydown', firstGestureHandler);

/* ══════════════════════════════════════════════════════════════
   ENGINE
   ══════════════════════════════════════════════════════════════ */

function saveGame(){
  localStorage.setItem(SAVE_KEY, JSON.stringify(state));
  showToast('💾 Fortschritt gespeichert');
}
function loadGame(){
  const raw = localStorage.getItem(SAVE_KEY);
  if(!raw) return false;
  try{ state = JSON.parse(raw); return true; }catch(e){ return false; }
}
function hasSave(){ return !!localStorage.getItem(SAVE_KEY); }
function clearSave(){ localStorage.removeItem(SAVE_KEY); }

function showToast(msg, dur=2000){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), dur);
}

function addItem(id){
  if(!state.inventory.includes(id)){
    state.inventory.push(id);
    const item = ITEMS[id];
    showToast('📦 Erhalten: ' + (item ? item.name : id));
  }
}
function removeItem(id){
  const idx = state.inventory.indexOf(id);
  if(idx !== -1){
    state.inventory.splice(idx, 1);
    const item = ITEMS[id];
    showToast('📤 Abgegeben: ' + (item ? item.name : id));
  }
}
function hasItem(id){ return state.inventory.includes(id); }
function setFlag(key, val=true){ state.flags[key] = val; }
function getFlag(key){ return !!state.flags[key]; }

function checkCondition(cond){
  if(!cond) return true;
  if(cond.item && !hasItem(cond.item)) return false;
  if(cond.flag){
    const flagState = getFlag(cond.flag);
    if(cond.invert && flagState) return false;
    if(!cond.invert && !flagState) return false;
  }
  if(cond.allFlags && !cond.allFlags.every(f=>getFlag(f))) return false;
  if(cond.notFlag && getFlag(cond.notFlag)) return false;
  return true;
}

/* ── RENDER ────────────────────────────────────────────────── */

function renderTitle(){
  document.getElementById('chapterTag').textContent = '';
  const el = document.getElementById('screenInner');
  const continueDisabled = !hasSave();
  el.innerHTML = `
    <div class="title-screen">
      <div>
        <div class="title-logo">DER LETZTE<br><span>FUNKE</span></div>
        <p class="title-sub">Ein Text-Adventure aus der Zeit nach dem großen Absturz.<br>Keine Ausrüstung. Kein Tutorial. Nur du und das was du entscheidest.</p>
      </div>
      <div class="title-menu">
        <button class="title-btn" id="btnNewGame">Neues Spiel</button>
        <button class="title-btn" id="btnContinue" ${continueDisabled?'disabled':''}>Fortsetzen</button>
      </div>
      <div class="title-foot">KAPITEL 1 · "STAUB UND STILLE"</div>
    </div>
  `;
  document.getElementById('btnNewGame').addEventListener('click', ()=>{
    clearSave();
    state = { node:'ch1_intro', flags:{}, inventory:[], visitedNodes:[] };
    goTo('ch1_intro');
  });
  document.getElementById('btnContinue').addEventListener('click', ()=>{
    if(loadGame()) goTo(state.node, true);
  });
}

function renderEnd(node){
  document.getElementById('chapterTag').textContent = '';
  const el = document.getElementById('screenInner');
  const nextBtn = node.nextChapter
    ? `<button class="title-btn" id="btnNextChapter">Nächstes Kapitel</button>`
    : `<button class="title-btn" disabled>Nächstes Kapitel folgt bald</button>`;
  el.innerHTML = `
    <div class="end-screen">
      <div class="end-badge">${node.badge || 'ENDE'}</div>
      <div class="end-title">${node.title}</div>
      <p class="end-text">${node.text}</p>
      <div class="title-menu" style="margin-top:20px">
        ${nextBtn}
        <button class="title-btn" id="btnRestart">Zurück zum Titel</button>
      </div>
    </div>
  `;
  if(node.nextChapter){
    document.getElementById('btnNextChapter').addEventListener('click', ()=>{
      goTo(node.nextChapter);
    });
  }
  document.getElementById('btnRestart').addEventListener('click', ()=>{
    goTo('title');
  });
}

/* Cleanup für "weiter"-Listener des vorherigen Nodes */
let advanceCleanup = null;

function renderNode(nodeId, skipAnim){
  const node = STORY[nodeId];
  if(!node){ console.error('Missing node:', nodeId); return; }

  // alte "weiter"-Listener des vorherigen Nodes entfernen
  if(advanceCleanup){ advanceCleanup(); advanceCleanup = null; }

  // Sound-Szene wechseln, falls der Node eine eigene definiert (sonst bleibt die aktuelle bestehen)
  if(node.sound) setScene(node.sound);

  // Musik-Ebene: nur am Titelbildschirm, sonst aus
  if(node.type === 'title'){ playMusic('title'); } else { stopMusic(); }

  if(node.type === 'title'){ renderTitle(); return; }
  if(node.type === 'end'){ renderEnd(node); return; }

  // apply onEnter effects
  if(node.onEnter){
    if(node.onEnter.items) node.onEnter.items.forEach(addItem);
    if(node.onEnter.removeItems) node.onEnter.removeItems.forEach(removeItem);
    if(node.onEnter.flags) node.onEnter.flags.forEach(f=>setFlag(f));
  }

  // Chapter-Tag nur ändern wenn der Node ein eigenes definiert (sonst letztes behalten)
  if(node.chapter) document.getElementById('chapterTag').textContent = node.chapter;

  const el = document.getElementById('screenInner');
  let html = '';

  if(node.location){
    html += `<div class="story-loc">${node.location}</div>`;
  }

  // Textblöcke: optionales showIf blendet Blöcke abhängig von Flags/Items ein
  const textBlocks = (node.text || []).filter(block =>
    typeof block === 'string' || checkCondition(block.showIf)
  );

  textBlocks.forEach(block=>{
    if(typeof block === 'string'){
      html += `<p class="story-p">${block}</p>`;
    } else if(block.speaker){
      html += `<p class="story-p"><span class="story-speaker">${block.speaker}:</span> ${block.line}</p>`;
    } else if(block.narrator){
      html += `<p class="story-p narrator">${block.narrator}</p>`;
    } else if(block.p){
      html += `<p class="story-p">${block.p}</p>`;
    } else if(block.divider){
      html += `<hr class="story-divider">`;
    }
  });

  el.innerHTML = html;

  setTimeout(()=>{
    el.querySelectorAll('p, .story-loc').forEach((p,i)=>{
      setTimeout(()=>p.classList.add('show'), i*70);
    });
  },10);

  const afterDelay = Math.min(600, textBlocks.length*70 + 200);

  setTimeout(()=>{
    if(node.next){
      const cp = document.createElement('div');
      cp.className = 'continue-prompt';
      cp.innerHTML = '▸ weiter';
      el.appendChild(cp);
      setTimeout(()=>cp.classList.add('show'), 100);
      // Klick irgendwo im Text ODER Leertaste/Enter — Listener werden
      // beim Weitergehen UND beim nächsten renderNode sauber entfernt
      const advance = ()=>{
        if(advanceCleanup){ advanceCleanup(); advanceCleanup = null; }
        goTo(node.next);
      };
      const keyHandler = (e)=>{
        if(e.key !== ' ' && e.key !== 'Enter') return;
        e.preventDefault();
        advance();
      };
      const clickHandler = ()=> advance();
      document.addEventListener('keydown', keyHandler);
      el.addEventListener('click', clickHandler);
      advanceCleanup = ()=>{
        document.removeEventListener('keydown', keyHandler);
        el.removeEventListener('click', clickHandler);
      };
    } else if(node.choices){
      // showIf blendet Choices komplett aus (statt sie gesperrt anzuzeigen) —
      // für Optionen, die Wissen spoilern würden, das der Spieler nicht hat
      const visibleChoices = node.choices.filter(c => checkCondition(c.showIf));
      const cWrap = document.createElement('div');
      cWrap.className = 'choices';
      visibleChoices.forEach((choice, i)=>{
        const locked = choice.require && !checkCondition(choice.require);
        const btn = document.createElement('button');
        btn.className = 'choice-btn' + (locked ? ' locked' : '') + (choice.danger ? ' danger' : '');
        let reqText = '';
        if(locked && choice.require){
          if(choice.require.item) reqText = `<span class="choice-req">Benötigt: ${ITEMS[choice.require.item]?.name || choice.require.item}</span>`;
          else reqText = `<span class="choice-req">Nicht verfügbar</span>`;
        }
        btn.innerHTML = `<span class="choice-num">${i+1}</span><span>${choice.label}${reqText}</span>`;
        if(!locked){
          btn.addEventListener('click', ()=>{
            if(choice.setFlag) setFlag(choice.setFlag);
            if(choice.addItem) addItem(choice.addItem);
            goTo(choice.to);
          });
        }
        cWrap.appendChild(btn);
      });
      el.appendChild(cWrap);
      setTimeout(()=>cWrap.classList.add('show'), 100);
    }
  }, afterDelay);
}

function goTo(nodeId, skipScroll){
  state.node = nodeId;
  if(!state.visitedNodes.includes(nodeId)) state.visitedNodes.push(nodeId);
  renderNode(nodeId);
  if(!skipScroll){
    document.getElementById('screen').scrollTo({top:0, behavior:'instant'});
  }
  // autosave on every node change (except title)
  if(nodeId !== 'title') saveGame();
}

/* ── INVENTORY DRAWER ─────────────────────────────────────── */

function renderDrawer(){
  const body = document.getElementById('drawerBody');
  let html = '<div class="drawer-section-title">Gegenstände</div>';
  if(state.inventory.length === 0){
    html += '<div class="inv-empty">Nichts bei dir. Noch nicht.</div>';
  } else {
    state.inventory.forEach(id=>{
      const item = ITEMS[id];
      if(!item) return;
      html += `<div class="inv-item"><div class="inv-item-name">${item.name}</div><div class="inv-item-desc">${item.desc}</div></div>`;
    });
  }
  body.innerHTML = html;
}

document.getElementById('btnInventory').addEventListener('click', ()=>{
  renderDrawer();
  document.getElementById('drawer').classList.add('show');
  document.getElementById('drawerOverlay').classList.add('show');
});
document.getElementById('drawerClose').addEventListener('click', closeDrawer);
document.getElementById('drawerOverlay').addEventListener('click', closeDrawer);
function closeDrawer(){
  document.getElementById('drawer').classList.remove('show');
  document.getElementById('drawerOverlay').classList.remove('show');
}
document.getElementById('btnSave').addEventListener('click', ()=>{
  if(state.node === 'title'){ showToast('⚠ Erst ein Spiel starten'); return; }
  saveGame();
});

<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalender — onlymakkus</title>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    :root, [data-theme="dark"]{
      --bg:#121214;--ink:#f2f0ec;--accent:#ff453a;--accent-text:#ff453a;--muted:#c4c2bc;--faint:#8f8d8a;--line:#2a2a2e;
      --ease-out:cubic-bezier(.23,1,.32,1);--ease:cubic-bezier(.4,0,.2,1);
      color-scheme:dark;
    }
    [data-theme="light"]{
      --bg:#f7f5f0;--ink:#14141a;--accent:#e8231b;--accent-text:#d01f18;--muted:#4a4a52;--faint:#6b6860;--line:#d8d5cc;
      color-scheme:light;
    }

    html{scroll-behavior:smooth}
    body{background:var(--bg);color:var(--ink);font-family:'Work Sans',sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased;min-height:100vh;padding-top:3px;transition:background .3s var(--ease),color .3s var(--ease)}
    ::selection{background:var(--accent);color:#fff}
    a{color:inherit;text-decoration:none}
    :focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

    /* ---------- TIMING LINE ---------- */
    .timing-track{position:fixed;top:0;left:0;right:0;height:3px;background:var(--line);z-index:1000;overflow:hidden;transition:background .3s var(--ease)}
    .timing-line{width:100%;height:100%;background:var(--accent);transform:scaleX(0);transform-origin:left;will-change:transform}

    /* ---------- NAV ---------- */
    nav{position:sticky;top:3px;z-index:100;padding:14px 28px;display:flex;justify-content:space-between;align-items:center;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);transition:background .3s var(--ease),border-color .3s var(--ease)}
    .nav-logo{position:relative;display:inline-flex;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:9px 0 8px}
    .nav-logo b{font-family:'Big Shoulders Display';font-weight:700;font-size:1.05rem;letter-spacing:.02em;color:var(--ink)}
    .nav-logo::after{content:'';position:absolute;left:0;right:0;bottom:5px;height:1px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .2s var(--ease-out)}
    .nav-logo:hover{color:var(--ink)}
    .nav-logo:hover::after{transform:scaleX(1)}
    .nav-right{display:flex;align-items:center;gap:14px}
    .theme-toggle{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:transparent;border:1px solid var(--line);padding:7px 11px;cursor:pointer;transition:border-color .18s var(--ease),color .18s var(--ease),transform .12s var(--ease-out)}
    .theme-toggle:hover{border-color:var(--accent);color:var(--accent-text)}
    .theme-toggle:active{transform:scale(.96)}
    .hamburger-btn{display:none}

    /* ---------- LAYOUT ---------- */
    main{max-width:1000px;margin:0 auto;padding:48px 24px 80px}
    .sheet-top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:32px;font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
    .sheet-top b{color:var(--accent-text);font-weight:500;font-variant-numeric:tabular-nums}
    .page-title{font-family:'Big Shoulders Display';font-weight:800;font-size:clamp(2.6rem,8vw,5rem);line-height:.88;letter-spacing:-.005em;text-transform:uppercase;margin-bottom:10px}
    .page-title em{font-style:normal;color:var(--accent)}
    .page-sub{font-size:.92rem;color:var(--muted);margin-bottom:40px;max-width:56ch;line-height:1.7}

    /* ---------- TIMELINE ---------- */
    .timeline{border:1px solid var(--line)}
    .tl-row{display:grid;grid-template-columns:110px 1fr auto;align-items:stretch;border-top:1px solid var(--line);transition:background .15s var(--ease)}
    .tl-row:first-child{border-top:none}
    .tl-row-link{text-decoration:none;color:inherit;cursor:pointer}
    .tl-row-link:hover{background:color-mix(in srgb,var(--accent) 5%,transparent)}
    .tl-month{padding:20px 20px;display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--line)}
    .tl-month-name{font-family:'Big Shoulders Display';font-weight:700;font-size:1.4rem;line-height:1;letter-spacing:.01em}
    .tl-month-sub{font-size:.54rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:4px}
    .tl-body{padding:20px 24px;display:flex;flex-direction:column;justify-content:center;gap:6px}
    .tl-exercise{font-family:'Big Shoulders Display';font-weight:700;font-size:1.3rem;letter-spacing:.005em;line-height:1}
    .tl-goal{font-size:.72rem;color:var(--muted)}
    .tl-meta{padding:20px 20px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;border-left:1px solid var(--line)}
    .tl-level{font-size:.56rem;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border:1px solid;white-space:nowrap;font-family:'IBM Plex Mono',monospace}

    /* aktiver Monat: edge-stroke, kein Vollflächen-Fill */
    .tl-row.active{box-shadow:inset 3px 0 0 var(--accent)}
    .tl-row.active .tl-exercise,.tl-row.active .tl-month-name{color:var(--accent)}

    /* Dezember Boss: invertiert statt neuer Farbe — bleibt im Rot/Tinte/Papier-System */
    .tl-row.december{background:var(--ink);color:var(--bg)}
    .tl-row.december .tl-month,.tl-row.december .tl-meta{border-color:color-mix(in srgb,var(--bg) 20%,transparent)}
    .tl-row.december .tl-month-sub,.tl-row.december .tl-goal{color:color-mix(in srgb,var(--bg) 55%,transparent)}
    .tl-row.december .tl-exercise,.tl-row.december .tl-month-name{color:var(--accent)}
    .tl-row.december.tl-row-link:hover{background:color-mix(in srgb,var(--ink) 88%,var(--accent))}

    /* Level-Badges (semantisch, klein & funktional — kein Bruch der Ein-Akzent-Regel) */
    .level-easy{color:#22c55e;border-color:#22c55e}
    .level-medium{color:#d4a400;border-color:#d4a400}
    [data-theme="dark"] .level-medium{color:#facc15;border-color:#facc15}
    .level-hard{color:var(--accent);border-color:var(--accent)}
    .tl-row.december .level-hard{color:var(--accent);border-color:var(--accent)}
    .level-boss{background:var(--accent);color:#fff;border-color:var(--accent)}

    /* ---------- VORSCHAU NAECHSTE SAISON ---------- */
    .preview-wrap{margin-top:48px}
    .preview-wrap[hidden]{display:none}
    .section-label{font-family:'IBM Plex Mono',monospace;font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:14px;padding-bottom:16px;border-bottom:1px solid var(--line)}
    .section-label b{color:var(--ink);font-weight:500}
    .section-label::after{content:'';flex:1;height:1px;background:var(--line)}
    .preview-note{font-size:.74rem;color:var(--muted);line-height:1.8;padding:16px 0 18px}
    .preview-list{border:1px solid var(--line);opacity:.55}
    .preview-list .tl-row-link{pointer-events:none}
    .preview-empty{border:1px solid var(--line);padding:24px 26px;font-size:.78rem;color:var(--muted);line-height:1.8}

    /* ---------- FOOTER ---------- */
    footer{max-width:1000px;margin:0 auto;padding:28px 24px;border-top:1px solid var(--line);display:flex;justify-content:center;gap:26px;font-family:'IBM Plex Mono',monospace;font-size:.58rem;color:var(--faint);letter-spacing:.12em;text-transform:uppercase;flex-wrap:wrap}
    footer a{position:relative;color:var(--faint);transition:color .15s var(--ease);padding:4px 0;display:inline-block}
    footer a::after{content:'';position:absolute;left:0;right:0;bottom:2px;height:1px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .18s var(--ease-out)}
    footer a:hover{color:var(--accent-text)}
    footer a:hover::after{transform:scaleX(1)}

    @media(max-width:600px){
      nav{padding:12px 18px}
      main{padding:36px 18px 60px}
      .tl-row{grid-template-columns:72px 1fr}
      .tl-meta{display:none}
      .tl-month{padding:16px 12px}
      .tl-body{padding:16px 16px}
    }

    /* ---------- SCROLL REVEAL ---------- */
    .reveal{opacity:0;transform:translateY(16px);transition:opacity .5s var(--ease-out),transform .5s var(--ease-out)}
    .reveal.in{opacity:1;transform:translateY(0)}

    /* ---------- ACCOUNT WIDGET ---------- */
    .navrow-right{display:flex;align-items:center;gap:14px}
    .acct{position:relative;display:flex;align-items:center}
    .acct-login{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);background:transparent;border:1px solid var(--line);padding:7px 11px;cursor:pointer;text-decoration:none;transition:border-color .18s var(--ease),color .18s var(--ease)}
    .acct-login:hover{border-color:var(--accent);color:var(--accent-text)}
    .acct-chip{display:flex;align-items:center;gap:9px;background:transparent;border:1px solid var(--line);padding:4px 12px 4px 4px;cursor:pointer;font-family:'IBM Plex Mono',monospace;color:var(--ink);transition:border-color .18s var(--ease)}
    .acct-chip:hover{border-color:var(--accent)}
    .acct-av{width:26px;height:26px;border-radius:50%;background:var(--accent);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:.9rem;color:#fff;flex-shrink:0;overflow:hidden;line-height:1}
    .acct-av.lg{width:44px;height:44px;font-size:1.4rem}
    .acct-av.has-img{color:transparent;background-color:var(--line)}
    .acct-name{font-size:.68rem;letter-spacing:.04em;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .acct-lvl{font-size:.52rem;letter-spacing:.08em;color:var(--accent-text);border:1px solid var(--line);padding:2px 7px;flex-shrink:0;font-variant-numeric:tabular-nums}
    .acct-menu{position:absolute;top:calc(100% + 10px);right:0;min-width:236px;background:var(--bg);border:1px solid var(--line);padding:8px;flex-direction:column;gap:2px;box-shadow:0 14px 40px rgba(0,0,0,.35);z-index:500;display:flex}
    .acct-menu-head{display:flex;align-items:center;gap:12px;padding:10px 10px 12px}
    .acct-menu-name{font-size:.82rem;letter-spacing:.02em;color:var(--ink)}
    .acct-menu-title{font-family:'IBM Plex Mono',monospace;font-style:italic;font-size:.7rem;color:var(--accent-text);margin-top:3px}
    .acct-xp{padding:8px 10px 12px;border-top:1px solid var(--line)}
    .acct-xp-info{display:flex;justify-content:space-between;font-size:.54rem;letter-spacing:.06em;color:var(--faint);text-transform:uppercase;margin-bottom:6px}
    .acct-xp-bar{height:4px;background:var(--line);overflow:hidden}
    .acct-xp-fill{height:100%;width:0;background:var(--accent);transition:width .5s var(--ease)}
    .acct-menu-item{display:block;width:100%;padding:10px;font-family:'IBM Plex Mono',monospace;font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);text-decoration:none;background:transparent;border:none;text-align:left;cursor:pointer;transition:background .15s var(--ease)}
    .acct-menu-item:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
    .acct-menu-item.danger{color:var(--faint)}
    .acct-menu-item.danger:hover{color:#ff5555;background:rgba(255,68,68,.09)}
    .acct-login[hidden],.acct-chip[hidden],.acct-menu[hidden],.acct-lvl[hidden],.acct-menu-title[hidden],.acct-xp[hidden]{display:none}
  </style>
</head>
<body>
<div class="timing-track"><div class="timing-line" id="timingLine"></div></div>
<div class="page-content visible" id="pageContent">
  <nav>
    <a class="nav-logo" href="crossfit.html">← <b>OM</b> / kalender</a>
    <div class="nav-right">
      <div class="acct" id="acct">
        <a class="acct-login" id="acctLogin" href="profile.html" hidden>Anmelden</a>
        <button class="acct-chip" id="acctChip" type="button" aria-haspopup="true" aria-expanded="false" hidden>
          <span class="acct-av" id="acctAv"></span>
          <span class="acct-name" id="acctName"></span>
          <span class="acct-lvl" id="acctLvl" hidden></span>
        </button>
        <div class="acct-menu" id="acctMenu" hidden>
          <div class="acct-menu-head">
            <span class="acct-av lg" id="acctAvLg"></span>
            <div>
              <div class="acct-menu-name" id="acctMenuName"></div>
              <div class="acct-menu-title" id="acctMenuTitle" hidden></div>
            </div>
          </div>
          <div class="acct-xp" id="acctXp" hidden>
            <div class="acct-xp-info"><span id="acctXpLabel">Level 1</span><span id="acctXpVal">0 / 100 XP</span></div>
            <div class="acct-xp-bar"><div class="acct-xp-fill" id="acctXpFill"></div></div>
          </div>
          <a class="acct-menu-item" href="profile.html">Profil</a>
          <button class="acct-menu-item danger" id="acctLogout" type="button">Abmelden</button>
        </div>
      </div>
      <button class="theme-toggle" id="themeToggle" title="Design wechseln">Light</button>
    </div>
  </nav>
  <main>
    <div class="sheet-top">
      <span>Jahresplan</span>
      <span>Saison <b id="seasonYear">2026</b></span>
    </div>
    <h1 class="page-title">Jahres<em>plan.</em></h1>
    <p class="page-sub">Alle Challenges der Saison im Überblick — was kommt, wie schwer wird's.</p>
    <div class="timeline reveal" id="timeline">
      <div class="tl-row"><div class="tl-month"></div><div class="tl-body" style="color:var(--faint);font-size:.78rem;">Lädt Saison…</div><div class="tl-meta"></div></div>
    </div>
    <section class="preview-wrap reveal" id="previewWrap" hidden>
      <div class="section-label">Vorschau <b id="previewYear"></b></div>
      <p class="preview-note" id="previewNote" hidden></p>
      <div id="previewBody"></div>
    </section>
  </main>
  <footer>
    <span>© <span id="footerYear">2026</span> onlymakkus.de</span>
    <a href="impressum.html">Impressum</a>
    <a href="datenschutz.html">Datenschutz</a>
    <span>made with pain &amp; supabase</span>
  </footer>
</div>
<script>
  const SB_URL='https://bsubsesbcxdaqofmkiqg.supabase.co';
  const SB_KEY='sb_publishable_fA2Dca6SVp0eB8k_WuqLrw_zplTnXBU';
  async function sbFetch(p,o={}){const r=await fetch(SB_URL+p,{...o,headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json',...o.headers}});const t=await r.text();if(!r.ok){console.error('sbFetch '+r.status+' '+p,t);throw new Error('HTTP '+r.status);}return t?JSON.parse(t):null}

  (function(){var y=new Date().getFullYear();var a=document.getElementById('seasonYear');if(a)a.textContent=y;var b=document.getElementById('footerYear');if(b)b.textContent=y;})();

  const MONTH_NAMES=['','JAN','FEB','MÄR','APR','MAI','JUN','JUL','AUG','SEP','OKT','NOV','DEZ'];
  function levelClass(goal,unit){
    // Heuristic: just cosmetic, based on goal size — could be refined later via DB field
    if(unit==='Reps')return goal>=400?'level-hard':goal>=250?'level-medium':'level-easy';
    return goal>=60?'level-medium':'level-easy';
  }

  // Vorschau auf die naechste Saison: ab 6. Dezember.
  // Nikolaus-Hinweis nur am 6. und 7.12., danach schlichte Ueberschrift.
  async function loadPreview(){
    const now=new Date(),month=now.getMonth()+1,day=now.getDate();
    if(month!==12||day<6)return;
    const nextYear=now.getFullYear()+1;
    const wrap=document.getElementById('previewWrap');
    const body=document.getElementById('previewBody');
    document.getElementById('previewYear').textContent='Saison '+nextYear;
    const nikolaus=(day===6||day===7);
    let rows=null;
    try{
      rows=await sbFetch(`/rest/v1/season_months?season_year=eq.${nextYear}&select=*,exercises(*)&order=month.asc`);
    }catch(e){ return; }
    if(rows&&rows.length){
      if(nikolaus){
        const note=document.getElementById('previewNote');
        note.hidden=false;
        note.textContent='🎁 Der Nikolaus hat euch was mitgebracht — so sieht '+nextYear+' aus.';
      }
      body.innerHTML='<div class="preview-list">'+rows.map(row=>{
        const monthLabel=MONTH_NAMES[row.month];
        if(row.is_december_vote){
          return `<div class="tl-row december">
            <div class="tl-month"><div class="tl-month-name">${monthLabel}</div><div class="tl-month-sub">🗳️ vote</div></div>
            <div class="tl-body"><div class="tl-exercise">Bonus Challenge — Gruppe voted</div><div class="tl-goal">Die härteste Challenge des Jahres — doppelte Punkte!</div></div>
            <div class="tl-meta"><span class="tl-level level-boss">Boss</span></div>
          </div>`;
        }
        const ex=row.exercises;
        if(!ex)return '';
        const goal=row.custom_goal||ex.default_goal;
        const goalText=ex.default_dual?`${goal} ${ex.default_unit} / Seite sammeln`:`${goal} ${ex.default_unit} gesamt sammeln`;
        const lvlClass=levelClass(goal,ex.default_unit);
        const lvlLabel=lvlClass==='level-easy'?'Einstieg':lvlClass==='level-medium'?'Mittel':'Hart';
        return `<div class="tl-row">
          <div class="tl-month"><div class="tl-month-name">${monthLabel}</div><div class="tl-month-sub"></div></div>
          <div class="tl-body"><div class="tl-exercise">${ex.name}</div><div class="tl-goal">${goalText}</div></div>
          <div class="tl-meta"><span class="tl-level ${lvlClass}">${lvlLabel}</span></div>
        </div>`;
      }).join('')+'</div>';
    } else {
      body.innerHTML='<div class="preview-empty">'+(nikolaus
        ? '🎁 Nikolaus war da — aber die Saison '+nextYear+' wird noch geplant.'
        : 'Die Saison '+nextYear+' wird noch geplant.')+'</div>';
    }
    wrap.hidden=false;
  }

  async function loadTimeline(){
    const now=new Date(),currentMonth=now.getMonth()+1,currentYear=now.getFullYear();
    const wrap=document.getElementById('timeline');
    try{
      const months=await sbFetch(`/rest/v1/season_months?season_year=eq.${currentYear}&select=*,exercises(*)&order=month.asc`);
      if(!months||!months.length){
        wrap.innerHTML='<div class="tl-row"><div class="tl-month"></div><div class="tl-body" style="color:var(--chalk);font-size:.7rem;">Für dieses Jahr ist noch keine Saison angelegt.</div><div class="tl-meta"></div></div>';
        return;
      }
      wrap.innerHTML=months.map(row=>{
        const isActive=row.month===currentMonth;
        const isDec=row.is_december_vote;
        const monthLabel=MONTH_NAMES[row.month];
        if(isDec){
          return `<div class="tl-row december ${isActive?'active':''}">
            <div class="tl-month"><div class="tl-month-name">${monthLabel}</div><div class="tl-month-sub">🗳️ vote</div></div>
            <div class="tl-body"><div class="tl-exercise">Bonus Challenge — Gruppe voted</div><div class="tl-goal">Die härteste Challenge des Jahres — doppelte Punkte!</div></div>
            <div class="tl-meta"><span class="tl-level level-boss">Boss</span></div>
          </div>`;
        }
        const ex=row.exercises;
        if(!ex)return '';
        const goal=row.custom_goal||ex.default_goal;
        const goalText=ex.default_dual?`${goal} ${ex.default_unit} / Seite sammeln`:`${goal} ${ex.default_unit} gesamt sammeln`;
        const lvlClass=levelClass(goal,ex.default_unit);
        const lvlLabel=lvlClass==='level-easy'?'Einstieg':lvlClass==='level-medium'?'Mittel':'Hart';
        const rowHTML=`
          <div class="tl-month"><div class="tl-month-name">${monthLabel}</div><div class="tl-month-sub">${isActive?'✦ aktiv':''}</div></div>
          <div class="tl-body"><div class="tl-exercise">${ex.name}</div><div class="tl-goal">${goalText}</div></div>
          <div class="tl-meta"><span class="tl-level ${lvlClass}">${lvlLabel}</span></div>
        `;
        if(isActive){
          return `<a href="challenge.html" class="tl-row active tl-row-link">${rowHTML}</a>`;
        }
        return `<div class="tl-row">${rowHTML}</div>`;
      }).join('');
    }catch(e){
      wrap.innerHTML='<div class="tl-row"><div class="tl-month"></div><div class="tl-body" style="color:var(--chalk);font-size:.7rem;">Fehler beim Laden.</div><div class="tl-meta"></div></div>';
    }
  }
  const THEME_KEY='om_cf_theme';
  const html=document.documentElement;
  const themeToggle=document.getElementById('themeToggle');
  const themeToggleMobile=document.getElementById('themeToggleMobile');
  function applyTheme(t){
    html.setAttribute('data-theme',t);
    const icon=t==='dark'?'Light':'Dark';
    themeToggle.textContent=icon;
    if(themeToggleMobile)themeToggleMobile.textContent=icon;
    localStorage.setItem(THEME_KEY,t);
  }
  applyTheme(localStorage.getItem(THEME_KEY)||'dark');
  themeToggle.addEventListener('click',()=>{
    applyTheme(html.getAttribute('data-theme')==='dark'?'light':'dark');
  });
  if(themeToggleMobile){
    themeToggleMobile.addEventListener('click',()=>{
      applyTheme(html.getAttribute('data-theme')==='dark'?'light':'dark');
    });
  }

  const hamburgerBtn=document.getElementById('hamburgerBtn');
  const mobileMenu=document.getElementById('mobileMenu');
  if(hamburgerBtn){
    hamburgerBtn.addEventListener('click',(e)=>{
      e.stopPropagation();
      mobileMenu.classList.toggle('open');
    });
    document.addEventListener('click',(e)=>{
      if(!mobileMenu.contains(e.target)&&!hamburgerBtn.contains(e.target)){
        mobileMenu.classList.remove('open');
      }
    });
  }

  loadTimeline();
  loadPreview();
</script>
  <script>
(function(){
  var SESS='om_profile_session';
  var acct=document.getElementById('acct'); if(!acct) return;
  var s=null; try{ s=JSON.parse(localStorage.getItem(SESS)||'null'); }catch(e){ s=null; }
  var login=document.getElementById('acctLogin');
  var chip=document.getElementById('acctChip');
  var menu=document.getElementById('acctMenu');
  function initial(n){ n=(n||'').trim(); return n?n.charAt(0).toUpperCase():'?'; }
  function paintAv(el){ if(!el)return; if(s&&s.avatarUrl){ el.style.backgroundImage='url("'+s.avatarUrl+'")'; el.classList.add('has-img'); el.textContent=''; } else { el.textContent=initial(s&&(s.displayName||s.name)); } }
  if(!s||!s.id){ if(login)login.hidden=false; return; }
  if(chip)chip.hidden=false;
  var name=s.displayName||s.name||'Profil';
  var full=name+(s.discriminator?('#'+s.discriminator):'');
  document.getElementById('acctName').textContent=name;
  document.getElementById('acctMenuName').textContent=full;
  paintAv(document.getElementById('acctAv'));
  paintAv(document.getElementById('acctAvLg'));
  // Avatar aus Supabase nachladen, falls Session veraltet ist (z.B. Upload auf anderem Gerät)
  (async function(){
    try{
      var rows=await sbFetch('/rest/v1/profiles?id=eq.'+s.id+'&select=avatar_url');
      if(rows&&rows.length&&(rows[0].avatar_url||null)!==(s.avatarUrl||null)){
        s.avatarUrl=rows[0].avatar_url||null;
        localStorage.setItem(SESS,JSON.stringify(s));
        paintAv(document.getElementById('acctAv'));
        paintAv(document.getElementById('acctAvLg'));
      }
    }catch(e){}
  })();
  if(s.level!=null){ var lv=document.getElementById('acctLvl'); lv.hidden=false; lv.textContent='LV '+s.level; }
  if(s.title){ var ti=document.getElementById('acctMenuTitle'); ti.hidden=false; ti.textContent=s.title; }
  if(s.xp!=null&&s.xpNext!=null){ var xp=document.getElementById('acctXp'); xp.hidden=false;
    document.getElementById('acctXpLabel').textContent='Level '+(s.level!=null?s.level:1);
    document.getElementById('acctXpVal').textContent=s.xp+' / '+s.xpNext+' XP';
    var pct=s.xpNext?Math.max(0,Math.min(100,s.xp/s.xpNext*100)):0;
    document.getElementById('acctXpFill').style.width=pct+'%';
  }
  function closeM(){ menu.hidden=true; chip.setAttribute('aria-expanded','false'); }
  function openM(){ menu.hidden=false; chip.setAttribute('aria-expanded','true'); }
  chip.addEventListener('click',function(e){ e.stopPropagation(); if(menu.hidden)openM();else closeM(); });
  document.addEventListener('click',function(e){ if(!acct.contains(e.target))closeM(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape')closeM(); });
  var lo=document.getElementById('acctLogout');
  if(lo)lo.addEventListener('click',function(){ try{localStorage.removeItem(SESS);}catch(e){} location.href='profile.html'; });
})();
</script>
<script>
  // ── TIMING LINE + SCROLL REVEAL (new, decorative only) ──
  (function(){
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var line = document.getElementById('timingLine');
    var ticking = false;
    function update(){
      ticking = false;
      if(reduceMotion){ line.style.transform = 'scaleX(1)'; return; }
      var total = document.documentElement.scrollHeight - window.innerHeight;
      var pct = total > 0 ? Math.min(1, Math.max(0, window.scrollY / total)) : 0;
      line.style.transform = 'scaleX(' + pct + ')';
    }
    window.addEventListener('scroll', function(){
      if(!ticking){ requestAnimationFrame(update); ticking = true; }
    }, {passive:true});
    window.addEventListener('resize', update);
    update();

    var els = document.querySelectorAll('.reveal');
    if(!('IntersectionObserver' in window)){
      els.forEach(function(el){ el.classList.add('in'); });
      return;
    }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){ entry.target.classList.add('in'); io.unobserve(entry.target); }
      });
    }, {threshold:.1});
    els.forEach(function(el){ io.observe(el); });
  })();
</script>

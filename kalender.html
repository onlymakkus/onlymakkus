<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalender — onlymakkus</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    :root, [data-theme="dark"]{
      --ink:#0b0b09;--paper:#f2ede4;--blaze:#ff4e1a;--blaze2:#ff6b3d;--chalk:#8f8a7d;
      --field:#16150f;--field2:#1d1c15;--line:#2b2920;
      --body-bg:var(--ink);--body-text:var(--paper);color-scheme:dark;
      --dec-month-bg:#1a1520;--dec-purple:#c084fc;--dec-body-bg:#12101a;
    }
    [data-theme="light"]{color-scheme:light;
      --ink:#2a2420;--paper:#2a2420;--blaze:#e8480f;--blaze2:#c93d0a;--chalk:#8a8078;
      --field:#ffffff;--field2:#fbf4ea;--line:#dcd4c6;
      --body-bg:#f4efe6;--body-text:#2a2420;
      --dec-month-bg:#f0e4f7;--dec-purple:#8B2FC9;--dec-body-bg:#f7f0fc;
    }

    html{scroll-behavior:smooth}
    body{background:var(--body-bg);color:var(--body-text);font-family:'DM Mono',monospace;overflow-x:hidden;transition:background .3s,color .3s;-webkit-font-smoothing:antialiased;min-height:100vh}
    ::selection{background:var(--blaze);color:var(--ink)}
    a{color:inherit}
    :focus-visible{outline:2px solid var(--blaze);outline-offset:3px}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

    .page-content{opacity:1}

    /* ---------- NAV ---------- */
    nav{position:sticky;top:0;z-index:100;padding:14px 28px;display:flex;justify-content:space-between;align-items:center;background:color-mix(in srgb,var(--body-bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
    .nav-logo{font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--body-text);text-decoration:none;display:flex;align-items:center;gap:8px}
    .nav-logo b{font-family:'Bebas Neue';font-size:1.15rem;letter-spacing:.06em;color:var(--blaze)}
    .nav-right{display:flex;align-items:center;gap:14px}
    .theme-toggle{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--chalk);background:transparent;border:1px solid var(--line);padding:7px 11px;cursor:pointer;transition:.2s}
    .theme-toggle:hover{border-color:var(--blaze);color:var(--blaze)}
    .hamburger-btn{display:none}

    /* ---------- LAYOUT ---------- */
    main{max-width:900px;margin:0 auto;padding:40px 24px 80px}
    .sheet-top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding-bottom:12px;border-bottom:2px solid var(--body-text);margin-bottom:26px}
    .sheet-meta{font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;color:var(--chalk)}
    .sheet-meta b{color:var(--blaze);font-weight:500}
    .page-title{font-family:'Bebas Neue';font-size:clamp(2.5rem,8vw,4.6rem);line-height:.9;letter-spacing:.02em;margin-bottom:8px}
    .page-title span{color:var(--blaze)}
    .page-sub{font-size:.72rem;color:var(--chalk);margin-bottom:34px;letter-spacing:.04em}

    /* ---------- TIMELINE ---------- */
    .timeline{border:1px solid var(--line)}
    .tl-row{display:grid;grid-template-columns:120px 1fr auto;align-items:stretch;border-top:1px solid var(--line)}
    .tl-row:first-child{border-top:none}
    .tl-row-link{text-decoration:none;color:inherit;cursor:pointer;transition:background .15s}
    .tl-row-link:hover{background:var(--field2)}
    .tl-month{background:var(--field);padding:20px 22px;display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--line)}
    .tl-month-name{font-family:'Bebas Neue';font-size:1.5rem;line-height:1;letter-spacing:.03em}
    .tl-month-sub{font-size:.54rem;letter-spacing:.15em;text-transform:uppercase;color:var(--chalk);margin-top:3px}
    .tl-body{background:var(--field);padding:20px 26px;display:flex;flex-direction:column;justify-content:center;gap:6px}
    .tl-exercise{font-family:'Bebas Neue';font-size:1.4rem;letter-spacing:.02em;line-height:1}
    .tl-goal{font-size:.64rem;color:var(--chalk)}
    .tl-meta{background:var(--field);padding:20px 22px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:8px;border-left:1px solid var(--line)}
    .tl-level{font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;padding:3px 10px;border:1px solid;white-space:nowrap}
    .tl-pts{font-size:.58rem;color:var(--chalk)}

    /* aktiver Monat */
    .tl-row.active .tl-month{background:var(--blaze)}
    .tl-row.active .tl-month-name{color:var(--ink)}
    .tl-row.active .tl-month-sub{color:rgba(11,11,9,.6)}
    [data-theme="light"] .tl-row.active .tl-month-name{color:#fff}
    [data-theme="light"] .tl-row.active .tl-month-sub{color:rgba(255,255,255,.75)}
    .tl-row.active .tl-body,.tl-row.active .tl-meta{background:var(--field2);box-shadow:inset 0 2px 0 var(--blaze),inset 0 -2px 0 var(--blaze)}
    .tl-row.active .tl-exercise{color:var(--blaze)}

    /* Dezember Boss */
    .tl-row.december .tl-month{background:var(--dec-month-bg);border-right-color:var(--dec-purple)}
    .tl-row.december .tl-month-name{color:var(--dec-purple)}
    .tl-row.december .tl-body,.tl-row.december .tl-meta{background:var(--dec-body-bg)}
    .tl-row.december .tl-exercise{color:var(--dec-purple)}

    /* Level-Farben (semantisch) */
    .level-easy{color:#22c55e;border-color:#22c55e}
    .level-medium{color:#d4a400;border-color:#d4a400}
    [data-theme="dark"] .level-medium{color:#facc15;border-color:#facc15}
    .level-hard{color:var(--blaze);border-color:var(--blaze)}
    .level-boss{color:var(--dec-purple);border-color:var(--dec-purple)}

    /* ---------- FOOTER ---------- */
    footer{padding:28px;border-top:1px solid var(--line);display:flex;justify-content:center;gap:26px;font-size:.58rem;color:var(--chalk);letter-spacing:.14em;text-transform:uppercase;flex-wrap:wrap}
    footer a{color:var(--chalk);text-decoration:none}
    footer a:hover{color:var(--blaze)}

    @media(max-width:600px){
      nav{padding:12px 18px}
      main{padding:32px 18px 60px}
      .tl-row{grid-template-columns:76px 1fr}
      .tl-meta{display:none}
      .tl-month{padding:16px 14px}
      .tl-body{padding:16px 16px}
    }

    /* ---------- ACCOUNT WIDGET ---------- */
    .navrow-right{display:flex;align-items:center;gap:14px}
    .acct{position:relative;display:flex;align-items:center}
    .acct-login{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--body-text);background:transparent;border:1px solid var(--line);padding:7px 11px;cursor:pointer;text-decoration:none;transition:border-color .2s,color .2s}
    .acct-login:hover{border-color:var(--blaze);color:var(--blaze)}
    .acct-chip{display:flex;align-items:center;gap:9px;background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;font-family:'DM Mono',monospace;color:var(--body-text);transition:border-color .2s}
    .acct-chip:hover{border-color:var(--blaze)}
    .acct-av{width:26px;height:26px;border-radius:50%;background:var(--blaze);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:.95rem;color:#0a0a08;flex-shrink:0;overflow:hidden;line-height:1}
    .acct-av.lg{width:44px;height:44px;font-size:1.5rem}
    .acct-av.has-img{color:transparent;background-color:var(--field2)}
    .acct-name{font-size:.68rem;letter-spacing:.06em;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .acct-lvl{font-size:.52rem;letter-spacing:.1em;color:var(--blaze);border:1px solid var(--line);border-radius:999px;padding:2px 7px;flex-shrink:0}
    .acct-menu{position:absolute;top:calc(100% + 10px);right:0;min-width:236px;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:8px;flex-direction:column;gap:2px;box-shadow:0 14px 40px rgba(0,0,0,.4);z-index:500;display:flex}
    [data-theme="light"] .acct-menu{box-shadow:0 14px 40px rgba(42,36,32,.16)}
    .acct-menu-head{display:flex;align-items:center;gap:12px;padding:10px 10px 12px}
    .acct-menu-name{font-size:.82rem;letter-spacing:.04em;color:var(--body-text)}
    .acct-menu-title{font-family:'DM Mono',monospace;font-style:italic;font-size:.72rem;color:var(--blaze);margin-top:3px;letter-spacing:.04em}
    .acct-xp{padding:8px 10px 12px;border-top:1px solid var(--line)}
    .acct-xp-info{display:flex;justify-content:space-between;font-size:.54rem;letter-spacing:.08em;color:var(--chalk);text-transform:uppercase;margin-bottom:6px}
    .acct-xp-bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
    .acct-xp-fill{height:100%;width:0;background:linear-gradient(90deg,var(--blaze),var(--blaze2));border-radius:999px;transition:width .5s ease}
    .acct-menu-item{display:block;width:100%;padding:10px;border-radius:8px;font-family:'DM Mono',monospace;font-size:.64rem;letter-spacing:.09em;text-transform:uppercase;color:var(--body-text);text-decoration:none;background:transparent;border:none;text-align:left;cursor:pointer;transition:background .15s,color .15s}
    .acct-menu-item:hover{background:var(--field2)}
    .acct-menu-item.danger{color:var(--chalk)}
    .acct-menu-item.danger:hover{color:#ff5555;background:rgba(255,68,68,.09)}
    .acct-login[hidden],.acct-chip[hidden],.acct-menu[hidden],.acct-lvl[hidden],.acct-menu-title[hidden],.acct-xp[hidden]{display:none}
  </style>
</head>
<body>
<div class="page-content visible" id="pageContent">
  <nav>
    <a class="nav-logo" href="crossfit.html">←&nbsp; <b>OM</b> / kalender</a>
    <div class="nav-right">
      <div class="acct" id="acct">
        <a class="acct-login" id="acctLogin" href="profile.html" hidden>Anmelden</a>
        <button class="acct-chip" id="acctChip" type="button" aria-haspopup="true" aria-expanded="false" hidden>
          <span class="acct-av" id="acctAv"></span>
          <span class="acct-name" id="acctName"></span>
          <span class="acct-lvl" id="acctLvl" hidden></span>
        </button>
        <div class="acct-menu" id="acctMenu" hidden>
          <div class="acct-menu-head">
            <span class="acct-av lg" id="acctAvLg"></span>
            <div>
              <div class="acct-menu-name" id="acctMenuName"></div>
              <div class="acct-menu-title" id="acctMenuTitle" hidden></div>
            </div>
          </div>
          <div class="acct-xp" id="acctXp" hidden>
            <div class="acct-xp-info"><span id="acctXpLabel">Level 1</span><span id="acctXpVal">0 / 100 XP</span></div>
            <div class="acct-xp-bar"><div class="acct-xp-fill" id="acctXpFill"></div></div>
          </div>
          <a class="acct-menu-item" href="profile.html">Profil</a>
          <button class="acct-menu-item danger" id="acctLogout" type="button">Abmelden</button>
        </div>
      </div>
      <button class="theme-toggle" id="themeToggle" title="Design wechseln">Light</button>
    </div>
  </nav>
  <main>
    <div class="sheet-top">
      <span class="sheet-meta">Jahresplan</span>
      <span class="sheet-meta">Saison <b>2026</b></span>
    </div>
    <h1 class="page-title">JAHRES<span>PLAN</span></h1>
    <p class="page-sub">Alle Challenges der Saison im Überblick — was kommt, wie schwer wird's.</p>
    <div class="timeline" id="timeline">
      <div class="tl-row"><div class="tl-month"></div><div class="tl-body" style="color:var(--chalk);font-size:.7rem;">Lädt Saison…</div><div class="tl-meta"></div></div>
    </div>
  </main>
  <footer>
    <span>© 2026 onlymakkus.de</span>
    <a href="impressum.html">Impressum</a>
    <a href="datenschutz.html">Datenschutz</a>
  </footer>
</div>
<script>
  const SB_URL='https://bsubsesbcxdaqofmkiqg.supabase.co';
  const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzdWJzZXNiY3hkYXFvZm1raXFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0NTY1NzIsImV4cCI6MjA5ODAzMjU3Mn0.yZsDpMlf5X6oMqY3p_QbTKd-V1-IPD2iH4sFz17VJVs';
  async function sbFetch(p,o={}){const r=await fetch(SB_URL+p,{...o,headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json',...o.headers}});const t=await r.text();return t?JSON.parse(t):null}

  const MONTH_NAMES=['','JAN','FEB','MÄR','APR','MAI','JUN','JUL','AUG','SEP','OKT','NOV','DEZ'];
  function levelClass(goal,unit){
    // Heuristic: just cosmetic, based on goal size — could be refined later via DB field
    if(unit==='Reps')return goal>=400?'level-hard':goal>=250?'level-medium':'level-easy';
    return goal>=60?'level-medium':'level-easy';
  }

  async function loadTimeline(){
    const now=new Date(),currentMonth=now.getMonth()+1,currentYear=now.getFullYear();
    const wrap=document.getElementById('timeline');
    try{
      const months=await sbFetch(`/rest/v1/season_months?season_year=eq.${currentYear}&select=*,exercises(*)&order=month.asc`);
      if(!months||!months.length){
        wrap.innerHTML='<div class="tl-row"><div class="tl-month"></div><div class="tl-body" style="color:var(--chalk);font-size:.7rem;">Für dieses Jahr ist noch keine Saison angelegt.</div><div class="tl-meta"></div></div>';
        return;
      }
      wrap.innerHTML=months.map(row=>{
        const isActive=row.month===currentMonth;
        const isDec=row.is_december_vote;
        const monthLabel=MONTH_NAMES[row.month];
        if(isDec){
          return `<div class="tl-row december ${isActive?'active':''}">
            <div class="tl-month"><div class="tl-month-name">${monthLabel}</div><div class="tl-month-sub">🗳️ vote</div></div>
            <div class="tl-body"><div class="tl-exercise">Bonus Challenge — Gruppe voted</div><div class="tl-goal">Die härteste Challenge des Jahres — doppelte Punkte!</div></div>
            <div class="tl-meta"><span class="tl-level level-boss">Boss</span><span class="tl-pts">bis 20 Pts</span></div>
          </div>`;
        }
        const ex=row.exercises;
        if(!ex)return '';
        const goal=row.custom_goal||ex.default_goal;
        const goalText=ex.default_dual?`${goal} ${ex.default_unit} / Seite sammeln`:`${goal} ${ex.default_unit} gesamt sammeln`;
        const lvlClass=levelClass(goal,ex.default_unit);
        const lvlLabel=lvlClass==='level-easy'?'Einstieg':lvlClass==='level-medium'?'Mittel':'Hart';
        const rowHTML=`
          <div class="tl-month"><div class="tl-month-name">${monthLabel}</div><div class="tl-month-sub">${isActive?'✦ aktiv':''}</div></div>
          <div class="tl-body"><div class="tl-exercise">${ex.name}</div><div class="tl-goal">${goalText}</div></div>
          <div class="tl-meta"><span class="tl-level ${lvlClass}">${lvlLabel}</span><span class="tl-pts">bis 10 Pts</span></div>
        `;
        if(isActive){
          return `<a href="challenge.html" class="tl-row active tl-row-link">${rowHTML}</a>`;
        }
        return `<div class="tl-row">${rowHTML}</div>`;
      }).join('');
    }catch(e){
      wrap.innerHTML='<div class="tl-row"><div class="tl-month"></div><div class="tl-body" style="color:var(--chalk);font-size:.7rem;">Fehler beim Laden.</div><div class="tl-meta"></div></div>';
    }
  }
  const THEME_KEY='om_cf_theme';
  const html=document.documentElement;
  const themeToggle=document.getElementById('themeToggle');
  const themeToggleMobile=document.getElementById('themeToggleMobile');
  function applyTheme(t){
    html.setAttribute('data-theme',t);
    const icon=t==='dark'?'Light':'Dark';
    themeToggle.textContent=icon;
    if(themeToggleMobile)themeToggleMobile.textContent=icon;
    localStorage.setItem(THEME_KEY,t);
  }
  applyTheme(localStorage.getItem(THEME_KEY)||'dark');
  themeToggle.addEventListener('click',()=>{
    applyTheme(html.getAttribute('data-theme')==='dark'?'light':'dark');
  });
  if(themeToggleMobile){
    themeToggleMobile.addEventListener('click',()=>{
      applyTheme(html.getAttribute('data-theme')==='dark'?'light':'dark');
    });
  }

  const hamburgerBtn=document.getElementById('hamburgerBtn');
  const mobileMenu=document.getElementById('mobileMenu');
  if(hamburgerBtn){
    hamburgerBtn.addEventListener('click',(e)=>{
      e.stopPropagation();
      mobileMenu.classList.toggle('open');
    });
    document.addEventListener('click',(e)=>{
      if(!mobileMenu.contains(e.target)&&!hamburgerBtn.contains(e.target)){
        mobileMenu.classList.remove('open');
      }
    });
  }

  loadTimeline();
</script>
  <script>
(function(){
  var SESS='om_profile_session';
  var acct=document.getElementById('acct'); if(!acct) return;
  var s=null; try{ s=JSON.parse(localStorage.getItem(SESS)||'null'); }catch(e){ s=null; }
  var login=document.getElementById('acctLogin');
  var chip=document.getElementById('acctChip');
  var menu=document.getElementById('acctMenu');
  function initial(n){ n=(n||'').trim(); return n?n.charAt(0).toUpperCase():'?'; }
  function paintAv(el){ if(!el)return; if(s&&s.avatarUrl){ el.style.backgroundImage='url("'+s.avatarUrl+'")'; el.classList.add('has-img'); el.textContent=''; } else { el.textContent=initial(s&&(s.displayName||s.name)); } }
  if(!s||!s.id){ if(login)login.hidden=false; return; }
  if(chip)chip.hidden=false;
  var name=s.displayName||s.name||'Profil';
  var full=name+(s.discriminator?('#'+s.discriminator):'');
  document.getElementById('acctName').textContent=name;
  document.getElementById('acctMenuName').textContent=full;
  paintAv(document.getElementById('acctAv'));
  paintAv(document.getElementById('acctAvLg'));
  if(s.level!=null){ var lv=document.getElementById('acctLvl'); lv.hidden=false; lv.textContent='LV '+s.level; }
  if(s.title){ var ti=document.getElementById('acctMenuTitle'); ti.hidden=false; ti.textContent=s.title; }
  if(s.xp!=null&&s.xpNext!=null){ var xp=document.getElementById('acctXp'); xp.hidden=false;
    document.getElementById('acctXpLabel').textContent='Level '+(s.level!=null?s.level:1);
    document.getElementById('acctXpVal').textContent=s.xp+' / '+s.xpNext+' XP';
    var pct=s.xpNext?Math.max(0,Math.min(100,s.xp/s.xpNext*100)):0;
    document.getElementById('acctXpFill').style.width=pct+'%';
  }
  function closeM(){ menu.hidden=true; chip.setAttribute('aria-expanded','false'); }
  function openM(){ menu.hidden=false; chip.setAttribute('aria-expanded','true'); }
  chip.addEventListener('click',function(e){ e.stopPropagation(); if(menu.hidden)openM();else closeM(); });
  document.addEventListener('click',function(e){ if(!acct.contains(e.target))closeM(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape')closeM(); });
  var lo=document.getElementById('acctLogout');
  if(lo)lo.addEventListener('click',function(){ try{localStorage.removeItem(SESS);}catch(e){} location.href='profile.html'; });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flappy Makkus — onlymakkus</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--black:#0b0b09;--cream:#f2ede4;--orange:#ff4e1a;--orange2:#ff6b3d;--muted:#8f8a7d;--card:#16150f;--card2:#1d1c15;--border:#2b2920}
    html,body{height:100%;height:calc(var(--vh, 1vh) * 100)}
    body{background:var(--black);color:var(--cream);font-family:'DM Mono',monospace;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;touch-action:none}
    .cursor{display:none}
    
    nav{padding:18px 40px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
    .nav-logo{font-family:'Bebas Neue';font-size:1.4rem;letter-spacing:.1em;color:var(--cream);text-decoration:none}
    .nav-center{font-family:'Bebas Neue';font-size:1.5rem;letter-spacing:.1em}
    .nav-center span{color:var(--orange)}
    .nav-links{display:flex;gap:20px}
    .nav-link{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);text-decoration:none;transition:color .2s}
    .nav-link:hover{color:var(--cream)}

    .topbar{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:color-mix(in srgb,var(--black) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
    .topbar-title{font-family:'Bebas Neue';letter-spacing:.15em;font-size:1.05rem;color:var(--cream)}
    .topbar-title span{color:var(--orange)}
    .tb-back{display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--cream);font-family:'DM Mono';font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;padding:0;text-decoration:none;transition:color .2s}
    .tb-back b{font-family:'Bebas Neue';font-size:1.15rem;letter-spacing:.06em;font-weight:400;color:var(--orange)}
    .tb-back:hover{color:var(--orange)}
    main{flex:1;display:flex;flex-direction:column;align-items:center;padding:24px 16px 60px;gap:20px;padding-top:66px}
    .score-bar{display:flex;gap:40px;justify-content:center}
    .stat-box{text-align:center}
    .stat-val{font-family:'Bebas Neue';font-size:2.2rem;color:var(--orange);line-height:1}
    .stat-label{font-size:.52rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:3px}
    .canvas-wrap{position:relative}
    canvas{border:1px solid rgba(255,78,26,.3);display:block;max-width:100%;touch-action:none}
    .go-overlay{display:none;position:absolute;inset:0;background:rgba(10,10,8,.92);flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
    .go-overlay.show{display:flex}
    .go-title{font-family:'Bebas Neue';font-size:3rem;color:var(--orange);line-height:1}
    .go-sub{font-size:.72rem;color:var(--muted)}
    .go-input{background:#1c1c18;border:1px solid var(--border);color:var(--cream);font-family:'DM Mono';font-size:.85rem;padding:11px 16px;outline:none;width:210px;text-align:center}
    .go-input:focus{border-color:var(--orange)}
    .go-btn{padding:11px 28px;background:var(--orange);color:var(--black);border:none;font-family:'DM Mono';font-size:.68rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;}
    .go-btn:hover{background:#ff6b3d}
    .go-skip{font-size:.6rem;color:var(--muted);background:none;border:none;text-decoration:underline}
    .go-msg{font-size:.62rem;color:var(--orange);min-height:16px}
    .hint{font-size:.62rem;color:var(--muted);text-align:center;letter-spacing:.06em;line-height:1.8}
    .btn-start{padding:13px 36px;background:var(--orange);color:var(--black);border:none;font-family:'DM Mono';font-size:.72rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;}
    .btn-start:hover{background:#ff6b3d}
    .section-label{font-size:.6rem;letter-spacing:.35em;text-transform:uppercase;color:var(--orange);margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:14px;width:100%}
    .section-label::before,.section-label::after{content:'';flex:0 0 32px;height:1px;background:var(--border)}
    .hi-table{width:100%;max-width:480px;display:flex;flex-direction:column;gap:2px}
    .hi-row{background:var(--card);padding:12px 18px;display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center}
    .hi-rank{font-family:'Bebas Neue';font-size:1.1rem;color:var(--muted)}
    .hi-name{font-size:.78rem}
    .hi-score{font-family:'Bebas Neue';font-size:1.3rem;color:var(--orange)}
    .hi-empty{padding:24px;text-align:center;font-size:.7rem;color:#444;font-style:italic;background:var(--card);width:100%;max-width:480px}
    footer{padding:32px 40px;border-top:1px solid var(--border);display:flex;justify-content:center;gap:32px;font-size:.6rem;color:var(--muted);letter-spacing:.15em;flex-wrap:wrap}
    footer a{color:var(--muted);text-decoration:none}
  
    /* --- account widget --- */
    .nav-right{display:flex;align-items:center;gap:14px}
    .acct{position:relative;display:flex;align-items:center}
    .acct-login{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--cream);background:transparent;border:1px solid var(--border);padding:7px 12px;cursor:pointer;text-decoration:none;transition:border-color .2s,color .2s}
    .acct-login:hover{border-color:var(--orange);color:var(--orange)}
    .acct-chip{display:flex;align-items:center;gap:9px;background:transparent;border:1px solid var(--border);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;font-family:'DM Mono',monospace;color:var(--cream);transition:border-color .2s}
    .acct-chip:hover{border-color:var(--orange)}
    .acct-av{width:26px;height:26px;border-radius:50%;background:var(--orange);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:.95rem;color:#0a0a08;flex-shrink:0;overflow:hidden;line-height:1}
    .acct-av.lg{width:44px;height:44px;font-size:1.5rem}
    .acct-av.has-img{color:transparent;background-color:var(--card2,#1c1c18)}
    .acct-name{font-size:.68rem;letter-spacing:.06em;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .acct-lvl{font-size:.52rem;letter-spacing:.1em;color:var(--orange);border:1px solid var(--border);border-radius:999px;padding:2px 7px;flex-shrink:0}
    .acct-menu{position:absolute;top:calc(100% + 10px);right:0;min-width:236px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px;flex-direction:column;gap:2px;box-shadow:0 14px 40px rgba(0,0,0,.5);z-index:9000;display:flex}
    .acct-menu-head{display:flex;align-items:center;gap:12px;padding:10px 10px 12px}
    .acct-menu-name{font-size:.82rem;letter-spacing:.04em;color:var(--cream)}
    .acct-menu-title{font-family:'DM Mono',monospace;font-style:italic;font-size:.72rem;letter-spacing:.04em;color:var(--orange);margin-top:2px}
    .acct-xp{padding:8px 10px 12px;border-top:1px solid var(--border)}
    .acct-xp-info{display:flex;justify-content:space-between;font-size:.54rem;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
    .acct-xp-bar{height:6px;border-radius:999px;background:var(--border);overflow:hidden}
    .acct-xp-fill{height:100%;width:0;background:linear-gradient(90deg,var(--orange),#ff6b3d);border-radius:999px;transition:width .5s ease}
    .acct-menu-item{display:block;width:100%;padding:10px;border-radius:8px;font-family:'DM Mono',monospace;font-size:.64rem;letter-spacing:.09em;text-transform:uppercase;color:var(--cream);text-decoration:none;background:transparent;border:none;text-align:left;cursor:pointer;transition:background .15s,color .15s}
    .acct-menu-item:hover{background:var(--card2,#1c1c18)}
    .acct-menu-item.danger{color:var(--muted)}
    .acct-menu-item.danger:hover{color:#ff5555;background:rgba(255,68,68,.09)}
    .acct-login[hidden],.acct-chip[hidden],.acct-menu[hidden],.acct-lvl[hidden],.acct-menu-title[hidden],.acct-xp[hidden]{display:none}

  </style>
</head>
<body>
<div class="cursor" id="cursor"></div>
<div class="topbar">
  <a class="tb-back" href="gaming.html">←&nbsp; <b>OM</b> / flappy</a>
  <div class="acct" id="acct">
        <a class="acct-login" id="acctLogin" href="profile.html" hidden>Anmelden</a>
        <button class="acct-chip" id="acctChip" type="button" aria-haspopup="true" aria-expanded="false" hidden>
          <span class="acct-av" id="acctAv"></span>
          <span class="acct-name" id="acctName"></span>
          <span class="acct-lvl" id="acctLvl" hidden></span>
        </button>
        <div class="acct-menu" id="acctMenu" hidden>
          <div class="acct-menu-head">
            <span class="acct-av lg" id="acctAvLg"></span>
            <div>
              <div class="acct-menu-name" id="acctMenuName"></div>
              <div class="acct-menu-title" id="acctMenuTitle" hidden></div>
            </div>
          </div>
          <div class="acct-xp" id="acctXp" hidden>
            <div class="acct-xp-info"><span id="acctXpLabel">Level 1</span><span id="acctXpVal">0 / 100 XP</span></div>
            <div class="acct-xp-bar"><div class="acct-xp-fill" id="acctXpFill"></div></div>
          </div>
          <a class="acct-menu-item" href="profile.html">Profil</a>
          <button class="acct-menu-item danger" id="acctLogout" type="button">Abmelden</button>
        </div>
      </div>
</div>
<main>
  <div class="score-bar">
    <div class="stat-box"><div class="stat-val" id="score">0</div><div class="stat-label">Punkte</div></div>
    <div class="stat-box"><div class="stat-val" id="hi">0</div><div class="stat-label">Rekord</div></div>
  </div>
  <div class="canvas-wrap">
    <canvas id="c" width="360" height="500"></canvas>
    <div class="go-overlay" id="go">
      <div class="go-title">GAME OVER</div>
      <div class="go-sub" id="go-sub">Score: 0</div>
      <div style="display:flex;flex-direction:column;gap:8px;align-items:center">
        <div style="font-size:.6rem;color:var(--muted);letter-spacing:.1em">Name für Highscore</div>
        <input class="go-input" id="go-name" placeholder="Dein Name" maxlength="20">
        <input type="text" id="go-hp" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0;">
        <button class="go-btn" id="go-save">Speichern →</button>
        <div class="go-msg" id="go-msg"></div>
        <button class="go-skip" id="go-skip">Überspringen</button>
      </div>
    </div>
  </div>
  <div style="text-align:center">
    <p class="hint">Space / Klick / Tap = Springen</p>
    <br>
    <button class="btn-start" id="btn-start">▶ Starten</button>
  </div>
  <div class="section-label">🏆 Top 10 Highscores</div>
  <div class="hi-table" id="scores"><div class="hi-empty">Lädt…</div></div>
</main>
<footer><span>© 2026 onlymakkus.de</span><a href="impressum.html">Impressum</a><a href="datenschutz.html">Datenschutz</a></footer>
<script>
const SB='https://bsubsesbcxdaqofmkiqg.supabase.co';
const KEY='sb_publishable_fA2Dca6SVp0eB8k_WuqLrw_zplTnXBU';
function omSession(){try{return JSON.parse(localStorage.getItem('om_profile_session')||'null')}catch{return null}}
async function sbFetch(p,o={}){const r=await fetch(SB+p,{...o,headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':o.prefer||'',...o.headers}});const t=await r.text();return t?JSON.parse(t):null}
function setVH(){const h=(window.visualViewport?window.visualViewport.height:window.innerHeight);document.documentElement.style.setProperty('--vh',(h*0.01)+'px')}
setVH();
window.addEventListener('resize',setVH);
window.addEventListener('orientationchange',setVH);
if(window.visualViewport)window.visualViewport.addEventListener('resize',setVH);

const cursor=document.getElementById('cursor');
document.addEventListener('mousemove',e=>{cursor.style.left=e.clientX+'px';cursor.style.top=e.clientY+'px'});
document.querySelectorAll('a,button').forEach(el=>{el.addEventListener('mouseenter',()=>cursor.classList.add('big'));el.addEventListener('mouseleave',()=>cursor.classList.remove('big'))});

async function loadScores(){
  try{
    const data=await sbFetch('/rest/v1/snake_scores?name=like.FB:*&select=*&order=score.desc&limit=10');
    const scores=(data||[]).map(s=>({...s,name:s.name.replace('FB:','')}));
    const medals=['🥇','🥈','🥉'];
    const el=document.getElementById('scores');
    if(!scores.length){el.innerHTML='<div class="hi-empty">Noch keine Scores — sei der Erste! 🐦</div>';return}
    el.innerHTML=scores.map((s,i)=>`<div class="hi-row"><div class="hi-rank">${medals[i]||'#'+(i+1)}</div><div class="hi-name">${s.name}</div><div class="hi-score">${s.score}</div></div>`).join('');
  }catch{document.getElementById('scores').innerHTML='<div class="hi-empty">Fehler beim Laden.</div>'}
}
loadScores();

const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
const GRAV=0.45,FLAP=-8,PIPE_W=60,GAP=150,PIPE_SPEED=2.6,PIPE_INTERVAL=110;

let bird,pipes,score,hi=parseInt(localStorage.getItem('fb_hi')||'0'),running,frame,over,gameStartTime=0;
document.getElementById('hi').textContent=hi;

function init(){
  bird={x:80,y:H/2,vy:0,r:14};
  pipes=[];score=0;running=false;over=false;frame=0;
  document.getElementById('score').textContent=0;
  document.getElementById('go').classList.remove('show');
  draw();
}

function start(){
  if(running)return;
  init();running=true;gameStartTime=Date.now();
  loop=requestAnimationFrame(update);
}

function flap(){
  if(!running){start();return}
  if(over)return;
  bird.vy=FLAP;
}

let loop;
function update(){
  if(!running)return;
  frame++;
  bird.vy+=GRAV;
  bird.y+=bird.vy;

  if(frame%PIPE_INTERVAL===0){
    const gapY=60+Math.random()*(H-GAP-120);
    pipes.push({x:W,gapY,passed:false});
  }
  pipes.forEach(p=>p.x-=PIPE_SPEED);
  pipes=pipes.filter(p=>p.x>-PIPE_W);

  pipes.forEach(p=>{
    if(!p.passed&&p.x+PIPE_W<bird.x){p.passed=true;score++;document.getElementById('score').textContent=score}
  });

  // Collision: floor/ceiling
  if(bird.y-bird.r<0||bird.y+bird.r>H){end();return}
  // Collision: pipes
  for(const p of pipes){
    if(bird.x+bird.r>p.x&&bird.x-bird.r<p.x+PIPE_W){
      if(bird.y-bird.r<p.gapY||bird.y+bird.r>p.gapY+GAP){end();return}
    }
  }

  draw();
  loop=requestAnimationFrame(update);
}

function draw(){
  // sky
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#0a0a08');grad.addColorStop(1,'#1a0c06');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

  // pipes
  pipes.forEach(p=>{
    ctx.fillStyle='#ff4e1a';
    ctx.fillRect(p.x,0,PIPE_W,p.gapY);
    ctx.fillRect(p.x,p.gapY+GAP,PIPE_W,H-p.gapY-GAP);
    ctx.fillStyle='#ff8060';
    ctx.fillRect(p.x-3,p.gapY-16,PIPE_W+6,16);
    ctx.fillRect(p.x-3,p.gapY+GAP,PIPE_W+6,16);
  });

  // bird
  ctx.save();
  ctx.translate(bird.x,bird.y);
  const rot=Math.min(Math.max(bird.vy*3,-25),90);
  ctx.rotate(rot*Math.PI/180);
  ctx.fillStyle='#f2ede4';
  ctx.beginPath();ctx.arc(0,0,bird.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ff4e1a';
  ctx.beginPath();ctx.moveTo(bird.r-2,0);ctx.lineTo(bird.r+8,-4);ctx.lineTo(bird.r+8,4);ctx.fill();
  ctx.fillStyle='#0a0a08';
  ctx.beginPath();ctx.arc(4,-4,2.5,0,Math.PI*2);ctx.fill();
  ctx.restore();

  if(!running&&!over){
    ctx.fillStyle='rgba(10,10,8,0.5)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ff4e1a';ctx.font='bold 16px "DM Mono"';ctx.textAlign='center';
    ctx.fillText('▶ TAP ZUM STARTEN',W/2,H/2);
  }
}

function end(){
  running=false;over=true;
  cancelAnimationFrame(loop);
  if(score>hi){hi=score;localStorage.setItem('fb_hi',hi);document.getElementById('hi').textContent=hi}
  document.getElementById('go-sub').textContent='Score: '+score+' Punkte';
  {const _s=omSession();const _n=document.getElementById('go-name');const _lbl=_n.previousElementSibling;if(_s){_n.style.display='none';if(_lbl)_lbl.textContent='Wird als '+(_s.displayName||_s.name)+' gespeichert';}else{_n.style.display='';_n.value=localStorage.getItem('fb_name')||'';}}
  document.getElementById('go-msg').textContent='';
  document.getElementById('go').classList.add('show');
}

document.addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();flap()}});
canvas.addEventListener('mousedown',flap);
canvas.addEventListener('touchstart',e=>{e.preventDefault();flap()},{passive:false});
document.getElementById('btn-start').addEventListener('click',start);

document.getElementById('go-save').addEventListener('click',async()=>{
  const name=document.getElementById('go-name').value.trim(),msg=document.getElementById('go-msg');
  const hp=document.getElementById('go-hp').value;
  if(hp){msg.textContent='✓ Gespeichert!';setTimeout(()=>{document.getElementById('go').classList.remove('show');init()},1200);return}
  if(!name && !omSession()){msg.textContent='⚠ Name eingeben';return}
  const elapsed=(Date.now()-gameStartTime)/1000;
  const minTimeNeeded=score*1.5;
  if(gameStartTime===0||elapsed<minTimeNeeded||elapsed<1){msg.textContent='⚠ Ungültiger Spielverlauf';return}
  if(score>2000){msg.textContent='⚠ Score außerhalb des möglichen Bereichs';return}
  document.getElementById('go-save').textContent='…';
  try{
    await sbFetch('/rest/v1/snake_scores',{method:'POST',prefer:'return=minimal',body:JSON.stringify((()=>{const _s=omSession();return _s?{name:'FB:'+(_s.displayName||_s.name),score,profile_id:_s.id}:{name:'FB:'+name,score};})())});
    localStorage.setItem('fb_name',name);msg.textContent='✓ Gespeichert!';await loadScores();
    setTimeout(()=>{document.getElementById('go').classList.remove('show');init()},1200);
  }catch{msg.textContent='❌ Fehler'}
  document.getElementById('go-save').textContent='Speichern →';
});
document.getElementById('go-skip').addEventListener('click',()=>{document.getElementById('go').classList.remove('show');init()});

init();
</script>
  <script>
(function(){
  var SESS='om_profile_session';
  var acct=document.getElementById('acct'); if(!acct) return;
  var s=null; try{ s=JSON.parse(localStorage.getItem(SESS)||'null'); }catch(e){ s=null; }
  var login=document.getElementById('acctLogin');
  var chip=document.getElementById('acctChip');
  var menu=document.getElementById('acctMenu');
  function initial(n){ n=(n||'').trim(); return n?n.charAt(0).toUpperCase():'?'; }
  function paintAv(el){ if(!el)return; if(s&&s.avatarUrl){ el.style.backgroundImage='url("'+s.avatarUrl+'")'; el.classList.add('has-img'); el.textContent=''; } else { el.textContent=initial(s&&(s.displayName||s.name)); } }
  if(!s||!s.id){ if(login)login.hidden=false; return; }
  if(chip)chip.hidden=false;
  var name=s.displayName||s.name||'Profil';
  var full=name+(s.discriminator?('#'+s.discriminator):'');
  document.getElementById('acctName').textContent=name;
  document.getElementById('acctMenuName').textContent=full;
  paintAv(document.getElementById('acctAv'));
  paintAv(document.getElementById('acctAvLg'));
  if(s.level!=null){ var lv=document.getElementById('acctLvl'); lv.hidden=false; lv.textContent='LV '+s.level; }
  if(s.title){ var ti=document.getElementById('acctMenuTitle'); ti.hidden=false; ti.textContent=s.title; }
  if(s.xp!=null&&s.xpNext!=null){ var xp=document.getElementById('acctXp'); xp.hidden=false;
    document.getElementById('acctXpLabel').textContent='Level '+(s.level!=null?s.level:1);
    document.getElementById('acctXpVal').textContent=s.xp+' / '+s.xpNext+' XP';
    var pct=s.xpNext?Math.max(0,Math.min(100,s.xp/s.xpNext*100)):0;
    document.getElementById('acctXpFill').style.width=pct+'%';
  }
  function closeM(){ menu.hidden=true; chip.setAttribute('aria-expanded','false'); }
  function openM(){ menu.hidden=false; chip.setAttribute('aria-expanded','true'); }
  chip.addEventListener('click',function(e){ e.stopPropagation(); if(menu.hidden)openM();else closeM(); });
  document.addEventListener('click',function(e){ if(!acct.contains(e.target))closeM(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape')closeM(); });
  var lo=document.getElementById('acctLogout');
  if(lo)lo.addEventListener('click',function(){ try{localStorage.removeItem(SESS);}catch(e){} location.href='profile.html'; });
})();
</script>
</body>
</html>

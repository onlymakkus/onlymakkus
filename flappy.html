<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flappy Makkus — onlymakkus</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--black:#0a0a08;--cream:#f2ede4;--orange:#ff4e1a;--muted:#9a9488;--card:#141410;--border:rgba(255,255,255,0.08)}
    body{background:var(--black);color:var(--cream);font-family:'DM Mono',monospace;min-height:100vh;display:flex;flex-direction:column;cursor:none;overflow-x:hidden;touch-action:none}
    .cursor{position:fixed;width:12px;height:12px;background:var(--orange);border-radius:50%;pointer-events:none;z-index:10000;transform:translate(-50%,-50%);mix-blend-mode:difference;transition:width .15s,height .15s}
    .cursor.big{width:36px;height:36px}
    nav{padding:18px 40px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
    .nav-logo{font-family:'Bebas Neue';font-size:1.4rem;letter-spacing:.1em;color:var(--cream);text-decoration:none}
    .nav-center{font-family:'Bebas Neue';font-size:1.5rem;letter-spacing:.1em}
    .nav-center span{color:var(--orange)}
    .nav-links{display:flex;gap:20px}
    .nav-link{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);text-decoration:none;transition:color .2s}
    .nav-link:hover{color:var(--cream)}
    main{flex:1;display:flex;flex-direction:column;align-items:center;padding:24px 16px 60px;gap:20px}
    .score-bar{display:flex;gap:40px;justify-content:center}
    .stat-box{text-align:center}
    .stat-val{font-family:'Bebas Neue';font-size:2.2rem;color:var(--orange);line-height:1}
    .stat-label{font-size:.52rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:3px}
    .canvas-wrap{position:relative}
    canvas{border:1px solid rgba(255,78,26,.3);display:block;max-width:100%;touch-action:none}
    .go-overlay{display:none;position:absolute;inset:0;background:rgba(10,10,8,.92);flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
    .go-overlay.show{display:flex}
    .go-title{font-family:'Bebas Neue';font-size:3rem;color:var(--orange);line-height:1}
    .go-sub{font-size:.72rem;color:var(--muted)}
    .go-input{background:#1c1c18;border:1px solid var(--border);color:var(--cream);font-family:'DM Mono';font-size:.85rem;padding:11px 16px;outline:none;width:210px;text-align:center}
    .go-input:focus{border-color:var(--orange)}
    .go-btn{padding:11px 28px;background:var(--orange);color:var(--black);border:none;font-family:'DM Mono';font-size:.68rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;cursor:none}
    .go-btn:hover{background:#ff6b3d}
    .go-skip{font-size:.6rem;color:var(--muted);background:none;border:none;cursor:none;text-decoration:underline}
    .go-msg{font-size:.62rem;color:var(--orange);min-height:16px}
    .hint{font-size:.62rem;color:var(--muted);text-align:center;letter-spacing:.06em;line-height:1.8}
    .btn-start{padding:13px 36px;background:var(--orange);color:var(--black);border:none;font-family:'DM Mono';font-size:.72rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;cursor:none}
    .btn-start:hover{background:#ff6b3d}
    .section-label{font-size:.6rem;letter-spacing:.35em;text-transform:uppercase;color:var(--orange);margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:14px;width:100%}
    .section-label::before,.section-label::after{content:'';flex:0 0 32px;height:1px;background:var(--border)}
    .hi-table{width:100%;max-width:480px;display:flex;flex-direction:column;gap:2px}
    .hi-row{background:var(--card);padding:12px 18px;display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center}
    .hi-rank{font-family:'Bebas Neue';font-size:1.1rem;color:var(--muted)}
    .hi-name{font-size:.78rem}
    .hi-score{font-family:'Bebas Neue';font-size:1.3rem;color:var(--orange)}
    .hi-empty{padding:24px;text-align:center;font-size:.7rem;color:#444;font-style:italic;background:var(--card);width:100%;max-width:480px}
    footer{padding:32px 40px;border-top:1px solid var(--border);display:flex;justify-content:center;gap:32px;font-size:.6rem;color:var(--muted);letter-spacing:.15em;flex-wrap:wrap}
    footer a{color:var(--muted);text-decoration:none}
  </style>
</head>
<body>
<div class="cursor" id="cursor"></div>
<nav>
  <a class="nav-logo" href="index.html">← OM</a>
  <div class="nav-center">FLAPPY <span>Makkus</span></div>
  <div class="nav-links">
    <a class="nav-link" href="gaming.html">Gaming Hub</a>
    <a class="nav-link" href="snake.html">Snake</a>
    <a class="nav-link" href="wordle.html">Wordle</a>
    <a class="nav-link" href="blockblast.html">Block Blast</a>
  </div>
</nav>
<main>
  <div class="score-bar">
    <div class="stat-box"><div class="stat-val" id="score">0</div><div class="stat-label">Punkte</div></div>
    <div class="stat-box"><div class="stat-val" id="hi">0</div><div class="stat-label">Rekord</div></div>
  </div>
  <div class="canvas-wrap">
    <canvas id="c" width="360" height="500"></canvas>
    <div class="go-overlay" id="go">
      <div class="go-title">GAME OVER</div>
      <div class="go-sub" id="go-sub">Score: 0</div>
      <div style="display:flex;flex-direction:column;gap:8px;align-items:center">
        <div style="font-size:.6rem;color:var(--muted);letter-spacing:.1em">Name für Highscore</div>
        <input class="go-input" id="go-name" placeholder="Dein Name" maxlength="20">
        <input type="text" id="go-hp" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0;">
        <button class="go-btn" id="go-save">Speichern →</button>
        <div class="go-msg" id="go-msg"></div>
        <button class="go-skip" id="go-skip">Überspringen</button>
      </div>
    </div>
  </div>
  <div style="text-align:center">
    <p class="hint">Space / Klick / Tap = Springen</p>
    <br>
    <button class="btn-start" id="btn-start">▶ Starten</button>
  </div>
  <div class="section-label">🏆 Top 10 Highscores</div>
  <div class="hi-table" id="scores"><div class="hi-empty">Lädt…</div></div>
</main>
<footer><span>© 2026 onlymakkus.de</span><a href="impressum.html">Impressum</a><a href="datenschutz.html">Datenschutz</a></footer>
<script>
const SB='https://bsubsesbcxdaqofmkiqg.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzdWJzZXNiY3hkYXFvZm1raXFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0NTY1NzIsImV4cCI6MjA5ODAzMjU3Mn0.yZsDpMlf5X6oMqY3p_QbTKd-V1-IPD2iH4sFz17VJVs';
async function sbFetch(p,o={}){const r=await fetch(SB+p,{...o,headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':o.prefer||'',...o.headers}});const t=await r.text();return t?JSON.parse(t):null}
const cursor=document.getElementById('cursor');
document.addEventListener('mousemove',e=>{cursor.style.left=e.clientX+'px';cursor.style.top=e.clientY+'px'});
document.querySelectorAll('a,button').forEach(el=>{el.addEventListener('mouseenter',()=>cursor.classList.add('big'));el.addEventListener('mouseleave',()=>cursor.classList.remove('big'))});

async function loadScores(){
  try{
    const data=await sbFetch('/rest/v1/snake_scores?name=like.FB:*&select=*&order=score.desc&limit=10');
    const scores=(data||[]).map(s=>({...s,name:s.name.replace('FB:','')}));
    const medals=['🥇','🥈','🥉'];
    const el=document.getElementById('scores');
    if(!scores.length){el.innerHTML='<div class="hi-empty">Noch keine Scores — sei der Erste! 🐦</div>';return}
    el.innerHTML=scores.map((s,i)=>`<div class="hi-row"><div class="hi-rank">${medals[i]||'#'+(i+1)}</div><div class="hi-name">${s.name}</div><div class="hi-score">${s.score}</div></div>`).join('');
  }catch{document.getElementById('scores').innerHTML='<div class="hi-empty">Fehler beim Laden.</div>'}
}
loadScores();

const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
const GRAV=0.45,FLAP=-8,PIPE_W=60,GAP=150,PIPE_SPEED=2.6,PIPE_INTERVAL=110;

let bird,pipes,score,hi=parseInt(localStorage.getItem('fb_hi')||'0'),running,frame,over,gameStartTime=0;
document.getElementById('hi').textContent=hi;

function init(){
  bird={x:80,y:H/2,vy:0,r:14};
  pipes=[];score=0;running=false;over=false;frame=0;
  document.getElementById('score').textContent=0;
  document.getElementById('go').classList.remove('show');
  draw();
}

function start(){
  if(running)return;
  init();running=true;gameStartTime=Date.now();
  loop=requestAnimationFrame(update);
}

function flap(){
  if(!running){start();return}
  if(over)return;
  bird.vy=FLAP;
}

let loop;
function update(){
  if(!running)return;
  frame++;
  bird.vy+=GRAV;
  bird.y+=bird.vy;

  if(frame%PIPE_INTERVAL===0){
    const gapY=60+Math.random()*(H-GAP-120);
    pipes.push({x:W,gapY,passed:false});
  }
  pipes.forEach(p=>p.x-=PIPE_SPEED);
  pipes=pipes.filter(p=>p.x>-PIPE_W);

  pipes.forEach(p=>{
    if(!p.passed&&p.x+PIPE_W<bird.x){p.passed=true;score++;document.getElementById('score').textContent=score}
  });

  // Collision: floor/ceiling
  if(bird.y-bird.r<0||bird.y+bird.r>H){end();return}
  // Collision: pipes
  for(const p of pipes){
    if(bird.x+bird.r>p.x&&bird.x-bird.r<p.x+PIPE_W){
      if(bird.y-bird.r<p.gapY||bird.y+bird.r>p.gapY+GAP){end();return}
    }
  }

  draw();
  loop=requestAnimationFrame(update);
}

function draw(){
  // sky
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#0a0a08');grad.addColorStop(1,'#1a0c06');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

  // pipes
  pipes.forEach(p=>{
    ctx.fillStyle='#ff4e1a';
    ctx.fillRect(p.x,0,PIPE_W,p.gapY);
    ctx.fillRect(p.x,p.gapY+GAP,PIPE_W,H-p.gapY-GAP);
    ctx.fillStyle='#ff8060';
    ctx.fillRect(p.x-3,p.gapY-16,PIPE_W+6,16);
    ctx.fillRect(p.x-3,p.gapY+GAP,PIPE_W+6,16);
  });

  // bird
  ctx.save();
  ctx.translate(bird.x,bird.y);
  const rot=Math.min(Math.max(bird.vy*3,-25),90);
  ctx.rotate(rot*Math.PI/180);
  ctx.fillStyle='#f2ede4';
  ctx.beginPath();ctx.arc(0,0,bird.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ff4e1a';
  ctx.beginPath();ctx.moveTo(bird.r-2,0);ctx.lineTo(bird.r+8,-4);ctx.lineTo(bird.r+8,4);ctx.fill();
  ctx.fillStyle='#0a0a08';
  ctx.beginPath();ctx.arc(4,-4,2.5,0,Math.PI*2);ctx.fill();
  ctx.restore();

  if(!running&&!over){
    ctx.fillStyle='rgba(10,10,8,0.5)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ff4e1a';ctx.font='bold 16px "DM Mono"';ctx.textAlign='center';
    ctx.fillText('▶ TAP ZUM STARTEN',W/2,H/2);
  }
}

function end(){
  running=false;over=true;
  cancelAnimationFrame(loop);
  if(score>hi){hi=score;localStorage.setItem('fb_hi',hi);document.getElementById('hi').textContent=hi}
  document.getElementById('go-sub').textContent='Score: '+score+' Punkte';
  document.getElementById('go-name').value=localStorage.getItem('fb_name')||'';
  document.getElementById('go-msg').textContent='';
  document.getElementById('go').classList.add('show');
}

document.addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();flap()}});
canvas.addEventListener('mousedown',flap);
canvas.addEventListener('touchstart',e=>{e.preventDefault();flap()},{passive:false});
document.getElementById('btn-start').addEventListener('click',start);

document.getElementById('go-save').addEventListener('click',async()=>{
  const name=document.getElementById('go-name').value.trim(),msg=document.getElementById('go-msg');
  const hp=document.getElementById('go-hp').value;
  if(hp){msg.textContent='✓ Gespeichert!';setTimeout(()=>{document.getElementById('go').classList.remove('show');init()},1200);return}
  if(!name){msg.textContent='⚠ Name eingeben';return}
  const elapsed=(Date.now()-gameStartTime)/1000;
  const minTimeNeeded=score*1.5;
  if(gameStartTime===0||elapsed<minTimeNeeded||elapsed<1){msg.textContent='⚠ Ungültiger Spielverlauf';return}
  if(score>2000){msg.textContent='⚠ Score außerhalb des möglichen Bereichs';return}
  document.getElementById('go-save').textContent='…';
  try{
    await sbFetch('/rest/v1/snake_scores',{method:'POST',prefer:'return=minimal',body:JSON.stringify({name:'FB:'+name,score})});
    localStorage.setItem('fb_name',name);msg.textContent='✓ Gespeichert!';await loadScores();
    setTimeout(()=>{document.getElementById('go').classList.remove('show');init()},1200);
  }catch{msg.textContent='❌ Fehler'}
  document.getElementById('go-save').textContent='Speichern →';
});
document.getElementById('go-skip').addEventListener('click',()=>{document.getElementById('go').classList.remove('show');init()});

init();
</script>
</body>
</html>

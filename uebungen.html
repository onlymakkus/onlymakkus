<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Übungen — onlymakkus</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root, [data-theme="dark"]{--black:#0a0a08;--cream:#f2ede4;--orange:#ff4e1a;--orange2:#ff6b3d;--muted:#9a9488;--card:#141410;--card2:#1c1c18;--border:rgba(255,255,255,0.08);--body-bg:var(--black);--body-text:var(--cream);color-scheme:dark;--green:#22c55e}
    [data-theme="light"]{color-scheme:light;--black:#2A2420;--cream:#2A2420;--orange:#FF6E35;--orange2:#e85a1f;--muted:#8A8078;--card:#FFFFFF;--card2:#FFF6EE;--border:rgba(42,36,32,0.1);--body-bg:#FBF6EE;--body-text:#2A2420;--green:#1a9c53}
    body{background:var(--body-bg);color:var(--body-text);font-family:'DM Mono',monospace;cursor:none;overflow-x:hidden;transition:background .3s,color .3s}
    .cursor{position:fixed;width:12px;height:12px;background:var(--orange);border-radius:50%;pointer-events:none;z-index:10000;transform:translate(-50%,-50%);mix-blend-mode:difference;transition:width .15s,height .15s}
    .cursor.big{width:36px;height:36px}
    [data-theme="light"] .cursor{mix-blend-mode:normal}
    nav{padding:20px 40px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);position:relative}
    .nav-logo{font-family:'Bebas Neue';font-size:1.4rem;letter-spacing:.1em;color:var(--body-text);text-decoration:none}
    .nav-links{display:flex;gap:20px;align-items:center}
    .nav-link{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);text-decoration:none;transition:color .2s}
    .nav-link:hover,.nav-link.active{color:var(--body-text)}
    .theme-toggle{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--body-text);background:transparent;border:1px solid var(--border);padding:7px 12px;cursor:pointer;}
    .theme-toggle:hover{border-color:var(--orange);color:var(--orange);}
    .hamburger-btn{display:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--card);align-items:center;justify-content:center;cursor:pointer;font-size:1rem;color:var(--body-text);transition:background .2s}
    .hamburger-btn:hover{background:var(--card2)}
    .mobile-menu{display:none;position:absolute;top:100%;right:40px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px;flex-direction:column;gap:2px;min-width:180px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:200}
    [data-theme="light"] .mobile-menu{box-shadow:0 8px 24px rgba(42,36,32,.12)}
    .mobile-menu.open{display:flex}
    .mobile-menu .nav-link{padding:11px 14px;border-radius:8px;opacity:1;color:var(--muted)}
    .mobile-menu .nav-link:hover{background:var(--card2);color:var(--body-text)}
    .mobile-menu .nav-link.active{color:var(--orange);font-weight:600}
    .mobile-theme-row{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-top:1px solid var(--border);margin-top:4px}
    .mobile-theme-label{font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
    @media(max-width:640px){
      .nav-links{display:none}
      .hamburger-btn{display:flex}
    }

    main{max-width:1000px;margin:0 auto;padding:40px 24px 80px}
    .page-title{font-family:'Bebas Neue';font-size:clamp(2.5rem,8vw,4.5rem);line-height:.95;text-align:center;margin-bottom:8px}
    .page-title span{color:var(--orange)}
    .page-sub{text-align:center;font-size:.75rem;color:var(--muted);margin-bottom:48px}

    .active-hero{background:linear-gradient(135deg,var(--card) 0%,#1a0c06 100%);border:2px solid var(--orange);padding:36px 32px;margin-bottom:48px;position:relative;overflow:hidden}
    [data-theme="light"] .active-hero{background:linear-gradient(135deg,#FFFFFF 0%,#FFF6EE 100%);box-shadow:0 4px 20px rgba(42,36,32,.06)}
    .active-badge{display:inline-block;font-size:.58rem;letter-spacing:.25em;text-transform:uppercase;color:var(--orange);border:1px solid rgba(255,78,26,.4);padding:4px 12px;margin-bottom:16px}
    .active-title{font-family:'Bebas Neue';font-size:clamp(2.5rem,7vw,4rem);line-height:.95;margin-bottom:8px}
    .active-goal{font-size:.78rem;color:var(--orange);margin-bottom:16px;font-weight:500}
    .active-desc{font-size:.78rem;color:var(--muted);line-height:1.9;max-width:600px;margin-bottom:20px}
    .active-tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
    .active-tip{background:rgba(255,255,255,.03);padding:12px 14px;border-left:2px solid var(--orange)}
    [data-theme="light"] .active-tip{background:rgba(255,110,53,.05)}
    .active-tip-label{font-size:.58rem;letter-spacing:.15em;text-transform:uppercase;color:var(--orange);margin-bottom:4px}
    .active-tip-text{font-size:.66rem;color:var(--muted);line-height:1.6}

    .section-label{font-size:.6rem;letter-spacing:.35em;text-transform:uppercase;color:var(--orange);margin-bottom:24px;display:flex;align-items:center;gap:16px}
    .section-label::after{content:'';flex:1;height:1px;background:var(--border)}

    .ex-search{width:100%;padding:12px 16px;background:var(--card);border:1px solid var(--border);color:var(--body-text);font-family:'DM Mono';font-size:.72rem;margin-bottom:12px;cursor:none;transition:border-color .2s}
    .ex-search:focus{outline:none;border-color:var(--orange)}
    .ex-search::placeholder{color:var(--muted)}

    .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
    .filters-sub{margin-top:-16px}
    .equip-btn,.knee-btn{padding:6px 13px;background:transparent;border:1px solid var(--border);color:var(--muted);font-family:'DM Mono';font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:all .2s}
    .equip-btn:hover,.knee-btn:hover{border-color:rgba(255,78,26,.4);color:var(--body-text)}
    .equip-btn.active{border-color:var(--orange);color:var(--orange)}
    .knee-btn{margin-left:auto}
    .knee-btn.active{border-color:var(--green);color:var(--green)}

    .ex-count{margin-left:auto;font-size:.55rem;letter-spacing:.1em;color:var(--muted);text-transform:none;flex:0 0 auto;order:3}
    .section-label:has(.ex-count)::after{order:2}

    .ex-skel{height:60px;background:linear-gradient(90deg,var(--card) 0%,var(--card2) 50%,var(--card) 100%);background-size:200% 100%;animation:shimmer 1.2s infinite}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .ex-empty{padding:32px;text-align:center;color:var(--muted);font-style:italic;font-size:.72rem;background:var(--card)}

    .ex-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
    .ex-link{font-family:'DM Mono';font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:transparent;border:1px solid var(--border);padding:8px 14px;cursor:pointer;transition:all .2s}
    .ex-link:hover{border-color:rgba(255,78,26,.4);color:var(--orange)}
    .ex-suitable-bonus{color:var(--muted);border-color:var(--border)}
    .ex-equip{opacity:.75}
    .ex-knee{color:var(--green);border-color:rgba(34,197,94,.3)}
    .filter-btn{padding:8px 16px;background:var(--card);border:1px solid var(--border);color:var(--muted);font-family:'DM Mono';font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:all .2s}
    .filter-btn:hover{border-color:rgba(255,78,26,.4)}
    .filter-btn.active{background:var(--orange);color:#fff;border-color:var(--orange)}
    [data-theme="dark"] .filter-btn.active{color:var(--black)}

    .ex-list{display:flex;flex-direction:column;gap:2px}
    .ex-item{background:var(--card)}
    [data-theme="light"] .ex-item{box-shadow:0 1px 6px rgba(42,36,32,.04)}
    .ex-header{padding:18px 22px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:background .2s}
    .ex-header:hover{background:var(--card2)}
    .ex-header-left{display:flex;align-items:center;gap:14px}
    .ex-icon{font-size:1.4rem}
    .ex-name{font-family:'Instrument Serif';font-style:italic;font-size:1.1rem}
    .ex-cat{font-size:.55rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);border:1px solid var(--border);padding:2px 8px;margin-left:10px}
    .ex-chevron{font-size:.9rem;color:var(--orange);transition:transform .2s}
    .ex-item.open .ex-chevron{transform:rotate(90deg)}
    .ex-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
    .ex-item.open .ex-body{grid-template-rows:1fr}
    .ex-body>*{overflow:hidden;min-height:0}
    .ex-item:target{outline:2px solid var(--orange);outline-offset:-2px}
    .ex-body-inner{padding:0 22px 22px;border-top:1px solid var(--border)}
    .ex-desc{font-size:.72rem;color:var(--muted);line-height:1.9;margin:16px 0}
    .ex-levels{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
    .ex-level{background:rgba(255,255,255,.03);padding:10px 14px;border-left:2px solid var(--orange)}
    [data-theme="light"] .ex-level{background:rgba(255,110,53,.05)}
    .ex-level-label{font-size:.56rem;letter-spacing:.15em;text-transform:uppercase;color:var(--orange);margin-bottom:3px}
    .ex-level-text{font-size:.66rem;color:var(--muted);line-height:1.6}
    .ex-video{display:inline-flex;align-items:center;gap:8px;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--orange);text-decoration:none;border:1px solid rgba(255,78,26,.3);padding:8px 16px;transition:background .2s}
    .ex-video:hover{background:rgba(255,78,26,.1)}
    .ex-suitable{display:inline-block;font-size:.55rem;letter-spacing:.1em;text-transform:uppercase;color:var(--green);border:1px solid rgba(34,197,94,.3);padding:3px 10px;margin-top:14px}

    footer{padding:32px 40px;border-top:1px solid var(--border);display:flex;justify-content:center;gap:32px;font-size:.6rem;color:var(--muted);letter-spacing:.15em;flex-wrap:wrap}
    footer a{color:var(--muted);text-decoration:none}
    @media(max-width:600px){
      .ex-cat:not(.ex-knee){display:none}
      .knee-btn{margin-left:0}
      body{cursor:auto}
      .cursor{display:none}
    }
  </style>
</head>

<script>
  const cursor=document.getElementById('cursor');
  document.addEventListener('mousemove',e=>{cursor.style.left=e.clientX+'px';cursor.style.top=e.clientY+'px'});
  document.querySelectorAll('a,button').forEach(el=>{el.addEventListener('mouseenter',()=>cursor.classList.add('big'));el.addEventListener('mouseleave',()=>cursor.classList.remove('big'))});

  const SB_URL='https://bsubsesbcxdaqofmkiqg.supabase.co';
  const SB_KEY='sb_publishable_fA2Dca6SVp0eB8k_WuqLrw_zplTnXBU';
  async function sbFetch(p,o={}){
    const r=await fetch(SB_URL+p,{...o,headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json',...o.headers}});
    const t=await r.text();
    if(!r.ok)throw new Error('Supabase '+r.status+' '+r.statusText+(t?' — '+t.slice(0,200):''));
    return t?JSON.parse(t):null;
  }

  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const safeUrl=u=>{try{const p=new URL(u,location.href);return(p.protocol==='http:'||p.protocol==='https:')?p.href:null}catch{return null}};
  const slug=s=>String(s??'').toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

  const CAT_LABELS={core:'Core',push:'Push',pull:'Pull',legs:'Legs',cardio:'Cardio',fullbody:'Full Body',mobility:'Mobility',hold:'Halteübung'};
  const EQUIP_LABELS={bodyweight:'Bodyweight',dumbbell:'Hantel',barbell:'Langhantel',kettlebell:'Kettlebell',rig:'Rig/Stange',rings:'Ringe',box:'Box',rope:'Seil',machine:'Gerät'};
  let ALL_EXERCISES=[];
  let CHALLENGE_EXERCISE_IDS=new Set();
  let CHALLENGE_HISTORY=new Map();
  let CURRENT_FILTER='all';
  let CURRENT_EQUIP='all';
  let CURRENT_SEARCH='';
  let KNEE_SAFE_ONLY=false;

  const MONTH_NAMES=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];

  async function loadChallenges(){
    const now=new Date(),m=now.getMonth()+1,y=now.getFullYear();
    let rows=[];
    try{
      rows=await sbFetch('/rest/v1/season_months?select=*,exercises(*)&order=season_year.asc,month.asc')||[];
    }catch(e){
      console.error('Challenge load error:',e);
      document.getElementById('activeHero').style.display='none';
      return;
    }

    // Alle je genutzten Challenge-Übungen sammeln (für Filter + Historie-Badge)
    for(const row of rows){
      if(row.is_december_vote||!row.exercises)continue;
      CHALLENGE_EXERCISE_IDS.add(row.exercises.id);
      if(!CHALLENGE_HISTORY.has(row.exercises.id))CHALLENGE_HISTORY.set(row.exercises.id,[]);
      CHALLENGE_HISTORY.get(row.exercises.id).push(`${MONTH_NAMES[row.month-1]} ${row.season_year}`);
    }

    // Aktuellen Monat als Hero rendern
    const cur=rows.find(r=>r.season_year===y&&r.month===m);
    if(!cur||cur.is_december_vote||!cur.exercises){
      document.getElementById('activeHero').style.display='none';
      return;
    }
    const ex=cur.exercises;
    const goal=cur.custom_goal||ex.default_goal;
    const goalText=ex.default_dual?`${goal} ${ex.default_unit} / Seite`:`${goal} ${ex.default_unit} gesamt`;
    document.getElementById('activeTitle').textContent=ex.name;
    document.getElementById('activeGoal').textContent='Ziel: '+goalText;
    const tips=[
      ex.level_beginner?['🟢 Anfänger',ex.level_beginner]:null,
      ex.level_intermediate?['🟡 Fortgeschritten',ex.level_intermediate]:null,
      ex.level_advanced?['🔴 Profi',ex.level_advanced]:null,
    ].filter(Boolean);
    document.getElementById('activeTips').innerHTML=tips.map(([l,t])=>`<div class="active-tip"><div class="active-tip-label">${esc(l)}</div><div class="active-tip-text">${esc(t)}</div></div>`).join('');
    const vurl=ex.video_url?safeUrl(ex.video_url):null;
    document.getElementById('activeDesc').innerHTML=esc(ex.description)+(vurl?`<br><br><a href="${esc(vurl)}" target="_blank" rel="noopener" style="color:var(--orange);">🎥 Video-Anleitung ansehen →</a>`:'');
  }

  async function loadExercises(){
    try{
      ALL_EXERCISES=await sbFetch('/rest/v1/exercises?select=*&order=name.asc')||[];
    }catch(e){
      console.error('Exercise load error:',e);
      document.getElementById('exList').innerHTML='<div class="ex-empty">Fehler beim Laden des Katalogs. Kurz neu laden?</div>';
      throw e;
    }
  }

  function matchesFilters(ex){
    if(CURRENT_FILTER==='challenge'){ if(!CHALLENGE_EXERCISE_IDS.has(ex.id))return false; }
    else if(CURRENT_FILTER!=='all'){ if(ex.category!==CURRENT_FILTER)return false; }
    if(CURRENT_EQUIP!=='all'&&ex.equipment!==CURRENT_EQUIP)return false;
    if(KNEE_SAFE_ONLY&&!ex.knee_safe)return false;
    if(CURRENT_SEARCH){
      const hay=[ex.name,ex.description,CAT_LABELS[ex.category]||ex.category,EQUIP_LABELS[ex.equipment]||ex.equipment].join(' ').toLowerCase();
      if(!hay.includes(CURRENT_SEARCH))return false;
    }
    return true;
  }

  function renderExercises(){
    const list=document.getElementById('exList');
    const filtered=ALL_EXERCISES.filter(matchesFilters);
    document.getElementById('exCount').textContent=filtered.length===ALL_EXERCISES.length
      ? `${ALL_EXERCISES.length} Übungen`
      : `${filtered.length} von ${ALL_EXERCISES.length}`;

    if(!filtered.length){
      list.innerHTML='<div class="ex-empty">Keine Übung passt zu diesen Filtern.</div>';
      return;
    }

    list.innerHTML=filtered.map(ex=>{
      const id=slug(ex.name);
      const isChallenge=CHALLENGE_EXERCISE_IDS.has(ex.id);
      const hist=CHALLENGE_HISTORY.get(ex.id);
      const levels=[
        ex.level_beginner?['🟢 Anfänger',ex.level_beginner]:null,
        ex.level_intermediate?['🟡 Fortgeschritten',ex.level_intermediate]:null,
        ex.level_advanced?['🔴 Profi',ex.level_advanced]:null,
      ].filter(Boolean);
      const vurl=ex.video_url?safeUrl(ex.video_url):null;
      const badge=isChallenge
        ? `<span class="ex-suitable">✓ Challenge${hist&&hist.length?' — '+esc(hist.join(', ')):''}</span>`
        : '<span class="ex-suitable ex-suitable-bonus">Bonus-Übung — eignet sich für Challenges</span>';
      return `
      <div class="ex-item" id="ex-${esc(id)}" data-ex-id="${esc(ex.id)}">
        <div class="ex-header" role="button" tabindex="0" aria-expanded="false">
          <div class="ex-header-left">
            <span class="ex-icon">${esc(ex.icon||'💪')}</span>
            <span class="ex-name">${esc(ex.name)}</span>
            <span class="ex-cat">${esc(CAT_LABELS[ex.category]||ex.category||'')}</span>
            ${ex.equipment?`<span class="ex-cat ex-equip">${esc(EQUIP_LABELS[ex.equipment]||ex.equipment)}</span>`:''}
            ${ex.knee_safe?'<span class="ex-cat ex-knee" title="knieschonend">🦵 ok</span>':''}
          </div>
          <span class="ex-chevron">▶</span>
        </div>
        <div class="ex-body">
          <div class="ex-body-inner">
            <p class="ex-desc">${esc(ex.description)}</p>
            <div class="ex-levels">
              ${levels.map(([l,t])=>`<div class="ex-level"><div class="ex-level-label">${esc(l)}</div><div class="ex-level-text">${esc(t)}</div></div>`).join('')}
            </div>
            <div class="ex-actions">
              ${vurl?`<a href="${esc(vurl)}" target="_blank" rel="noopener" class="ex-video">🎥 Video ansehen →</a>`:''}
              <button class="ex-link" data-copy="ex-${esc(id)}" type="button">🔗 Link kopieren</button>
            </div>
            ${badge}
          </div>
        </div>
      </div>
    `;
    }).join('');
  }

  function toggleEx(headerEl){
    const item=headerEl.closest('.ex-item');
    const wasOpen=item.classList.contains('open');
    item.classList.toggle('open',!wasOpen);
    headerEl.setAttribute('aria-expanded',String(!wasOpen));
    if(!wasOpen)history.replaceState(null,'','#'+item.id);
  }

  // Event delegation — überlebt Re-Renders
  document.getElementById('exList').addEventListener('click',e=>{
    const copyBtn=e.target.closest('.ex-link');
    if(copyBtn){
      const url=location.origin+location.pathname+'#'+copyBtn.dataset.copy;
      navigator.clipboard?.writeText(url).then(()=>{
        const old=copyBtn.textContent;
        copyBtn.textContent='✓ Kopiert';
        setTimeout(()=>{copyBtn.textContent=old},1400);
      }).catch(()=>{});
      return;
    }
    if(e.target.closest('.ex-video'))return;
    const header=e.target.closest('.ex-header');
    if(header)toggleEx(header);
  });
  document.getElementById('exList').addEventListener('keydown',e=>{
    if(e.key!=='Enter'&&e.key!==' ')return;
    const header=e.target.closest('.ex-header');
    if(header){e.preventDefault();toggleEx(header)}
  });

  document.querySelectorAll('.filter-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      CURRENT_FILTER=btn.dataset.filter;
      renderExercises();
    });
  });
  document.querySelectorAll('.equip-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.equip-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      CURRENT_EQUIP=btn.dataset.equip;
      renderExercises();
    });
  });
  document.getElementById('exSearch').addEventListener('input',e=>{
    CURRENT_SEARCH=e.target.value.trim().toLowerCase();
    renderExercises();
  });
  document.getElementById('kneeToggle').addEventListener('click',e=>{
    KNEE_SAFE_ONLY=!KNEE_SAFE_ONLY;
    e.currentTarget.classList.toggle('active',KNEE_SAFE_ONLY);
    renderExercises();
  });

  function openFromHash(){
    if(!location.hash)return;
    const el=document.querySelector(location.hash);
    if(!el||!el.classList.contains('ex-item'))return;
    el.classList.add('open');
    el.querySelector('.ex-header')?.setAttribute('aria-expanded','true');
    el.scrollIntoView({behavior:'smooth',block:'center'});
  }

  const THEME_KEY='om_cf_theme';
  const html=document.documentElement;
  const themeToggle=document.getElementById('themeToggle');
  const themeToggleMobile=document.getElementById('themeToggleMobile');
  function applyTheme(t){
    html.setAttribute('data-theme',t);
    const icon=t==='dark'?'Light':'Dark';
    themeToggle.textContent=icon;
    if(themeToggleMobile)themeToggleMobile.textContent=icon;
    localStorage.setItem(THEME_KEY,t);
  }
  applyTheme(localStorage.getItem(THEME_KEY)||'dark');
  themeToggle.addEventListener('click',()=>{
    applyTheme(html.getAttribute('data-theme')==='dark'?'light':'dark');
  });
  if(themeToggleMobile){
    themeToggleMobile.addEventListener('click',()=>{
      applyTheme(html.getAttribute('data-theme')==='dark'?'light':'dark');
    });
  }

  const hamburgerBtn=document.getElementById('hamburgerBtn');
  const mobileMenu=document.getElementById('mobileMenu');
  if(hamburgerBtn){
    hamburgerBtn.addEventListener('click',(e)=>{
      e.stopPropagation();
      mobileMenu.classList.toggle('open');
    });
    document.addEventListener('click',(e)=>{
      if(!mobileMenu.contains(e.target)&&!hamburgerBtn.contains(e.target)){
        mobileMenu.classList.remove('open');
      }
    });
  }

  (async function(){
    try{
      await loadChallenges();
      await loadExercises();
      renderExercises();
      openFromHash();
    }catch(e){
      document.getElementById('exCount').textContent='Fehler';
    }
  })();
  window.addEventListener('hashchange',openFromHash);
</script>
</body>
</html>

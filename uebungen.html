<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Übungen — onlymakkus</title>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    :root, [data-theme="dark"]{
      --bg:#121214;--ink:#f2f0ec;--accent:#ff453a;--accent-text:#ff453a;--muted:#c4c2bc;--faint:#8f8d8a;--line:#2a2a2e;--green:#22c55e;
      --ease-out:cubic-bezier(.23,1,.32,1);--ease:cubic-bezier(.4,0,.2,1);
      color-scheme:dark;
    }
    [data-theme="light"]{
      --bg:#f7f5f0;--ink:#14141a;--accent:#e8231b;--accent-text:#d01f18;--muted:#4a4a52;--faint:#6b6860;--line:#d8d5cc;--green:#1a9c53;
      color-scheme:light;
    }

    html{scroll-behavior:smooth}
    body{background:var(--bg);color:var(--ink);font-family:'Work Sans',sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased;min-height:100vh;padding-top:3px;transition:background .3s var(--ease),color .3s var(--ease)}
    ::selection{background:var(--accent);color:#fff}
    a{color:inherit;text-decoration:none}
    :focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

    /* ---------- TIMING LINE ---------- */
    .timing-track{position:fixed;top:0;left:0;right:0;height:3px;background:var(--line);z-index:1000;overflow:hidden;transition:background .3s var(--ease)}
    .timing-line{width:100%;height:100%;background:var(--accent);transform:scaleX(0);transform-origin:left;will-change:transform}

    /* ---------- NAV ---------- */
    nav{position:sticky;top:3px;z-index:100;padding:14px 28px;display:flex;justify-content:space-between;align-items:center;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);transition:background .3s var(--ease),border-color .3s var(--ease)}
    .nav-logo{position:relative;display:inline-flex;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:9px 0 8px}
    .nav-logo b{font-family:'Big Shoulders Display';font-weight:700;font-size:1.05rem;letter-spacing:.02em;color:var(--ink)}
    .nav-logo::after{content:'';position:absolute;left:0;right:0;bottom:5px;height:1px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .2s var(--ease-out)}
    .nav-logo:hover{color:var(--ink)}
    .nav-logo:hover::after{transform:scaleX(1)}
    .nav-right{display:flex;align-items:center;gap:14px}
    .theme-toggle{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:transparent;border:1px solid var(--line);padding:7px 11px;cursor:pointer;transition:border-color .18s var(--ease),color .18s var(--ease),transform .12s var(--ease-out)}
    .theme-toggle:hover{border-color:var(--accent);color:var(--accent-text)}
    .theme-toggle:active{transform:scale(.96)}
    .hamburger-btn{display:none}

    /* ---------- LAYOUT ---------- */
    main{max-width:1000px;margin:0 auto;padding:48px 24px 80px}
    .sheet-top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:32px;font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
    .sheet-top b{color:var(--accent-text);font-weight:500;font-variant-numeric:tabular-nums}
    .page-title{font-family:'Big Shoulders Display';font-weight:800;font-size:clamp(2.6rem,8vw,5rem);line-height:.88;letter-spacing:-.005em;text-transform:uppercase;margin-bottom:10px}
    .page-title span{color:var(--accent)}
    .page-sub{font-size:.92rem;color:var(--muted);margin-bottom:40px;max-width:56ch;line-height:1.7}

    /* ---------- ACTIVE CHALLENGE HERO ---------- */
    .active-hero{border:1px solid var(--line);border-left:3px solid var(--accent);padding:28px 28px 24px;margin-bottom:44px}
    .active-badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.56rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-text);border:1px solid var(--line);padding:4px 11px;margin-bottom:18px}
    .active-title{font-family:'Big Shoulders Display';font-weight:700;font-size:clamp(2rem,6vw,3.2rem);line-height:.92;margin-bottom:8px;letter-spacing:0}
    .active-goal{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.04em;color:var(--accent-text);margin-bottom:16px}
    .active-desc{font-size:.86rem;color:var(--muted);line-height:1.75;max-width:640px;margin-bottom:22px}
    .active-tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
    .active-tip{background:var(--bg);padding:14px 16px}
    .active-tip-label{font-family:'IBM Plex Mono',monospace;font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text);margin-bottom:5px}
    .active-tip-text{font-size:.78rem;color:var(--muted);line-height:1.6}

    /* ---------- SECTION LABEL ---------- */
    .section-label{font-family:'IBM Plex Mono',monospace;font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);margin-bottom:20px;display:flex;align-items:center;gap:14px}
    .section-label::after{content:'';flex:1;height:1px;background:var(--line)}

    /* ---------- SEARCH + FILTERS ---------- */
    .ex-search{width:100%;padding:14px 16px;background:transparent;border:1px solid var(--line);color:var(--ink);font-family:'Work Sans',sans-serif;font-size:.86rem;margin-bottom:16px;transition:border-color .18s var(--ease)}
    .ex-search:focus{outline:none;border-color:var(--accent)}
    .ex-search::placeholder{color:var(--faint)}

    .filters{display:flex;gap:1px;flex-wrap:wrap;margin-bottom:24px;background:var(--line);border:1px solid var(--line)}
    .filters-sub{margin-top:0}
    .equip-btn,.knee-btn,.filter-btn{background:var(--bg);border:none;color:var(--faint);font-family:'IBM Plex Mono',monospace;font-size:.56rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:background .15s var(--ease),color .15s var(--ease);padding:9px 13px}
    .equip-btn:hover,.knee-btn:hover,.filter-btn:hover{color:var(--ink)}
    .filter-btn.active{background:var(--accent);color:#fff}
    .equip-btn.active{color:var(--accent-text);box-shadow:inset 0 -2px 0 var(--accent)}
    .knee-btn{margin-left:auto}
    .knee-btn.active{color:var(--green);box-shadow:inset 0 -2px 0 var(--green)}

    .ex-count{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:.55rem;letter-spacing:.08em;color:var(--faint);text-transform:none;flex:0 0 auto;font-variant-numeric:tabular-nums}
    .section-label:has(.ex-count)::after{order:2}

    /* ---------- SKELETON / EMPTY ---------- */
    .ex-skel{height:60px;background:linear-gradient(90deg,var(--bg) 0%,var(--line) 50%,var(--bg) 100%);background-size:200% 100%;animation:shimmer 1.2s infinite;border:1px solid var(--line)}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .ex-empty{padding:32px;text-align:center;color:var(--muted);font-style:italic;font-size:.86rem;border:1px solid var(--line)}

    /* ---------- EXERCISE LIST ---------- */
    .ex-list{border:1px solid var(--line)}
    .ex-item{border-top:1px solid var(--line)}
    .ex-list .ex-item:first-child{border-top:none}
    .ex-header{padding:18px 22px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:background .15s var(--ease);gap:12px}
    .ex-header:hover{background:color-mix(in srgb,var(--accent) 5%,transparent)}
    .ex-header-left{display:flex;align-items:center;gap:13px;min-width:0}
    .ex-icon{font-size:1.3rem;flex:0 0 auto}
    .ex-name{font-family:'Big Shoulders Display';font-weight:700;font-size:1.3rem;letter-spacing:0;line-height:1}
    .ex-cat{font-family:'IBM Plex Mono',monospace;font-size:.54rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);border:1px solid var(--line);padding:3px 8px;margin-left:8px;white-space:nowrap}
    .ex-chevron{font-family:'Big Shoulders Display';font-size:1.1rem;color:var(--accent);transition:transform .2s var(--ease-out);flex:0 0 auto}
    .ex-item.open .ex-chevron{transform:rotate(90deg)}
    .ex-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
    .ex-item.open .ex-body{grid-template-rows:1fr}
    .ex-body>*{overflow:hidden;min-height:0}
    .ex-item:target{outline:2px solid var(--accent);outline-offset:-2px}
    .ex-body-inner{padding:0 22px 22px;border-top:1px solid var(--line)}
    .ex-desc{font-size:.84rem;color:var(--muted);line-height:1.85;margin:16px 0}
    .ex-levels{display:flex;flex-direction:column;gap:1px;margin-bottom:14px;background:var(--line);border:1px solid var(--line)}
    .ex-level{background:var(--bg);padding:12px 14px}
    .ex-level-label{font-family:'IBM Plex Mono',monospace;font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text);margin-bottom:4px}
    .ex-level-text{font-size:.8rem;color:var(--muted);line-height:1.6}
    .ex-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
    .ex-video{position:relative;display:inline-flex;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text);border:1px solid var(--accent);padding:9px 15px;transition:background .18s var(--ease)}
    .ex-video:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
    .ex-link{font-family:'IBM Plex Mono',monospace;font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);background:transparent;border:1px solid var(--line);padding:9px 14px;cursor:pointer;transition:border-color .18s var(--ease),color .18s var(--ease)}
    .ex-link:hover{border-color:var(--accent);color:var(--accent-text)}
    .ex-suitable{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.55rem;letter-spacing:.08em;text-transform:uppercase;color:var(--green);border:1px solid color-mix(in srgb,var(--green) 40%,transparent);padding:4px 10px;margin-top:14px}
    .ex-suitable-bonus{color:var(--faint);border-color:var(--line)}
    .ex-equip{opacity:.85}
    .ex-knee{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,transparent)}

    /* ---------- FOOTER ---------- */
    footer{max-width:1000px;margin:0 auto;padding:28px 24px;border-top:1px solid var(--line);display:flex;justify-content:center;gap:26px;font-family:'IBM Plex Mono',monospace;font-size:.58rem;color:var(--faint);letter-spacing:.12em;text-transform:uppercase;flex-wrap:wrap}
    footer a{position:relative;color:var(--faint);transition:color .15s var(--ease);padding:4px 0;display:inline-block}
    footer a::after{content:'';position:absolute;left:0;right:0;bottom:2px;height:1px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .18s var(--ease-out)}
    footer a:hover{color:var(--accent-text)}
    footer a:hover::after{transform:scaleX(1)}

    @media(max-width:600px){
      nav{padding:12px 18px}
      main{padding:36px 18px 60px}
      .active-hero{padding:22px 20px}
      .ex-cat:not(.ex-knee){display:none}
      .knee-btn{margin-left:0}
    }

    /* ---------- SCROLL REVEAL ---------- */
    .reveal{opacity:0;transform:translateY(16px);transition:opacity .5s var(--ease-out),transform .5s var(--ease-out)}
    .reveal.in{opacity:1;transform:translateY(0)}

    /* ---------- ACCOUNT WIDGET ---------- */
    .navrow-right{display:flex;align-items:center;gap:14px}
    .acct{position:relative;display:flex;align-items:center}
    .acct-login{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);background:transparent;border:1px solid var(--line);padding:7px 11px;cursor:pointer;text-decoration:none;transition:border-color .18s var(--ease),color .18s var(--ease)}
    .acct-login:hover{border-color:var(--accent);color:var(--accent-text)}
    .acct-chip{display:flex;align-items:center;gap:9px;background:transparent;border:1px solid var(--line);padding:4px 12px 4px 4px;cursor:pointer;font-family:'IBM Plex Mono',monospace;color:var(--ink);transition:border-color .18s var(--ease)}
    .acct-chip:hover{border-color:var(--accent)}
    .acct-av{width:26px;height:26px;border-radius:50%;background:var(--accent);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:.9rem;color:#fff;flex-shrink:0;overflow:hidden;line-height:1}
    .acct-av.lg{width:44px;height:44px;font-size:1.4rem}
    .acct-av.has-img{color:transparent;background-color:var(--line)}
    .acct-name{font-size:.68rem;letter-spacing:.04em;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .acct-lvl{font-size:.52rem;letter-spacing:.08em;color:var(--accent-text);border:1px solid var(--line);padding:2px 7px;flex-shrink:0;font-variant-numeric:tabular-nums}
    .acct-menu{position:absolute;top:calc(100% + 10px);right:0;min-width:236px;background:var(--bg);border:1px solid var(--line);padding:8px;flex-direction:column;gap:2px;box-shadow:0 14px 40px rgba(0,0,0,.35);z-index:500;display:flex}
    .acct-menu-head{display:flex;align-items:center;gap:12px;padding:10px 10px 12px}
    .acct-menu-name{font-size:.82rem;letter-spacing:.02em;color:var(--ink)}
    .acct-menu-title{font-family:'IBM Plex Mono',monospace;font-style:italic;font-size:.7rem;color:var(--accent-text);margin-top:3px}
    .acct-xp{padding:8px 10px 12px;border-top:1px solid var(--line)}
    .acct-xp-info{display:flex;justify-content:space-between;font-size:.54rem;letter-spacing:.06em;color:var(--faint);text-transform:uppercase;margin-bottom:6px}
    .acct-xp-bar{height:4px;background:var(--line);overflow:hidden}
    .acct-xp-fill{height:100%;width:0;background:var(--accent);transition:width .5s var(--ease)}
    .acct-menu-item{display:block;width:100%;padding:10px;font-family:'IBM Plex Mono',monospace;font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);text-decoration:none;background:transparent;border:none;text-align:left;cursor:pointer;transition:background .15s var(--ease)}
    .acct-menu-item:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
    .acct-menu-item.danger{color:var(--faint)}
    .acct-menu-item.danger:hover{color:#ff5555;background:rgba(255,68,68,.09)}
    .acct-login[hidden],.acct-chip[hidden],.acct-menu[hidden],.acct-lvl[hidden],.acct-menu-title[hidden],.acct-xp[hidden]{display:none}
  </style>
</head>
<body>
<div class="timing-track"><div class="timing-line" id="timingLine"></div></div>

<nav>
    <a class="nav-logo" href="crossfit.html">← <b>OM</b> / übungen</a>
    <div class="nav-right">
      <div class="acct" id="acct">
        <a class="acct-login" id="acctLogin" href="profile.html" hidden>Anmelden</a>
        <button class="acct-chip" id="acctChip" type="button" aria-haspopup="true" aria-expanded="false" hidden>
          <span class="acct-av" id="acctAv"></span>
          <span class="acct-name" id="acctName"></span>
          <span class="acct-lvl" id="acctLvl" hidden></span>
        </button>
        <div class="acct-menu" id="acctMenu" hidden>
          <div class="acct-menu-head">
            <span class="acct-av lg" id="acctAvLg"></span>
            <div>
              <div class="acct-menu-name" id="acctMenuName"></div>
              <div class="acct-menu-title" id="acctMenuTitle" hidden></div>
            </div>
          </div>
          <div class="acct-xp" id="acctXp" hidden>
            <div class="acct-xp-info"><span id="acctXpLabel">Level 1</span><span id="acctXpVal">0 / 100 XP</span></div>
            <div class="acct-xp-bar"><div class="acct-xp-fill" id="acctXpFill"></div></div>
          </div>
          <a class="acct-menu-item" href="profile.html">Profil</a>
          <button class="acct-menu-item danger" id="acctLogout" type="button">Abmelden</button>
        </div>
      </div>
      <button class="theme-toggle" id="themeToggle" title="Design wechseln">Light</button>
    </div>
  </nav>

<main>
  <div class="sheet-top">
    <span>Übungskatalog</span>
    <span>Saison <b>2026</b></span>
  </div>
  <h1 class="page-title">Übungs<span>katalog.</span></h1>
  <p class="page-sub">Alle Challenge-Übungen erklärt — plus jede Menge Bonus-Material.</p>

  <!-- ACTIVE CHALLENGE -->
  <div class="active-hero reveal" id="activeHero">
    <span class="active-badge">Aktuelle Challenge</span>
    <div class="active-title" id="activeTitle">—</div>
    <div class="active-goal" id="activeGoal">—</div>
    <p class="active-desc" id="activeDesc">—</p>
    <div class="active-tips" id="activeTips"></div>
  </div>

  <!-- FILTERS -->
  <p class="section-label">filtern</p>
  <input type="search" class="ex-search" id="exSearch" placeholder="Übung suchen…" autocomplete="off" aria-label="Übung suchen">
  <div class="filters">
    <button class="filter-btn active" data-filter="all">Alle</button>
    <button class="filter-btn" data-filter="challenge">Challenge-Übungen</button>
    <button class="filter-btn" data-filter="core">Core</button>
    <button class="filter-btn" data-filter="push">Push</button>
    <button class="filter-btn" data-filter="pull">Pull</button>
    <button class="filter-btn" data-filter="legs">Legs</button>
    <button class="filter-btn" data-filter="fullbody">Full Body</button>
    <button class="filter-btn" data-filter="cardio">Cardio</button>
    <button class="filter-btn" data-filter="hold">Halteübungen</button>
    <button class="filter-btn" data-filter="mobility">Mobility</button>
  </div>
  <div class="filters filters-sub">
    <button class="equip-btn active" data-equip="all">Alles Equipment</button>
    <button class="equip-btn" data-equip="bodyweight">Bodyweight</button>
    <button class="equip-btn" data-equip="dumbbell">Hantel</button>
    <button class="equip-btn" data-equip="barbell">Langhantel</button>
    <button class="equip-btn" data-equip="kettlebell">Kettlebell</button>
    <button class="equip-btn" data-equip="rig">Rig/Stange</button>
    <button class="equip-btn" data-equip="rings">Ringe</button>
    <button class="equip-btn" data-equip="box">Box</button>
    <button class="equip-btn" data-equip="rope">Seil</button>
    <button class="knee-btn" id="kneeToggle" type="button">🦵 nur knieschonend</button>
  </div>

  <!-- EXERCISE LIST -->
  <p class="section-label">alle übungen <span class="ex-count" id="exCount">lädt…</span></p>
  <div class="ex-list" id="exList">
    <div class="ex-skel"></div><div class="ex-skel"></div><div class="ex-skel"></div>
  </div>
</main>

<footer>
  <span>© 2026 onlymakkus.de</span>
  <a href="impressum.html">Impressum</a>
  <a href="datenschutz.html">Datenschutz</a>
  <span>made with pain &amp; supabase</span>
</footer>

<script>
  const SB_URL='https://bsubsesbcxdaqofmkiqg.supabase.co';
  const SB_KEY='sb_publishable_fA2Dca6SVp0eB8k_WuqLrw_zplTnXBU';
  async function sbFetch(p,o={}){
    const r=await fetch(SB_URL+p,{...o,headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json',...o.headers}});
    const t=await r.text();
    if(!r.ok)throw new Error('Supabase '+r.status+' '+r.statusText+(t?' — '+t.slice(0,200):''));
    return t?JSON.parse(t):null;
  }

  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const safeUrl=u=>{try{const p=new URL(u,location.href);return(p.protocol==='http:'||p.protocol==='https:')?p.href:null}catch{return null}};
  const slug=s=>String(s??'').toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

  const CAT_LABELS={core:'Core',push:'Push',pull:'Pull',legs:'Legs',cardio:'Cardio',fullbody:'Full Body',mobility:'Mobility',hold:'Halteübung'};
  const EQUIP_LABELS={bodyweight:'Bodyweight',dumbbell:'Hantel',barbell:'Langhantel',kettlebell:'Kettlebell',rig:'Rig/Stange',rings:'Ringe',box:'Box',rope:'Seil',machine:'Gerät'};
  let ALL_EXERCISES=[];
  let CHALLENGE_EXERCISE_IDS=new Set();
  let CHALLENGE_HISTORY=new Map();
  let CURRENT_FILTER='all';
  let CURRENT_EQUIP='all';
  let CURRENT_SEARCH='';
  let KNEE_SAFE_ONLY=false;

  const MONTH_NAMES=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];

  async function loadChallenges(){
    const now=new Date(),m=now.getMonth()+1,y=now.getFullYear();
    let rows=[];
    try{
      rows=await sbFetch('/rest/v1/season_months?select=*,exercises(*)&order=season_year.asc,month.asc')||[];
    }catch(e){
      console.error('Challenge load error:',e);
      document.getElementById('activeHero').style.display='none';
      return;
    }

    // Alle je genutzten Challenge-Übungen sammeln (für Filter + Historie-Badge)
    for(const row of rows){
      if(row.is_december_vote||!row.exercises)continue;
      CHALLENGE_EXERCISE_IDS.add(row.exercises.id);
      if(!CHALLENGE_HISTORY.has(row.exercises.id))CHALLENGE_HISTORY.set(row.exercises.id,[]);
      CHALLENGE_HISTORY.get(row.exercises.id).push(`${MONTH_NAMES[row.month-1]} ${row.season_year}`);
    }

    // Aktuellen Monat als Hero rendern
    const cur=rows.find(r=>r.season_year===y&&r.month===m);
    if(!cur||cur.is_december_vote||!cur.exercises){
      document.getElementById('activeHero').style.display='none';
      return;
    }
    const ex=cur.exercises;
    const goal=cur.custom_goal||ex.default_goal;
    const goalText=ex.default_dual?`${goal} ${ex.default_unit} / Seite`:`${goal} ${ex.default_unit} gesamt`;
    document.getElementById('activeTitle').textContent=ex.name;
    document.getElementById('activeGoal').textContent='Ziel: '+goalText;
    const tips=[
      ex.level_beginner?['🟢 Anfänger',ex.level_beginner]:null,
      ex.level_intermediate?['🟡 Fortgeschritten',ex.level_intermediate]:null,
      ex.level_advanced?['🔴 Profi',ex.level_advanced]:null,
    ].filter(Boolean);
    document.getElementById('activeTips').innerHTML=tips.map(([l,t])=>`<div class="active-tip"><div class="active-tip-label">${esc(l)}</div><div class="active-tip-text">${esc(t)}</div></div>`).join('');
    const vurl=ex.video_url?safeUrl(ex.video_url):null;
    document.getElementById('activeDesc').innerHTML=esc(ex.description)+(vurl?`<br><br><a href="${esc(vurl)}" target="_blank" rel="noopener" style="color:var(--orange);">🎥 Video-Anleitung ansehen →</a>`:'');
  }

  async function loadExercises(){
    try{
      ALL_EXERCISES=await sbFetch('/rest/v1/exercises?select=*&order=name.asc')||[];
    }catch(e){
      console.error('Exercise load error:',e);
      document.getElementById('exList').innerHTML='<div class="ex-empty">Fehler beim Laden des Katalogs. Kurz neu laden?</div>';
      throw e;
    }
  }

  function matchesFilters(ex){
    if(CURRENT_FILTER==='challenge'){ if(!CHALLENGE_EXERCISE_IDS.has(ex.id))return false; }
    else if(CURRENT_FILTER!=='all'){ if(ex.category!==CURRENT_FILTER)return false; }
    if(CURRENT_EQUIP!=='all'&&ex.equipment!==CURRENT_EQUIP)return false;
    if(KNEE_SAFE_ONLY&&!ex.knee_safe)return false;
    if(CURRENT_SEARCH){
      const hay=[ex.name,ex.description,CAT_LABELS[ex.category]||ex.category,EQUIP_LABELS[ex.equipment]||ex.equipment].join(' ').toLowerCase();
      if(!hay.includes(CURRENT_SEARCH))return false;
    }
    return true;
  }

  function renderExercises(){
    const list=document.getElementById('exList');
    const filtered=ALL_EXERCISES.filter(matchesFilters);
    document.getElementById('exCount').textContent=filtered.length===ALL_EXERCISES.length
      ? `${ALL_EXERCISES.length} Übungen`
      : `${filtered.length} von ${ALL_EXERCISES.length}`;

    if(!filtered.length){
      list.innerHTML='<div class="ex-empty">Keine Übung passt zu diesen Filtern.</div>';
      return;
    }

    list.innerHTML=filtered.map(ex=>{
      const id=slug(ex.name);
      const isChallenge=CHALLENGE_EXERCISE_IDS.has(ex.id);
      const hist=CHALLENGE_HISTORY.get(ex.id);
      const levels=[
        ex.level_beginner?['🟢 Anfänger',ex.level_beginner]:null,
        ex.level_intermediate?['🟡 Fortgeschritten',ex.level_intermediate]:null,
        ex.level_advanced?['🔴 Profi',ex.level_advanced]:null,
      ].filter(Boolean);
      const vurl=ex.video_url?safeUrl(ex.video_url):null;
      const badge=isChallenge
        ? `<span class="ex-suitable">✓ Challenge${hist&&hist.length?' — '+esc(hist.join(', ')):''}</span>`
        : '<span class="ex-suitable ex-suitable-bonus">Bonus-Übung — eignet sich für Challenges</span>';
      return `
      <div class="ex-item" id="ex-${esc(id)}" data-ex-id="${esc(ex.id)}">
        <div class="ex-header" role="button" tabindex="0" aria-expanded="false">
          <div class="ex-header-left">
            <span class="ex-icon">${esc(ex.icon||'💪')}</span>
            <span class="ex-name">${esc(ex.name)}</span>
            <span class="ex-cat">${esc(CAT_LABELS[ex.category]||ex.category||'')}</span>
            ${ex.equipment?`<span class="ex-cat ex-equip">${esc(EQUIP_LABELS[ex.equipment]||ex.equipment)}</span>`:''}
            ${ex.knee_safe?'<span class="ex-cat ex-knee" title="knieschonend">🦵 ok</span>':''}
          </div>
          <span class="ex-chevron">▶</span>
        </div>
        <div class="ex-body">
          <div class="ex-body-inner">
            <p class="ex-desc">${esc(ex.description)}</p>
            <div class="ex-levels">
              ${levels.map(([l,t])=>`<div class="ex-level"><div class="ex-level-label">${esc(l)}</div><div class="ex-level-text">${esc(t)}</div></div>`).join('')}
            </div>
            <div class="ex-actions">
              ${vurl?`<a href="${esc(vurl)}" target="_blank" rel="noopener" class="ex-video">🎥 Video ansehen →</a>`:''}
              <button class="ex-link" data-copy="ex-${esc(id)}" type="button">🔗 Link kopieren</button>
            </div>
            ${badge}
          </div>
        </div>
      </div>
    `;
    }).join('');
  }

  function toggleEx(headerEl){
    const item=headerEl.closest('.ex-item');
    const wasOpen=item.classList.contains('open');
    item.classList.toggle('open',!wasOpen);
    headerEl.setAttribute('aria-expanded',String(!wasOpen));
    if(!wasOpen)history.replaceState(null,'','#'+item.id);
  }

  // Event delegation — überlebt Re-Renders
  document.getElementById('exList').addEventListener('click',e=>{
    const copyBtn=e.target.closest('.ex-link');
    if(copyBtn){
      const url=location.origin+location.pathname+'#'+copyBtn.dataset.copy;
      navigator.clipboard?.writeText(url).then(()=>{
        const old=copyBtn.textContent;
        copyBtn.textContent='✓ Kopiert';
        setTimeout(()=>{copyBtn.textContent=old},1400);
      }).catch(()=>{});
      return;
    }
    if(e.target.closest('.ex-video'))return;
    const header=e.target.closest('.ex-header');
    if(header)toggleEx(header);
  });
  document.getElementById('exList').addEventListener('keydown',e=>{
    if(e.key!=='Enter'&&e.key!==' ')return;
    const header=e.target.closest('.ex-header');
    if(header){e.preventDefault();toggleEx(header)}
  });

  document.querySelectorAll('.filter-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      CURRENT_FILTER=btn.dataset.filter;
      renderExercises();
    });
  });
  document.querySelectorAll('.equip-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.equip-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      CURRENT_EQUIP=btn.dataset.equip;
      renderExercises();
    });
  });
  document.getElementById('exSearch').addEventListener('input',e=>{
    CURRENT_SEARCH=e.target.value.trim().toLowerCase();
    renderExercises();
  });
  document.getElementById('kneeToggle').addEventListener('click',e=>{
    KNEE_SAFE_ONLY=!KNEE_SAFE_ONLY;
    e.currentTarget.classList.toggle('active',KNEE_SAFE_ONLY);
    renderExercises();
  });

  function openFromHash(){
    if(!location.hash)return;
    const el=document.querySelector(location.hash);
    if(!el||!el.classList.contains('ex-item'))return;
    el.classList.add('open');
    el.querySelector('.ex-header')?.setAttribute('aria-expanded','true');
    el.scrollIntoView({behavior:'smooth',block:'center'});
  }

  const THEME_KEY='om_cf_theme';
  const html=document.documentElement;
  const themeToggle=document.getElementById('themeToggle');
  const themeToggleMobile=document.getElementById('themeToggleMobile');
  function applyTheme(t){
    html.setAttribute('data-theme',t);
    const icon=t==='dark'?'Light':'Dark';
    themeToggle.textContent=icon;
    if(themeToggleMobile)themeToggleMobile.textContent=icon;
    localStorage.setItem(THEME_KEY,t);
  }
  applyTheme(localStorage.getItem(THEME_KEY)||'dark');
  themeToggle.addEventListener('click',()=>{
    applyTheme(html.getAttribute('data-theme')==='dark'?'light':'dark');
  });
  if(themeToggleMobile){
    themeToggleMobile.addEventListener('click',()=>{
      applyTheme(html.getAttribute('data-theme')==='dark'?'light':'dark');
    });
  }

  const hamburgerBtn=document.getElementById('hamburgerBtn');
  const mobileMenu=document.getElementById('mobileMenu');
  if(hamburgerBtn){
    hamburgerBtn.addEventListener('click',(e)=>{
      e.stopPropagation();
      mobileMenu.classList.toggle('open');
    });
    document.addEventListener('click',(e)=>{
      if(!mobileMenu.contains(e.target)&&!hamburgerBtn.contains(e.target)){
        mobileMenu.classList.remove('open');
      }
    });
  }

  (async function(){
    try{
      await loadChallenges();
      await loadExercises();
      renderExercises();
      openFromHash();
    }catch(e){
      document.getElementById('exCount').textContent='Fehler';
    }
  })();
  window.addEventListener('hashchange',openFromHash);
</script>
  <script>
(function(){
  var SESS='om_profile_session';
  var acct=document.getElementById('acct'); if(!acct) return;
  var s=null; try{ s=JSON.parse(localStorage.getItem(SESS)||'null'); }catch(e){ s=null; }
  var login=document.getElementById('acctLogin');
  var chip=document.getElementById('acctChip');
  var menu=document.getElementById('acctMenu');
  function initial(n){ n=(n||'').trim(); return n?n.charAt(0).toUpperCase():'?'; }
  function paintAv(el){ if(!el)return; if(s&&s.avatarUrl){ el.style.backgroundImage='url("'+s.avatarUrl+'")'; el.classList.add('has-img'); el.textContent=''; } else { el.textContent=initial(s&&(s.displayName||s.name)); } }
  if(!s||!s.id){ if(login)login.hidden=false; return; }
  if(chip)chip.hidden=false;
  var name=s.displayName||s.name||'Profil';
  var full=name+(s.discriminator?('#'+s.discriminator):'');
  document.getElementById('acctName').textContent=name;
  document.getElementById('acctMenuName').textContent=full;
  paintAv(document.getElementById('acctAv'));
  paintAv(document.getElementById('acctAvLg'));
  if(s.level!=null){ var lv=document.getElementById('acctLvl'); lv.hidden=false; lv.textContent='LV '+s.level; }
  if(s.title){ var ti=document.getElementById('acctMenuTitle'); ti.hidden=false; ti.textContent=s.title; }
  if(s.xp!=null&&s.xpNext!=null){ var xp=document.getElementById('acctXp'); xp.hidden=false;
    document.getElementById('acctXpLabel').textContent='Level '+(s.level!=null?s.level:1);
    document.getElementById('acctXpVal').textContent=s.xp+' / '+s.xpNext+' XP';
    var pct=s.xpNext?Math.max(0,Math.min(100,s.xp/s.xpNext*100)):0;
    document.getElementById('acctXpFill').style.width=pct+'%';
  }
  function closeM(){ menu.hidden=true; chip.setAttribute('aria-expanded','false'); }
  function openM(){ menu.hidden=false; chip.setAttribute('aria-expanded','true'); }
  chip.addEventListener('click',function(e){ e.stopPropagation(); if(menu.hidden)openM();else closeM(); });
  document.addEventListener('click',function(e){ if(!acct.contains(e.target))closeM(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape')closeM(); });
  var lo=document.getElementById('acctLogout');
  if(lo)lo.addEventListener('click',function(){ try{localStorage.removeItem(SESS);}catch(e){} location.href='profile.html'; });
})();
</script>
<script>
  // ── TIMING LINE + SCROLL REVEAL (new, decorative only) ──
  (function(){
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var line = document.getElementById('timingLine');
    var ticking = false;
    function update(){
      ticking = false;
      if(reduceMotion){ line.style.transform = 'scaleX(1)'; return; }
      var total = document.documentElement.scrollHeight - window.innerHeight;
      var pct = total > 0 ? Math.min(1, Math.max(0, window.scrollY / total)) : 0;
      line.style.transform = 'scaleX(' + pct + ')';
    }
    window.addEventListener('scroll', function(){
      if(!ticking){ requestAnimationFrame(update); ticking = true; }
    }, {passive:true});
    window.addEventListener('resize', update);
    update();

    var els = document.querySelectorAll('.reveal');
    if(!('IntersectionObserver' in window)){
      els.forEach(function(el){ el.classList.add('in'); });
      return;
    }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){ entry.target.classList.add('in'); io.unobserve(entry.target); }
      });
    }, {threshold:.1});
    els.forEach(function(el){ io.observe(el); });
  })();
</script>

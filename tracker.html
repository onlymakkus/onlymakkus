<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracker — onlymakkus.de</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root, [data-theme="dark"]{
    --black:#0a0a08; --cream:#f2ede4; --orange:#ff4e1a; --muted:#9a9488;
    --card:#141410; --card2:#1c1c18; --border:rgba(255,255,255,0.08);
    --protein:#5b8fd9; --fat:#e0a03d; --carb:#5fae72; --red:#d94c3d;
  }
  [data-theme="light"]{
    --black:#FBF6EE; --cream:#2A2420; --orange:#FF6E35; --muted:#8A8078;
    --card:#FFFFFF; --card2:#FFF6EE; --border:rgba(42,36,32,0.1);
    --protein:#3d6cad; --fat:#b8791f; --carb:#3d8850; --red:#c23a2c;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--black); color:var(--cream); font-family:'DM Mono',monospace; padding-bottom:60px; transition:background .3s,color .3s;}
  h1,h2,.display{font-family:'Bebas Neue',sans-serif; text-transform:uppercase; letter-spacing:0.03em;}
  .mono{font-family:'DM Mono',monospace;}
  em, .accent-serif{font-family:'Instrument Serif',serif; font-style:italic; letter-spacing:0;}

  .section-label{
    display:flex; align-items:center; gap:10px; justify-content:center;
    font-size:.62rem; letter-spacing:.3em; text-transform:uppercase; color:var(--orange);
    margin:26px 0 12px;
  }
  .section-label::before,.section-label::after{content:'';flex:0 0 32px; height:1px; background:var(--border);}
  .section-label.left{justify-content:flex-start;}
  .section-label.left::before{display:none;}
  .section-label.left::after{flex:1;}

  .ticker{
    overflow:hidden; white-space:nowrap; border-top:1px solid var(--border); border-bottom:1px solid var(--border);
    padding:7px 0; background:var(--card); margin-top:14px;
  }
  .ticker-track{display:inline-block; animation:scrollTicker 22s linear infinite; font-size:.68rem; letter-spacing:.25em; color:var(--muted);}
  .ticker-track span{margin:0 22px;}
  .ticker-track span b{color:var(--orange);}
  @keyframes scrollTicker{ from{transform:translateX(0);} to{transform:translateX(-50%);} }

  header{
    padding:22px 16px 0; background:var(--black);
    border-bottom:1px solid var(--border); position:sticky; top:0; z-index:20;
  }
  .navrow{display:flex; align-items:center; justify-content:space-between; padding-bottom:16px;}
  .navrow .brand{font-family:'Bebas Neue',sans-serif; font-size:1.1rem; letter-spacing:.05em;}
  .navrow .brand .o{color:var(--orange);}
  .navrow a.back{color:var(--muted); font-size:.72rem; text-decoration:none; letter-spacing:.08em;}
  .theme-toggle{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.8rem;transition:transform .2s;}
  .theme-toggle:hover{transform:scale(1.1);}

  .datebar{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .datebar button{background:var(--card); border:1px solid var(--border); color:var(--cream); width:34px; height:34px; border-radius:2px; font-size:1rem;}
  .datebar .datelabel{font-family:'DM Mono',monospace; font-size:0.85rem; color:var(--muted);}

  .kcal-row{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .kcal-row .big{font-family:'Bebas Neue',sans-serif; font-size:2.6rem; letter-spacing:.02em;}
  .kcal-row .of{color:var(--muted); font-size:0.95rem;}
  .goal-edit{display:flex; align-items:center; gap:6px; margin-left:auto;}
  .goal-edit input{
    width:70px; background:var(--card); border:1px solid var(--border); color:var(--cream);
    padding:5px 7px; border-radius:2px; font-family:'DM Mono',monospace; font-size:0.85rem;
  }
  .goal-edit label{font-size:0.65rem; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; font-family:'DM Mono',monospace;}

  .bar{height:6px; background:var(--card); border-radius:0; margin-top:12px; overflow:hidden; border:1px solid var(--border);}
  .bar-fill{height:100%; background:var(--orange); transition:width .3s;}
  .bar-fill.over{background:var(--red);}

  .macros{display:flex; flex-direction:column; gap:10px; margin-top:14px; padding-bottom:14px;}
  .macro-row{display:flex; align-items:center; gap:8px;}
  .macro-row .mlabel{font-size:0.72rem; letter-spacing:.08em; text-transform:uppercase; font-family:'DM Mono',monospace; width:76px; display:flex; align-items:center; gap:5px; flex-shrink:0;}
  .macro-row .mbar{flex:1; height:5px; background:var(--card); border:1px solid var(--border); overflow:hidden;}
  .macro-row .mbar-fill{height:100%; transition:width .3s;}
  .macro-row .mval{font-size:0.74rem; font-family:'DM Mono',monospace; color:var(--muted); width:76px; text-align:right; flex-shrink:0;}
  .macro-row .mgoal-input{
    width:52px; background:var(--card); border:1px solid var(--border); color:var(--cream);
    padding:3px 5px; border-radius:2px; font-family:'DM Mono',monospace; font-size:0.74rem; text-align:right;
  }
  .dot{width:7px; height:7px; border-radius:50%; display:inline-block;}

  main{max-width:640px; margin:0 auto; padding:6px 16px 18px;}
  .section-title{font-size:0.95rem; margin:0 0 10px; display:flex; justify-content:space-between; align-items:center;}
  .section-title span.hint{font-size:0.68rem; color:var(--muted); font-family:'DM Mono',monospace; text-transform:none; letter-spacing:0;}

  .quick-grid{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--border); border:1px solid var(--border);}
  .quick-item{
    background:var(--card); border:none; padding:12px 13px;
    text-align:left; color:var(--cream); cursor:pointer; position:relative; overflow:hidden;
  }
  .quick-item::before{
    content:''; position:absolute; top:0; left:0; right:0; height:2px; background:var(--orange);
    transform:scaleX(0); transform-origin:left; transition:transform .25s;
  }
  .quick-item:active::before{transform:scaleX(1);}
  .quick-item .qn{font-size:0.86rem; font-weight:500;}
  .quick-item .qd{font-size:0.7rem; color:var(--muted); font-family:'DM Mono',monospace; margin-top:4px;}
  .quick-item .del{position:absolute; top:4px; right:6px; background:none; border:none; color:var(--muted); font-size:0.9rem;}

  .add-quick-btn{
    width:100%; background:none; border:1px dashed var(--border); color:var(--muted);
    padding:11px; margin-top:10px; font-size:0.76rem; letter-spacing:.05em; font-family:'DM Mono',monospace;
  }

  .search-row{display:flex; gap:8px;}
  .search-row input{
    flex:1; background:var(--card); border:1px solid var(--border); color:var(--cream);
    padding:10px 12px; font-size:0.9rem; font-family:'DM Mono',monospace;
  }
  .search-row button{
    background:var(--orange); color:var(--black); border:none; padding:0 16px; font-weight:600;
    font-family:'DM Mono',monospace; letter-spacing:.03em;
  }
  #scanBtn{background:var(--card); color:var(--orange); border:1px solid var(--orange); padding:0 14px; font-size:1.1rem;}

  .scan-modal-backdrop{
    position:fixed; inset:0; background:#000; display:none; z-index:150;
    flex-direction:column;
  }
  .scan-modal-backdrop.open{display:flex;}
  .scan-header{
    display:flex; justify-content:space-between; align-items:center; padding:16px;
    background:var(--card); border-bottom:1px solid var(--border);
  }
  .scan-header h3{font-size:1.1rem; color:var(--cream); font-family:'Bebas Neue',sans-serif; text-transform:uppercase; letter-spacing:.05em;}
  .scan-header button{background:none; border:none; color:var(--muted); font-size:1.3rem;}
  #scanReader{flex:1; background:#000;}
  .scan-status{padding:12px 16px; color:var(--muted); font-size:0.8rem; font-family:'DM Mono',monospace; text-align:center;}
  .search-results{margin-top:10px;}
  .result-item{
    background:var(--card); border:1px solid var(--border); padding:10px 12px;
    display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; gap:10px;
  }
  .result-item .rn{font-size:0.85rem;}
  .result-item .rd{font-size:0.7rem; color:var(--muted); font-family:'DM Mono',monospace;}
  .result-item button{background:var(--black); border:1px solid var(--orange); color:var(--orange); padding:6px 10px; font-size:0.78rem;}
  .search-status{font-size:0.76rem; color:var(--muted); margin-top:8px; font-family:'DM Mono',monospace;}

  .log-item{
    background:var(--card); border:1px solid var(--border); border-left:2px solid var(--orange); padding:10px 12px;
    display:flex; justify-content:space-between; align-items:center; margin-bottom:1px;
    position:relative;
  }
  .log-item::after{
    content:''; position:absolute; left:12px; right:12px; bottom:-1px; height:1px;
    background:repeating-linear-gradient(90deg, var(--border) 0 4px, transparent 4px 8px);
  }
  .log-item:last-child::after{display:none;}
  .log-item .ln{font-size:0.85rem;}
  .log-item .ld{font-size:0.7rem; color:var(--muted); font-family:'DM Mono',monospace; margin-top:2px;}
  .log-item .lx{background:none; border:none; color:var(--muted); font-size:1rem;}
  .empty{color:var(--muted); font-size:0.85rem; padding:16px 0; text-align:center; font-family:'Instrument Serif',serif; font-style:italic;}

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.7); display:none; align-items:flex-end; justify-content:center; z-index:100;
  }
  .modal-backdrop.open{display:flex;}
  .modal{
    background:var(--card); border-top:2px solid var(--orange);
    width:100%; max-width:640px; padding:20px 18px 26px;
  }
  .modal h3{font-size:1.3rem; margin-bottom:14px; font-family:'Bebas Neue',sans-serif; text-transform:uppercase; letter-spacing:.04em;}
  .modal label{display:block; font-size:0.68rem; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; font-family:'DM Mono',monospace; margin:10px 0 4px;}
  .modal input{
    width:100%; background:var(--card2); border:1px solid var(--border); color:var(--cream);
    padding:9px 11px; font-size:0.9rem; font-family:'DM Mono',monospace;
  }
  .modal-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .modal-actions{display:flex; gap:10px; margin-top:18px;}
  .modal-actions button{flex:1; padding:11px; border:none; font-weight:600; font-size:0.85rem; font-family:'DM Mono',monospace; letter-spacing:.03em;}
  .btn-primary{background:var(--orange); color:var(--black);}
  .btn-secondary{background:var(--card2); color:var(--muted); border:1px solid var(--border) !important;}
  .login-gate{
    position:fixed; inset:0; background:var(--black); z-index:200;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px;
  }
  .login-gate.hidden{display:none;}
  .login-gate h2{font-size:2rem; margin-bottom:10px; font-family:'Bebas Neue',sans-serif; letter-spacing:.03em;}
  .login-gate p{color:var(--muted); font-size:0.88rem; max-width:320px; margin-bottom:18px; font-family:'DM Mono',monospace;}
  .login-gate a{background:var(--orange); color:var(--black); padding:10px 20px; text-decoration:none; font-weight:600; font-size:0.85rem; font-family:'DM Mono',monospace; letter-spacing:.03em;}
</style>
</head>
<body>

<div class="login-gate" id="loginGate">
  <h2>Erst einloggen</h2>
  <p>Der Kalorien-Tracker speichert deine Einträge an dein Profil gebunden. Logg dich auf profile.html ein und komm dann zurück.</p>
  <a href="profile.html">Zu profile.html</a>
</div>


<header id="appHeader" style="display:none;">
  <div class="navrow">
    <a class="back" href="health.html">‹ ZURÜCK</a>
    <div class="brand">TRACK<span class="o">.</span>ER</div>
    <button class="theme-toggle" id="themeToggle" title="Design wechseln">🌙</button>
  </div>
  <div class="datebar">
    <button id="prevDay">‹</button>
    <div class="datelabel" id="dateLabel">Heute</div>
    <button id="nextDay">›</button>
  </div>
  <div class="mono" id="greeting" style="font-size:0.7rem; color:var(--muted); margin-bottom:8px; letter-spacing:.04em;"></div>
  <div class="kcal-row">
    <div class="big"><span id="consumedKcal">0</span></div>
    <div class="of">/ <span id="goalDisplay">2500</span> kcal</div>
    <div class="goal-edit">
      <label>Ziel</label>
      <input type="number" id="goalInput" value="2500">
    </div>
  </div>
  <div class="bar"><div class="bar-fill" id="barFill" style="width:0%"></div></div>
  <div class="macros" id="macroRows"></div>
  <div class="ticker">
    <div class="ticker-track" id="tickerTrack"></div>
  </div>
</header>

<main id="appMain" style="display:none;">
  <div class="section-label left">Schnellauswahl<span class="hint" style="margin-left:auto; letter-spacing:0; text-transform:none; font-size:.68rem;">antippen = hinzufügen</span></div>
  <div class="quick-grid" id="quickGrid"></div>
  <button class="add-quick-btn" id="addQuickBtn">+ eigenes Lebensmittel zur Schnellauswahl</button>

  <div class="section-label left">Suche <span class="accent-serif" style="color:var(--muted); font-size:.85rem; margin-left:6px;">Open Food Facts</span></div>
  <div class="search-row">
    <input type="text" id="searchInput" placeholder="z.B. Skyr, Vollkornbrot...">
    <button id="searchBtn">Suchen</button>
    <button id="scanBtn" title="Barcode scannen">📷</button>
  </div>
  <div class="search-status" id="searchStatus"></div>
  <div class="search-results" id="searchResults"></div>

  <div class="section-label left">Log<span class="hint" id="logDateHint" style="margin-left:auto; letter-spacing:0; text-transform:none; font-size:.68rem;"></span></div>
  <button class="add-quick-btn" id="manualEntryBtn">+ Manueller Eintrag (z.B. auswärts essen)</button>
  <div id="logList"></div>
</main>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modal"></div>
</div>

<div class="scan-modal-backdrop" id="scanModal">
  <div class="scan-header">
    <h3>Barcode scannen</h3>
    <button id="scanCloseBtn">✕</button>
  </div>
  <div id="scanReader"></div>
  <div class="scan-status" id="scanStatus">Kamera wird gestartet...</div>
</div>

<script>
// ---------- SUPABASE CONFIG (gleiches Projekt wie der Rest von onlymakkus.de) ----------
const SB_URL = 'https://bsubsesbcxdaqofmkiqg.supabase.co';
const SB_KEY = 'sb_publishable_fA2Dca6SVp0eB8k_WuqLrw_zplTnXBU'; // gleicher anon key wie auf den anderen Seiten
const OFF_EDGE_FUNCTION_URL = SB_URL + '/functions/v1/add-off-product';

const THEME_KEY='om_cf_theme';
const htmlEl=document.documentElement;
const themeToggle=document.getElementById('themeToggle');
function applyTheme(t){
  htmlEl.setAttribute('data-theme',t);
  themeToggle.textContent=t==='dark'?'🌙':'☀️';
  localStorage.setItem(THEME_KEY,t);
}
applyTheme(localStorage.getItem(THEME_KEY)||'dark');
themeToggle.addEventListener('click',()=>{
  applyTheme(htmlEl.getAttribute('data-theme')==='dark'?'light':'dark');
});

async function sbFetch(p, o={}) {
  const r = await fetch(SB_URL+p, {
    ...o,
    headers: {
      'apikey': SB_KEY,
      'Authorization': 'Bearer '+SB_KEY,
      'Content-Type': 'application/json',
      'Prefer': o.prefer || '',
      ...o.headers
    }
  });
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}

// ---------- SESSION ----------
let session = null;
try{
  const saved = localStorage.getItem('om_profile_session');
  if(saved) session = JSON.parse(saved);
}catch(e){}

// ---------- STATE ----------
let currentDate = new Date();
let quickFoods = [];
let dayLog = [];
let dailyGoal = 2500;
let macroGoals = {protein:null, fat:null, carb:null};

function dateKey(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtDate(d){
  const today = new Date();
  if(dateKey(d)===dateKey(today)) return "Heute";
  return d.toLocaleDateString('de-DE', {weekday:'short', day:'2-digit', month:'2-digit'});
}

const defaultQuickFoods = [
  {name:"Skyr", kcal100:63, p100:11, f100:0.2, c100:4, defaultGrams:250},
  {name:"Magerquark", kcal100:67, p100:12, f100:0.3, c100:4, defaultGrams:250},
  {name:"Whey Shake (1 Scoop + Wasser)", kcal100:0, p100:0, f100:0, c100:0, fixedKcal:120, fixedP:24, fixedF:1.5, fixedC:3, defaultGrams:1},
  {name:"Vollkornbrot", kcal100:220, p100:8, f100:2.5, c100:40, defaultGrams:60},
  {name:"Ei (gekocht)", kcal100:0, p100:0, f100:0, c100:0, fixedKcal:78, fixedP:6.5, fixedF:5.5, fixedC:0.5, defaultGrams:1},
  {name:"Haferflocken", kcal100:370, p100:13, f100:7, c100:60, defaultGrams:60},
];

// ---------- STORAGE (Supabase) ----------
function mapQuickRow(r){
  return {
    id:r.id, name:r.name,
    kcal100:r.kcal_100, p100:r.protein_100, f100:r.fat_100, c100:r.carb_100,
    fixedKcal:r.fixed_kcal, fixedP:r.fixed_protein, fixedF:r.fixed_fat, fixedC:r.fixed_carb,
    defaultGrams:r.default_grams
  };
}

async function loadSettings(){
  try{
    const rows = await sbFetch(`/rest/v1/calorie_settings?profile_id=eq.${session.id}&select=daily_goal,protein_goal,fat_goal,carb_goal`);
    if(rows && rows.length){
      dailyGoal = rows[0].daily_goal;
      macroGoals = {protein:rows[0].protein_goal, fat:rows[0].fat_goal, carb:rows[0].carb_goal};
    } else {
      await sbFetch(`/rest/v1/calorie_settings`, {method:'POST', body:JSON.stringify({profile_id:session.id, daily_goal:2500})});
      dailyGoal = 2500;
    }
  }catch(e){}
}
async function saveSettings(){
  try{
    await sbFetch(`/rest/v1/calorie_settings?profile_id=eq.${session.id}`, {
      method:'PATCH', headers:{'Prefer':'return=minimal'},
      body:JSON.stringify({daily_goal:dailyGoal, protein_goal:macroGoals.protein, fat_goal:macroGoals.fat, carb_goal:macroGoals.carb})
    });
  }catch(e){}
}

async function loadQuickFoods(){
  try{
    const rows = await sbFetch(`/rest/v1/calorie_quick_foods?profile_id=eq.${session.id}&order=id.asc`);
    if(rows && rows.length){
      quickFoods = rows.map(mapQuickRow);
    } else {
      const seed = defaultQuickFoods.map(f=>({
        profile_id:session.id, name:f.name,
        kcal_100:f.kcal100??null, protein_100:f.p100??null, fat_100:f.f100??null, carb_100:f.c100??null,
        fixed_kcal:f.fixedKcal??null, fixed_protein:f.fixedP??null, fixed_fat:f.fixedF??null, fixed_carb:f.fixedC??null,
        default_grams:f.defaultGrams
      }));
      await sbFetch(`/rest/v1/calorie_quick_foods`, {method:'POST', body:JSON.stringify(seed)});
      const rows2 = await sbFetch(`/rest/v1/calorie_quick_foods?profile_id=eq.${session.id}&order=id.asc`);
      quickFoods = (rows2||[]).map(mapQuickRow);
    }
  }catch(e){ quickFoods = defaultQuickFoods; }
}
async function addQuickFoodRemote(f){
  const row = {
    profile_id:session.id, name:f.name,
    kcal_100:f.kcal100??null, protein_100:f.p100??null, fat_100:f.f100??null, carb_100:f.c100??null,
    default_grams:f.defaultGrams
  };
  const res = await sbFetch(`/rest/v1/calorie_quick_foods`, {method:'POST', headers:{'Prefer':'return=representation'}, body:JSON.stringify(row)});
  return res && res[0] ? mapQuickRow(res[0]) : null;
}
async function deleteQuickFoodRemote(id){
  await sbFetch(`/rest/v1/calorie_quick_foods?id=eq.${id}`, {method:'DELETE'});
}

async function loadLogForCurrentDate(){
  try{
    const rows = await sbFetch(`/rest/v1/calorie_entries?profile_id=eq.${session.id}&date=eq.${dateKey(currentDate)}&order=created_at.asc`);
    dayLog = (rows||[]).map(r=>({id:r.id, name:r.name, grams:r.grams, kcal:r.kcal, protein:r.protein, fat:r.fat, carb:r.carb}));
  }catch(e){
    dayLog = [];
  }
}
async function insertLogEntryRemote(entry){
  const row = {profile_id:session.id, date:dateKey(currentDate), name:entry.name, grams:entry.grams, kcal:entry.kcal, protein:entry.protein, fat:entry.fat, carb:entry.carb};
  const res = await sbFetch(`/rest/v1/calorie_entries`, {method:'POST', headers:{'Prefer':'return=representation'}, body:JSON.stringify(row)});
  return res && res[0] ? res[0].id : null;
}
async function deleteLogEntryRemote(id){
  await sbFetch(`/rest/v1/calorie_entries?id=eq.${id}`, {method:'DELETE'});
}

// ---------- RENDER ----------
function renderHeader(){
  document.getElementById('dateLabel').textContent = fmtDate(currentDate);
  document.getElementById('logDateHint').textContent = '· ' + fmtDate(currentDate);
  document.getElementById('goalInput').value = dailyGoal;
  document.getElementById('goalDisplay').textContent = dailyGoal;

  const totals = dayLog.reduce((a,e)=>({
    kcal:a.kcal+e.kcal, p:a.p+e.protein, f:a.f+e.fat, c:a.c+e.carb
  }), {kcal:0,p:0,f:0,c:0});

  document.getElementById('consumedKcal').textContent = Math.round(totals.kcal);

  const pct = Math.min(100, (totals.kcal/dailyGoal)*100 || 0);
  const fill = document.getElementById('barFill');
  fill.style.width = pct+'%';
  fill.classList.toggle('over', totals.kcal > dailyGoal);

  renderMacroRows(totals);
  renderTicker(totals);
}

function renderTicker(totals){
  const remaining = Math.max(0, dailyGoal - totals.kcal);
  const items = [
    `<b>${Math.round(totals.kcal)}</b> KCAL HEUTE`,
    `NOCH <b>${Math.round(remaining)}</b> KCAL ÜBRIG`,
    `P <b>${Math.round(totals.p)}G</b> · F <b>${Math.round(totals.f)}G</b> · KH <b>${Math.round(totals.c)}G</b>`,
    `${dayLog.length} EINTRAG${dayLog.length===1?'':'E'} · ${fmtDate(currentDate).toUpperCase()}`,
  ];
  const track = document.getElementById('tickerTrack');
  const html = items.map(t=>`<span>${t}</span>`).join('');
  track.innerHTML = html + html; // doppelt für nahtlose Endlos-Schleife
}

function macroRowHTML(key, label, color, value, goal){
  const pct = goal ? Math.min(100, (value/goal)*100) : 0;
  const over = goal && value > goal;
  const rightSide = goal
    ? `<span class="mval" data-edit-macro="${key}" style="cursor:pointer; text-decoration:underline dotted;">${Math.round(value)} / ${goal}g</span>`
    : `<input type="number" class="mgoal-input" data-macro="${key}" placeholder="Ziel g">`;
  return `<div class="macro-row">
    <span class="mlabel"><span class="dot" style="background:${color}"></span>${label}</span>
    <div class="mbar"><div class="mbar-fill" style="width:${pct}%; background:${over?'var(--red)':color}"></div></div>
    ${rightSide}
  </div>`;
}

function renderMacroRows(totals){
  const wrap = document.getElementById('macroRows');
  wrap.innerHTML =
    macroRowHTML('protein','Protein','var(--protein)', totals.p, macroGoals.protein) +
    macroRowHTML('fat','Fett','var(--fat)', totals.f, macroGoals.fat) +
    macroRowHTML('carb','KH','var(--carb)', totals.c, macroGoals.carb);

  wrap.querySelectorAll('.mgoal-input').forEach(inp=>{
    inp.addEventListener('change', async (e)=>{
      const key = e.target.dataset.macro;
      macroGoals[key] = parseFloat(e.target.value) || null;
      await saveSettings();
      renderHeader();
    });
  });
  wrap.querySelectorAll('[data-edit-macro]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      const key = e.target.dataset.editMacro;
      const current = macroGoals[key];
      macroGoals[key] = null;
      renderHeader();
      const input = wrap.querySelector(`.mgoal-input[data-macro="${key}"]`);
      if(input){ input.value = current; input.focus(); }
      macroGoals[key] = current; // restore until actually changed
    });
  });
}

function renderQuickGrid(){
  const grid = document.getElementById('quickGrid');
  grid.innerHTML = quickFoods.map((f,i)=>{
    const kcal = f.fixedKcal!=null ? f.fixedKcal : Math.round(f.kcal100 * f.defaultGrams/100);
    const unit = f.fixedKcal!=null ? 'Stk/Portion' : f.defaultGrams+'g';
    return `<div class="quick-item" data-idx="${i}">
      <button class="del" data-del="${i}">✕</button>
      <div class="qn">${f.name}</div>
      <div class="qd">${unit} · ${kcal} kcal</div>
    </div>`;
  }).join('');
}

function renderLog(){
  const list = document.getElementById('logList');
  if(dayLog.length===0){ list.innerHTML = '<div class="empty">Noch nichts geloggt.</div>'; return; }
  list.innerHTML = dayLog.map((e,i)=>`
    <div class="log-item">
      <div>
        <div class="ln">${e.name}</div>
        <div class="ld">${e.grams ? e.grams+'g · ' : ''}${Math.round(e.kcal)} kcal · P${Math.round(e.protein)} F${Math.round(e.fat)} K${Math.round(e.carb)}</div>
      </div>
      <button class="lx" data-rm="${i}">✕</button>
    </div>
  `).join('');
}

function renderAll(){
  renderHeader(); renderQuickGrid(); renderLog();
}

// ---------- LOG ACTIONS ----------
async function addLogEntry(entry){
  const id = await insertLogEntryRemote(entry);
  dayLog.push({...entry, id});

}
async function removeLogEntry(i){
  const entry = dayLog[i];
  if(entry.id) await deleteLogEntryRemote(entry.id);
  dayLog.splice(i,1);
  renderAll();
}

// ---------- SEARCH (Open Food Facts) ----------
async function searchFood(query){
  const statusEl = document.getElementById('searchStatus');
  const resultsEl = document.getElementById('searchResults');
  resultsEl.innerHTML = '';
  statusEl.textContent = 'Suche läuft...';
  try{
    const url = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(query)}&search_simple=1&action=process&json=1&page_size=100&fields=product_name,nutriments`;
    const res = await fetch(url);
    const data = await res.json();
    let products = (data.products || []).filter(p => p.product_name && p.nutriments && p.nutriments['energy-kcal_100g']!=null);

    // Client-side relevance re-ranking: die Legacy-API sortiert nach Popularität,
    // nicht nach Treffgenauigkeit -> hier nach echten Token-Treffern im Produktnamen sortieren.
    const tokens = query.toLowerCase().split(/\s+/).filter(t=>t.length>1);
    const scored = products.map(p=>{
      const name = p.product_name.toLowerCase();
      let score = 0;
      tokens.forEach(t=>{
        const wordBoundary = new RegExp('\\b'+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b');
        if(wordBoundary.test(name)) score += 3;
        else if(name.includes(t)) score += 1;
      });
      if(name.startsWith(query.toLowerCase())) score += 3;
      if(name.includes(query.toLowerCase())) score += 2;
      return {p, score};
    }).filter(x=>x.score>0);
    scored.sort((a,b)=>b.score-a.score);
    products = scored.length ? scored.map(x=>x.p) : products; // Fallback falls nichts matcht
    if(products.length===0){
      statusEl.innerHTML = 'Nichts gefunden. Wenn du den Barcode zur Hand hast, kannst du das Produkt auch <button id="contributeFromSearchBtn" style="background:none; border:1px solid var(--orange); color:var(--orange); padding:3px 9px; font-size:0.76rem;">per Scan anlegen</button>.';
      document.getElementById('contributeFromSearchBtn').onclick = ()=>{ statusEl.textContent=''; startScan(); };
      return;
    }
    statusEl.textContent = '';
    resultsEl.innerHTML = products.slice(0,8).map((p,i)=>{
      const n = p.nutriments;
      return `<div class="result-item">
        <div>
          <div class="rn">${p.product_name}</div>
          <div class="rd">${Math.round(n['energy-kcal_100g'])} kcal /100g · P${Math.round(n.proteins_100g||0)} F${Math.round(n.fat_100g||0)} K${Math.round(n.carbohydrates_100g||0)}</div>
        </div>
        <button data-result="${i}">+</button>
      </div>`;
    }).join('');
    resultsEl.querySelectorAll('button[data-result]').forEach(btn=>{
      btn.onclick = ()=>{
        const p = products[btn.dataset.result];
        const n = p.nutriments;
        searchResultModal({
          name:p.product_name, kcal100:n['energy-kcal_100g'],
          p100:n.proteins_100g||0, f100:n.fat_100g||0, c100:n.carbohydrates_100g||0
        });
      };
    });
  }catch(e){
    statusEl.textContent = 'Suche fehlgeschlagen — evtl. keine Internetverbindung.';
  }
}

// ---------- BARCODE SCAN ----------
let html5QrCode = null;

async function startScan(){
  document.getElementById('scanModal').classList.add('open');
  document.getElementById('scanStatus').textContent = 'Kamera wird gestartet...';
  html5QrCode = new Html5Qrcode("scanReader");
  try{
    await html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 260, height: 150 } },
      onScanSuccess,
      ()=>{} // laufende Fehl-Scans ignorieren
    );
    document.getElementById('scanStatus').textContent = 'Barcode ins Bild halten...';
  }catch(e){
    document.getElementById('scanStatus').textContent = 'Kamera-Zugriff fehlgeschlagen — Berechtigung erteilt?';
  }
}

async function stopScan(){
  if(html5QrCode){
    try{ await html5QrCode.stop(); html5QrCode.clear(); }catch(e){}
    html5QrCode = null;
  }
  document.getElementById('scanModal').classList.remove('open');
}

async function onScanSuccess(decodedText){
  await stopScan();
  document.getElementById('searchStatus').textContent = 'Produkt wird geladen...';
  try{
    const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${decodedText}.json?fields=product_name,nutriments`);
    const data = await res.json();
    if(data.status !== 1 || !data.product || !data.product.product_name){
      showContributeOffer(decodedText, `Kein Produkt zu Barcode ${decodedText} gefunden.`);
      return;
    }
    const n = data.product.nutriments || {};
    if(n['energy-kcal_100g']==null){
      showContributeOffer(decodedText, `${data.product.product_name} gefunden, aber keine Kalorienangabe hinterlegt.`);
      return;
    }
    document.getElementById('searchStatus').textContent = '';
    searchResultModal({
      name:data.product.product_name, kcal100:n['energy-kcal_100g'],
      p100:n.proteins_100g||0, f100:n.fat_100g||0, c100:n.carbohydrates_100g||0
    });
  }catch(e){
    document.getElementById('searchStatus').textContent = 'Produkt-Lookup fehlgeschlagen.';
  }
}

document.getElementById('scanBtn').onclick = startScan;
document.getElementById('scanCloseBtn').onclick = stopScan;

// ---------- CONTRIBUTE MISSING PRODUCT TO OFF ----------
function showContributeOffer(barcode, msg){
  const statusEl = document.getElementById('searchStatus');
  statusEl.innerHTML = `${msg} <button id="contributeBtn" style="margin-left:6px; background:none; border:1px solid var(--orange); color:var(--orange); padding:4px 10px; font-size:0.76rem;">+ Produkt anlegen (mit Foto)</button>`;
  document.getElementById('contributeBtn').onclick = ()=> openContributeModal(barcode);
}

function openContributeModal(barcode){
  openModal(`
    <h3>Produkt anlegen</h3>
    <label>Barcode</label>
    <input type="text" id="cfBarcode" value="${barcode}" readonly>
    <label>Produktname</label>
    <input type="text" id="cfName" placeholder="z.B. Cola Zero Vanille 1,25L">
    <div class="modal-grid">
      <div><label>kcal / 100g</label><input type="number" id="cfKcal"></div>
      <div><label>Protein / 100g</label><input type="number" id="cfP"></div>
      <div><label>Fett / 100g</label><input type="number" id="cfF"></div>
      <div><label>KH / 100g</label><input type="number" id="cfC"></div>
    </div>
    <label>Foto vom Etikett</label>
    <input type="file" id="cfPhoto" accept="image/*" capture="environment">
    <div class="save-status" id="cfStatus" style="margin-top:8px;"></div>
    <div class="modal-actions">
      <button class="btn-secondary" id="modalCancel">Abbrechen</button>
      <button class="btn-primary" id="cfSubmit">Einreichen &amp; lokal speichern</button>
    </div>
  `);
  document.getElementById('modalCancel').onclick = closeModal;
  document.getElementById('cfSubmit').onclick = submitContribution;
}

async function submitContribution(){
  const barcode = document.getElementById('cfBarcode').value.trim();
  const name = document.getElementById('cfName').value.trim();
  const kcal = parseFloat(document.getElementById('cfKcal').value) || 0;
  const p = parseFloat(document.getElementById('cfP').value) || 0;
  const f = parseFloat(document.getElementById('cfF').value) || 0;
  const c = parseFloat(document.getElementById('cfC').value) || 0;
  const photoInput = document.getElementById('cfPhoto');
  const statusEl = document.getElementById('cfStatus');

  if(!name){ statusEl.textContent = 'Bitte Produktname eingeben.'; return; }

  // Sofort lokal in die Schnellauswahl übernehmen, unabhängig vom Community-Upload
  const localFood = {name, kcal100:kcal, p100:p, f100:f, c100:c, defaultGrams:100};
  const saved = await addQuickFoodRemote(localFood);
  quickFoods.push(saved || localFood);
  renderQuickGrid();

  statusEl.textContent = 'Lokal gespeichert ✓ — sende an Open Food Facts...';

  try{
    const fd = new FormData();
    fd.set('barcode', barcode);
    fd.set('product_name', name);
    fd.set('kcal100', kcal);
    fd.set('protein100', p);
    fd.set('fat100', f);
    fd.set('carb100', c);
    if(photoInput.files[0]) fd.set('image', photoInput.files[0]);

    const res = await fetch(OFF_EDGE_FUNCTION_URL, {method:'POST', body:fd});
    const json = await res.json();
    statusEl.textContent = json.success
      ? 'Lokal gespeichert ✓ — an Open Food Facts übermittelt ✓'
      : `Lokal gespeichert ✓ — Community-Upload fehlgeschlagen (${json.message})`;
  }catch(e){
    statusEl.textContent = 'Lokal gespeichert ✓ — Community-Upload fehlgeschlagen (keine Verbindung zur Edge Function).';
  }

  setTimeout(closeModal, 1800);
}

  }
  const item = e.target.closest('.quick-item');
  if(item){
    const idx = parseInt(item.dataset.idx);
    quickAddModal(quickFoods[idx]);
  }
});

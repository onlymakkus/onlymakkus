<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake — onlymakkus</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--black:#0a0a08;--cream:#f2ede4;--orange:#ff4e1a;--muted:#9a9488;--card:#141410;--border:rgba(255,255,255,0.08)}
    html,body{height:100%;height:calc(var(--vh, 1vh) * 100)}
    body{background:var(--black);color:var(--cream);font-family:'DM Mono',monospace;min-height:100vh;display:flex;flex-direction:column;cursor:none;overflow-x:hidden}
    .cursor{position:fixed;width:12px;height:12px;background:var(--orange);border-radius:50%;pointer-events:none;z-index:10000;transform:translate(-50%,-50%);mix-blend-mode:difference;transition:width .2s,height .2s}
    .cursor.big{width:36px;height:36px}
    nav{padding:18px 40px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
    .nav-logo{font-family:'Bebas Neue';font-size:1.4rem;letter-spacing:.1em;color:var(--cream);text-decoration:none}
    .nav-center{font-family:'Bebas Neue';font-size:1.5rem;letter-spacing:.1em}
    .nav-center span{color:var(--orange)}
    .nav-links{display:flex;gap:20px}
    .nav-link{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);text-decoration:none;transition:color .2s}
    .nav-link:hover{color:var(--cream)}

    /* Topbar (schwebend, fixed) — ersetzt alte statische nav */
    .topbar{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:rgba(10,10,8,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
    .topbar-title{font-family:'Bebas Neue';letter-spacing:.15em;font-size:1.05rem;color:var(--cream)}
    .topbar-title span{color:var(--orange)}
    .tb-back{background:none;border:1px solid var(--border);color:var(--muted);font-family:'DM Mono';font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;padding:8px 14px;text-decoration:none;transition:all .2s}
    .tb-back:hover{border-color:var(--orange);color:var(--orange)}
    .top-hud{top:52px}
    main{flex:1;display:flex;flex-direction:column;align-items:center;padding:32px 20px 60px;gap:24px;padding-top:66px}
    .score-bar{display:flex;gap:40px;justify-content:center}
    .stat-box{text-align:center}
    .stat-val{font-family:'Bebas Neue';font-size:2.2rem;color:var(--orange);line-height:1}
    .stat-label{font-size:.52rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:3px}
    .canvas-wrap{position:relative}
    canvas{border:1px solid rgba(255,78,26,.3);display:block;image-rendering:pixelated;max-width:100%}
    .go-overlay{display:none;position:absolute;inset:0;background:rgba(10,10,8,.92);flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
    .go-overlay.show{display:flex}
    .go-title{font-family:'Bebas Neue';font-size:3.5rem;color:var(--orange);line-height:1}
    .go-sub{font-size:.72rem;color:var(--muted)}
    .go-input{background:#1c1c18;border:1px solid var(--border);color:var(--cream);font-family:'DM Mono';font-size:.85rem;padding:11px 16px;outline:none;width:210px;text-align:center;transition:border-color .2s}
    .go-input:focus{border-color:var(--orange)}
    .go-input::placeholder{color:#444}
    .go-btn{padding:11px 28px;background:var(--orange);color:var(--black);border:none;font-family:'DM Mono';font-size:.68rem;font-weight:500;letter-spacing:.15em;text-transform:uppercase;cursor:none;transition:background .2s}
    .go-btn:hover{background:#ff6b3d}
    .go-skip{font-size:.6rem;color:var(--muted);background:none;border:none;cursor:none;text-decoration:underline}
    .go-msg{font-size:.62rem;color:var(--orange);min-height:16px}
    .hint{font-size:.62rem;color:var(--muted);text-align:center;letter-spacing:.06em;line-height:1.8}
    .btn-start{padding:13px 36px;background:var(--orange);color:var(--black);border:none;font-family:'DM Mono';font-size:.72rem;font-weight:500;letter-spacing:.2em;text-transform:uppercase;cursor:none;transition:background .2s,transform .2s}
    .btn-start:hover{background:#ff6b3d;transform:translateY(-2px)}

    /* Mobile: Swipe-Steuerung */
    body{overscroll-behavior:none}
    canvas{touch-action:none}
    .hint-mobile{display:none}
    main.playing{user-select:none;-webkit-user-select:none}
    @media(hover:none) and (pointer:coarse){
      .cursor{display:none}
      body{cursor:auto}
      .hint{display:none}
      .hint-mobile{display:block;font-size:.62rem;color:var(--muted);text-align:center;letter-spacing:.06em;line-height:1.8}
    }
    .section-label{font-size:.6rem;letter-spacing:.35em;text-transform:uppercase;color:var(--orange);margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:14px;width:100%}
    .section-label::before,.section-label::after{content:'';flex:0 0 32px;height:1px;background:var(--border)}
    .hi-table{width:100%;max-width:480px;display:flex;flex-direction:column;gap:2px}
    .hi-row{background:var(--card);padding:12px 18px;display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center}
    .hi-rank{font-family:'Bebas Neue';font-size:1.1rem;color:var(--muted)}
    .hi-name{font-size:.78rem}
    .hi-score{font-family:'Bebas Neue';font-size:1.3rem;color:var(--orange)}
    .hi-empty{padding:24px;text-align:center;font-size:.7rem;color:#444;font-style:italic;background:var(--card);width:100%;max-width:480px}
    .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:var(--cream);color:var(--black);font-family:'DM Mono';font-size:.72rem;font-weight:500;letter-spacing:.1em;padding:10px 22px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:500;white-space:nowrap}
    .toast.show{opacity:1}
    footer{padding:32px 40px;border-top:1px solid var(--border);display:flex;justify-content:center;gap:40px;font-size:.6rem;color:var(--muted);letter-spacing:.15em}
    @media(max-width:480px){nav{padding:14px 16px}.nav-center{font-size:1.2rem}}
  
    /* --- account widget --- */
    .nav-right{display:flex;align-items:center;gap:14px}
    .acct{position:relative;display:flex;align-items:center}
    .acct-login{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--cream);background:transparent;border:1px solid var(--border);padding:7px 12px;cursor:pointer;text-decoration:none;transition:border-color .2s,color .2s}
    .acct-login:hover{border-color:var(--orange);color:var(--orange)}
    .acct-chip{display:flex;align-items:center;gap:9px;background:transparent;border:1px solid var(--border);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;font-family:'DM Mono',monospace;color:var(--cream);transition:border-color .2s}
    .acct-chip:hover{border-color:var(--orange)}
    .acct-av{width:26px;height:26px;border-radius:50%;background:var(--orange);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:.95rem;color:#0a0a08;flex-shrink:0;overflow:hidden;line-height:1}
    .acct-av.lg{width:44px;height:44px;font-size:1.5rem}
    .acct-av.has-img{color:transparent;background-color:var(--card2,#1c1c18)}
    .acct-name{font-size:.68rem;letter-spacing:.06em;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .acct-lvl{font-size:.52rem;letter-spacing:.1em;color:var(--orange);border:1px solid var(--border);border-radius:999px;padding:2px 7px;flex-shrink:0}
    .acct-menu{position:absolute;top:calc(100% + 10px);right:0;min-width:236px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px;flex-direction:column;gap:2px;box-shadow:0 14px 40px rgba(0,0,0,.5);z-index:9000;display:flex}
    .acct-menu-head{display:flex;align-items:center;gap:12px;padding:10px 10px 12px}
    .acct-menu-name{font-size:.82rem;letter-spacing:.04em;color:var(--cream)}
    .acct-menu-title{font-family:'Instrument Serif',serif;font-style:italic;font-size:.92rem;color:var(--orange);margin-top:2px}
    .acct-xp{padding:8px 10px 12px;border-top:1px solid var(--border)}
    .acct-xp-info{display:flex;justify-content:space-between;font-size:.54rem;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
    .acct-xp-bar{height:6px;border-radius:999px;background:var(--border);overflow:hidden}
    .acct-xp-fill{height:100%;width:0;background:linear-gradient(90deg,var(--orange),#ff6b3d);border-radius:999px;transition:width .5s ease}
    .acct-menu-item{display:block;width:100%;padding:10px;border-radius:8px;font-family:'DM Mono',monospace;font-size:.64rem;letter-spacing:.09em;text-transform:uppercase;color:var(--cream);text-decoration:none;background:transparent;border:none;text-align:left;cursor:pointer;transition:background .15s,color .15s}
    .acct-menu-item:hover{background:var(--card2,#1c1c18)}
    .acct-menu-item.danger{color:var(--muted)}
    .acct-menu-item.danger:hover{color:#ff5555;background:rgba(255,68,68,.09)}
    .acct-login[hidden],.acct-chip[hidden],.acct-menu[hidden],.acct-lvl[hidden],.acct-menu-title[hidden],.acct-xp[hidden]{display:none}

  </style>
</head>
<body>
<div class="cursor" id="cursor"></div>
<div class="toast" id="toast"></div>
<div class="topbar">
  <a class="tb-back" href="gaming.html">← Gaming</a>
  <div class="topbar-title">SNAKE<span> Classic</span></div>
  <div class="acct" id="acct">
        <a class="acct-login" id="acctLogin" href="profile.html" hidden>Anmelden</a>
        <button class="acct-chip" id="acctChip" type="button" aria-haspopup="true" aria-expanded="false" hidden>
          <span class="acct-av" id="acctAv"></span>
          <span class="acct-name" id="acctName"></span>
          <span class="acct-lvl" id="acctLvl" hidden></span>
        </button>
        <div class="acct-menu" id="acctMenu" hidden>
          <div class="acct-menu-head">
            <span class="acct-av lg" id="acctAvLg"></span>
            <div>
              <div class="acct-menu-name" id="acctMenuName"></div>
              <div class="acct-menu-title" id="acctMenuTitle" hidden></div>
            </div>
          </div>
          <div class="acct-xp" id="acctXp" hidden>
            <div class="acct-xp-info"><span id="acctXpLabel">Level 1</span><span id="acctXpVal">0 / 100 XP</span></div>
            <div class="acct-xp-bar"><div class="acct-xp-fill" id="acctXpFill"></div></div>
          </div>
          <a class="acct-menu-item" href="profile.html">Profil</a>
          <button class="acct-menu-item danger" id="acctLogout" type="button">Abmelden</button>
        </div>
      </div>
</div>
<main>
  <div class="score-bar">
    <div class="stat-box"><div class="stat-val" id="score">0</div><div class="stat-label">Punkte</div></div>
    <div class="stat-box"><div class="stat-val" id="hi">0</div><div class="stat-label">Rekord</div></div>
    <div class="stat-box"><div class="stat-val" id="level">1</div><div class="stat-label">Level</div></div>
  </div>
  <div class="canvas-wrap">
    <canvas id="c" width="400" height="400"></canvas>
    <div class="go-overlay" id="go">
      <div class="go-title">GAME OVER</div>
      <div class="go-sub" id="go-sub">Score: 0</div>
      <div style="display:flex;flex-direction:column;gap:8px;align-items:center">
        <div style="font-size:.6rem;color:var(--muted);letter-spacing:.1em">Name für Highscore</div>
        <input class="go-input" id="go-name" placeholder="Dein Name" maxlength="20">
        <input type="text" id="go-hp" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0;">
        <button class="go-btn" id="go-save">Speichern →</button>
        <div class="go-msg" id="go-msg"></div>
        <button class="go-skip" id="go-skip">Überspringen</button>
      </div>
    </div>
  </div>
  <div style="text-align:center">
    <p class="hint">↑↓←→ oder WASD · Space = Pause</p>
    <p class="hint-mobile">Swipe = Steuern · Tipp aufs Feld = Pause</p>
    <br>
    <button class="btn-start" id="btn-start">▶ Starten</button>
  </div>
  <div class="section-label">🏆 Top 10 Highscores</div>
  <div class="hi-table" id="scores"><div class="hi-empty">Lädt…</div></div>
</main>
<footer><span>© 2026 onlymakkus.de</span><a href="impressum.html" style="color:var(--muted);text-decoration:none;">Impressum</a><a href="datenschutz.html" style="color:var(--muted);text-decoration:none;">Datenschutz</a><span>snake edition</span></footer>
<script>
const SB='https://bsubsesbcxdaqofmkiqg.supabase.co';
const KEY='sb_publishable_fA2Dca6SVp0eB8k_WuqLrw_zplTnXBU';
function omSession(){try{return JSON.parse(localStorage.getItem('om_profile_session')||'null')}catch{return null}}
async function sbFetch(p,o={}){
  const r=await fetch(SB+p,{...o,headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':o.prefer||'',...o.headers}});
  const t=await r.text();return t?JSON.parse(t):null;
}
function setVH(){const h=(window.visualViewport?window.visualViewport.height:window.innerHeight);document.documentElement.style.setProperty('--vh',(h*0.01)+'px')}
setVH();
window.addEventListener('resize',setVH);
window.addEventListener('orientationchange',setVH);
if(window.visualViewport)window.visualViewport.addEventListener('resize',setVH);

const cursor=document.getElementById('cursor');
document.addEventListener('mousemove',e=>{cursor.style.left=e.clientX+'px';cursor.style.top=e.clientY+'px'});
document.querySelectorAll('a,button').forEach(el=>{el.addEventListener('mouseenter',()=>cursor.classList.add('big'));el.addEventListener('mouseleave',()=>cursor.classList.remove('big'))});
let toastTimer;
function toast(msg,d=1800){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),d)}
async function loadScores(){
  try{
    const data=await sbFetch('/rest/v1/snake_scores?name=not.like.BB:*&name=not.like.TT:*&name=not.like.FB:*&select=*&order=score.desc&limit=10');
    const medals=['🥇','🥈','🥉'];
    const el=document.getElementById('scores');
    if(!data||!data.length){el.innerHTML='<div class="hi-empty">Noch keine Scores — sei der Erste! 🐍</div>';return;}
    el.innerHTML=data.map((s,i)=>`<div class="hi-row"><div class="hi-rank">${medals[i]||'#'+(i+1)}</div><div class="hi-name">${s.name}</div><div class="hi-score">${s.score}</div></div>`).join('');
  }catch{document.getElementById('scores').innerHTML='<div class="hi-empty">Fehler beim Laden.</div>'}
}
loadScores();
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const G=20,COLS=canvas.width/G,ROWS=canvas.height/G;
let snake,dir,nd,food,score,hi=parseInt(localStorage.getItem('sn_hi')||'0'),loop,running,paused,gameStartTime=0;
let dirQueue=[];
// Richtungswechsel puffern: erlaubt 2 schnelle Swipes/Tasten innerhalb eines Ticks
function queueDir(n){
  const last=dirQueue.length?dirQueue[dirQueue.length-1]:dir;
  if(n.x===last.x&&n.y===last.y)return;      // gleiche Richtung ignorieren
  if(n.x===-last.x&&n.y===-last.y)return;    // 180° verboten
  if(dirQueue.length<2)dirQueue.push(n);
}
document.getElementById('hi').textContent=hi;
function init(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};nd={x:1,y:0};dirQueue=[];
  score=0;running=false;paused=false;
  placeFood();
  document.getElementById('score').textContent=0;
  document.getElementById('level').textContent=1;
  document.getElementById('go').classList.remove('show');
  draw();
}
function placeFood(){do{food={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)}}while(snake.some(s=>s.x===food.x&&s.y===food.y))}
function speed(){return Math.max(65,190-Math.floor(score/5)*15)}
function step(){
  if(dirQueue.length)nd=dirQueue.shift();
  dir=nd;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.x>=COLS||h.y<0||h.y>=ROWS||snake.some(s=>s.x===h.x&&s.y===h.y)){end();return}
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){score++;document.getElementById('score').textContent=score;document.getElementById('level').textContent=Math.floor(score/5)+1;placeFood();clearInterval(loop);loop=setInterval(step,speed())}
  else snake.pop();
  draw();
}
function draw(){
  ctx.fillStyle='#0a0a08';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='rgba(255,255,255,.025)';
  for(let x=0;x<COLS;x++)for(let y=0;y<ROWS;y++)ctx.fillRect(x*G+G/2-1,y*G+G/2-1,2,2);
  const p=.7+.3*Math.sin(Date.now()/200);
  ctx.fillStyle=`rgba(242,237,228,${p})`;ctx.fillRect(food.x*G+3,food.y*G+3,G-6,G-6);
  snake.forEach((s,i)=>{
    const a=i===0?1:Math.max(.3,1-(i/snake.length)*.7);
    ctx.fillStyle=i===0?'#ff4e1a':`rgba(255,78,26,${a})`;ctx.fillRect(s.x*G+1,s.y*G+1,G-2,G-2);
    if(i===0){ctx.fillStyle='#ff8060';ctx.fillRect(s.x*G+3,s.y*G+3,4,4)}
  });
  if(paused){ctx.fillStyle='rgba(10,10,8,.7)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#ff4e1a';ctx.font='bold 16px "DM Mono"';ctx.textAlign='center';ctx.fillText('// PAUSE',canvas.width/2,canvas.height/2);ctx.fillStyle='#9a9488';ctx.font='12px "DM Mono"';ctx.fillText('SPACE zum Weitermachen',canvas.width/2,canvas.height/2+24)}
  if(!running&&!paused){ctx.fillStyle='rgba(10,10,8,.5)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#ff4e1a';ctx.font='bold 13px "DM Mono"';ctx.textAlign='center';ctx.fillText('▶ STARTEN',canvas.width/2,canvas.height/2);ctx.fillStyle='#9a9488';ctx.font='11px "DM Mono"';ctx.fillText('WASD oder Pfeiltasten',canvas.width/2,canvas.height/2+22)}
}
function start(){if(running)return;init();running=true;gameStartTime=Date.now();document.querySelector('main').classList.add('playing');document.getElementById('btn-start').textContent='▶ Läuft…';loop=setInterval(step,speed())}
function end(){
  clearInterval(loop);running=false;
  document.querySelector('main').classList.remove('playing');
  if(score>hi){hi=score;localStorage.setItem('sn_hi',hi);document.getElementById('hi').textContent=hi}
  document.getElementById('go-sub').textContent='Score: '+score+' Punkte';
  document.getElementById('go-msg').textContent='';
  {const _s=omSession();const _n=document.getElementById('go-name');const _lbl=_n.previousElementSibling;if(_s){_n.style.display='none';if(_lbl)_lbl.textContent='Wird als '+(_s.displayName||_s.name)+' gespeichert';}else{_n.style.display='';_n.value=localStorage.getItem('sn_name')||'';}}
  document.getElementById('go').classList.add('show');
  document.getElementById('btn-start').textContent='▶ Nochmal';
}
document.addEventListener('keydown',e=>{
  const m={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0},W:{x:0,y:-1},S:{x:0,y:1},A:{x:-1,y:0},D:{x:1,y:0}};
  if(e.key===' '){e.preventDefault();if(!running){start();return}paused=!paused;if(paused){clearInterval(loop);draw()}else loop=setInterval(step,speed());return}
  if(m[e.key]&&running&&!paused){queueDir(m[e.key]);if(e.key.startsWith('Arrow'))e.preventDefault()}
});
// ── Touch / Swipe (ganzer Bildschirm) ──
// Läuft das Spiel, ist überall Swipe-Fläche — nicht nur auf dem Canvas.
// Buttons, Links und der Game-Over-Overlay bleiben normal bedienbar.
let ts=null, lastSwipeDir=null;
const MIN_SWIPE=20; // px minimum
function touchOnUI(e){
  return e.target.closest && e.target.closest('input,button,a,.go-overlay,.topbar,footer');
}

document.addEventListener('touchstart',e=>{
  if(touchOnUI(e)){ts=null;return}
  ts=e.touches[0];
  lastSwipeDir=null;
},{passive:true});

document.addEventListener('touchmove',e=>{
  if(!ts)return;
  if(!running||paused)return;
  e.preventDefault(); // verhindert Scrollen & Pull-to-Refresh während des Spiels
  const t=e.touches[0];
  const dx=t.clientX-ts.clientX, dy=t.clientY-ts.clientY;
  if(Math.max(Math.abs(dx),Math.abs(dy))<MIN_SWIPE)return;
  let n;
  if(Math.abs(dx)>Math.abs(dy)){n=dx>0?{x:1,y:0}:{x:-1,y:0};}
  else{n=dy>0?{x:0,y:1}:{x:0,y:-1};}
  const key=JSON.stringify(n);
  if(key!==lastSwipeDir){
    queueDir(n); lastSwipeDir=key;
    // Fingerposition neu setzen → nächster Swipe ohne Absetzen möglich
    ts=e.touches[0];
  }
},{passive:false});

document.addEventListener('touchend',e=>{
  if(!ts)return;
  const dx=e.changedTouches[0].clientX-ts.clientX;
  const dy=e.changedTouches[0].clientY-ts.clientY;
  // Kurzer Tipp aufs Spielfeld = Start/Pause (nur Canvas, sonst pausiert
  // jedes Antippen der Highscore-Liste das Spiel)
  if(Math.max(Math.abs(dx),Math.abs(dy))<MIN_SWIPE && e.target===canvas){
    if(!running){start();}
    else{paused=!paused;if(paused){clearInterval(loop);draw();}else{loop=setInterval(step,speed());}}
  }
  ts=null; lastSwipeDir=null;
},{passive:true});

document.getElementById('btn-start').addEventListener('click',start);
document.getElementById('go-save').addEventListener('click',async()=>{
  const name=document.getElementById('go-name').value.trim(),msg=document.getElementById('go-msg');
  const hp=document.getElementById('go-hp').value;
  if(hp){msg.textContent='✓ Gespeichert!';setTimeout(()=>{document.getElementById('go').classList.remove('show');init()},1200);return}
  if(!name && !omSession()){msg.textContent='⚠ Name eingeben';return}
  const elapsed=(Date.now()-gameStartTime)/1000;
  const minTimeNeeded=score*0.3;
  if(gameStartTime===0||elapsed<minTimeNeeded||elapsed<1){msg.textContent='⚠ Ungültiger Spielverlauf';return}
  if(score>500){msg.textContent='⚠ Score außerhalb des möglichen Bereichs';return}
  document.getElementById('go-save').textContent='…';
  try{await sbFetch('/rest/v1/snake_scores',{method:'POST',prefer:'return=minimal',body:JSON.stringify((()=>{const _s=omSession();return _s?{name:(_s.displayName||_s.name),score,profile_id:_s.id}:{name,score};})())});localStorage.setItem('sn_name',name);msg.textContent='✓ Gespeichert!';await loadScores();setTimeout(()=>{document.getElementById('go').classList.remove('show');init()},1200)}
  catch{msg.textContent='❌ Fehler'}
  document.getElementById('go-save').textContent='Speichern →';
});
document.getElementById('go-skip').addEventListener('click',()=>{document.getElementById('go').classList.remove('show');init()});
function anim(){draw();requestAnimationFrame(anim)}
anim();init();
</script>
  <script>
(function(){
  var SESS='om_profile_session';
  var acct=document.getElementById('acct'); if(!acct) return;
  var s=null; try{ s=JSON.parse(localStorage.getItem(SESS)||'null'); }catch(e){ s=null; }
  var login=document.getElementById('acctLogin');
  var chip=document.getElementById('acctChip');
  var menu=document.getElementById('acctMenu');
  function initial(n){ n=(n||'').trim(); return n?n.charAt(0).toUpperCase():'?'; }
  function paintAv(el){ if(!el)return; if(s&&s.avatarUrl){ el.style.backgroundImage='url("'+s.avatarUrl+'")'; el.classList.add('has-img'); el.textContent=''; } else { el.textContent=initial(s&&(s.displayName||s.name)); } }
  if(!s||!s.id){ if(login)login.hidden=false; return; }
  if(chip)chip.hidden=false;
  var name=s.displayName||s.name||'Profil';
  var full=name+(s.discriminator?('#'+s.discriminator):'');
  document.getElementById('acctName').textContent=name;
  document.getElementById('acctMenuName').textContent=full;
  paintAv(document.getElementById('acctAv'));
  paintAv(document.getElementById('acctAvLg'));
  if(s.level!=null){ var lv=document.getElementById('acctLvl'); lv.hidden=false; lv.textContent='LV '+s.level; }
  if(s.title){ var ti=document.getElementById('acctMenuTitle'); ti.hidden=false; ti.textContent=s.title; }
  if(s.xp!=null&&s.xpNext!=null){ var xp=document.getElementById('acctXp'); xp.hidden=false;
    document.getElementById('acctXpLabel').textContent='Level '+(s.level!=null?s.level:1);
    document.getElementById('acctXpVal').textContent=s.xp+' / '+s.xpNext+' XP';
    var pct=s.xpNext?Math.max(0,Math.min(100,s.xp/s.xpNext*100)):0;
    document.getElementById('acctXpFill').style.width=pct+'%';
  }
  function closeM(){ menu.hidden=true; chip.setAttribute('aria-expanded','false'); }
  function openM(){ menu.hidden=false; chip.setAttribute('aria-expanded','true'); }
  chip.addEventListener('click',function(e){ e.stopPropagation(); if(menu.hidden)openM();else closeM(); });
  document.addEventListener('click',function(e){ if(!acct.contains(e.target))closeM(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape')closeM(); });
  var lo=document.getElementById('acctLogout');
  if(lo)lo.addEventListener('click',function(){ try{localStorage.removeItem(SESS);}catch(e){} location.href='profile.html'; });
})();
</script>

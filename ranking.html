<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranking — onlymakkus</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root,[data-theme="dark"]{--black:#0a0a08;--cream:#f2ede4;--orange:#ff4e1a;--orange2:#ff6b3d;--muted:#9a9488;--card:#141410;--card2:#1c1c18;--border:rgba(255,255,255,0.08);--gold:#ffd700;--silver:#c0c0c0;--bronze:#cd7f32;--body-bg:var(--black);--body-text:var(--cream);color-scheme:dark}
  [data-theme="light"]{--black:#2A2420;--cream:#2A2420;--orange:#FF6E35;--orange2:#e85a1f;--muted:#8A8078;--card:#FFFFFF;--card2:#FFF6EE;--border:rgba(42,36,32,0.1);--gold:#c99700;--silver:#8a8a8a;--bronze:#a86523;--body-bg:#FBF6EE;--body-text:#2A2420;color-scheme:light}
  body{background:var(--body-bg);color:var(--body-text);font-family:'DM Mono',monospace;cursor:none;min-height:100vh;transition:background .3s,color .3s}
  .cursor{position:fixed;width:12px;height:12px;background:var(--orange);border-radius:50%;pointer-events:none;z-index:10000;transform:translate(-50%,-50%);mix-blend-mode:difference;transition:width .15s,height .15s}
  .cursor.big{width:36px;height:36px}
  [data-theme="light"] .cursor{mix-blend-mode:normal}
  a{color:inherit;text-decoration:none}

  nav{padding:20px 40px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
  .nav-logo{font-family:'Bebas Neue';font-size:1.4rem;letter-spacing:.1em;color:var(--body-text)}
  .nav-right{display:flex;gap:20px;align-items:center}
  .nav-link{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--body-text);opacity:.5;transition:opacity .2s}
  .nav-link:hover{opacity:1}
  .theme-toggle{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--body-text);background:transparent;border:1px solid var(--border);padding:7px 12px;cursor:pointer;}
  .theme-toggle:hover{border-color:var(--orange);color:var(--orange);}

  .wrap{max-width:760px;margin:0 auto;padding:0 24px}
  .head{padding:52px 0 28px;text-align:center}
  .head h1{font-family:'Bebas Neue';font-size:clamp(2.8rem,8vw,4.5rem);line-height:.95;letter-spacing:.02em}
  .head h1 span{color:var(--orange)}
  .head p{max-width:420px;margin:14px auto 0;color:var(--muted);font-size:.8rem;line-height:1.6}

  .pills{display:flex;gap:8px;justify-content:center;margin-top:26px;flex-wrap:wrap}
  .pill{font-family:'DM Mono',monospace;font-size:.66rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
    border:1px solid var(--border);padding:10px 18px;cursor:none;background:transparent;color:var(--muted);border-radius:6px;transition:all .2s}
  .pill:hover{border-color:var(--orange);color:var(--orange)}
  .pill.active{background:var(--orange);border-color:var(--orange);color:#fff}
  [data-theme="dark"] .pill.active{color:var(--black)}

  main{padding:36px 0 80px}
  .view{display:none}
  .view.active{display:block}
  .view-sub{text-align:center;font-size:.72rem;color:var(--muted);margin-bottom:28px;line-height:1.6}

  /* Podium */
  .podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:36px;align-items:end}
  .podium.n1{grid-template-columns:1fr;max-width:220px;margin-left:auto;margin-right:auto}
  .podium.n2{grid-template-columns:1fr 1fr;max-width:440px;margin-left:auto;margin-right:auto}
  .pod{border:1px solid var(--border);background:var(--card);text-align:center;padding:18px 12px;border-radius:8px}
  .pod .place{font-family:'DM Mono',monospace;font-weight:500;font-size:.62rem;letter-spacing:.1em;margin-bottom:8px;text-transform:uppercase}
  .pod.p1 .place{color:var(--gold)}
  .pod.p2 .place{color:var(--silver)}
  .pod.p3 .place{color:var(--bronze)}
  .pod .pod-name{font-family:'Bebas Neue';font-size:1.15rem;letter-spacing:.03em;margin-bottom:3px;line-height:1.1}
  .pod .pod-val{font-family:'DM Mono',monospace;font-weight:500;color:var(--muted);font-size:.68rem}
  .pod.first{transform:translateY(-12px);border-color:var(--orange);border-width:1.5px}

  /* Avatar circle */
  .av{border-radius:50%;border:1px solid var(--border);background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue';overflow:hidden;flex:0 0 auto}
  [data-theme="dark"] .av{color:var(--black)}
  .av img{width:100%;height:100%;object-fit:cover;display:block}
  .pod .av{width:48px;height:48px;font-size:1.2rem;margin:0 auto 10px}
  .row .av{width:34px;height:34px;font-size:.9rem}

  /* List */
  .list{border:1px solid var(--border);background:var(--card);border-radius:8px;overflow:hidden}
  .row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--border)}
  .row:last-child{border-bottom:none}
  .row.me{background:rgba(255,78,26,0.08)}
  .pos{font-family:'DM Mono',monospace;font-weight:500;font-size:.8rem;color:var(--muted);width:26px;flex:0 0 auto}
  .row-name{flex:1;font-size:.85rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row-tag{font-family:'DM Mono',monospace;font-size:.58rem;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--orange);margin-left:6px}
  .row-val{font-family:'DM Mono',monospace;font-weight:500;font-size:.8rem;color:var(--muted);text-align:right;flex:0 0 auto}
  .row-val small{display:block;font-size:.56rem;opacity:.7;margin-top:1px}
  .row-bar{height:2px;background:var(--border);margin-top:5px;overflow:hidden;border-radius:2px}
  .row-bar-fill{height:100%;background:var(--orange)}
  .row-bar-fill.done{background:#22c55e}

  .empty{padding:28px;text-align:center;font-size:.75rem;color:var(--muted);font-style:italic}

  /* Hall of Fame */
  .hof-year{margin-bottom:12px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .hof-year-head{display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:14px 16px;cursor:none;background:var(--card);border:none;width:100%;
    font-family:inherit;color:var(--body-text);text-align:left}
  .hof-year-head:hover{background:var(--card2)}
  .hof-year-label{font-family:'Bebas Neue';font-size:1.4rem;letter-spacing:.04em;line-height:1}
  .hof-year-label span{color:var(--orange);font-size:.82rem;font-family:'DM Mono',monospace;margin-left:8px}
  .hof-year-arrow{color:var(--muted);font-size:.7rem;transition:transform .3s ease}
  .hof-year.open .hof-year-arrow{transform:rotate(90deg)}
  .hof-year-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
  .hof-year.open .hof-year-body{grid-template-rows:1fr}
  .hof-year-body-inner{overflow:hidden}
  .hof-year-body-pad{padding:4px 16px 12px}
  .hof-row{display:flex;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid var(--border)}
  .hof-row:last-child{border-bottom:none}
  .hof-month{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--muted);width:78px;flex:0 0 auto}
  .hof-info{flex:1;min-width:0}
  .hof-winner{font-size:.85rem;font-weight:500}
  .hof-ex{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--muted);margin-top:2px}
  .hof-pts{font-family:'Bebas Neue';font-size:1.2rem;color:var(--orange);flex:0 0 auto}
  .hof-pending{color:var(--muted);font-style:italic;font-size:.78rem}

  footer{padding:32px 40px;border-top:1px solid var(--border);text-align:center;font-size:.6rem;color:var(--muted);letter-spacing:.1em}
  footer a{color:var(--muted)}

  @media(max-width:600px){
    nav{padding:16px 20px}
    .nav-link{display:none}
    .head{padding:36px 0 20px}
  }

    /* --- account widget --- */
    .nav-right{display:flex;align-items:center;gap:14px}
    .navrow-right{display:flex;align-items:center;gap:14px}
    .acct{position:relative;display:flex;align-items:center}
    .acct-login{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--body-text);background:transparent;border:1px solid var(--border);padding:7px 12px;cursor:pointer;text-decoration:none;transition:border-color .2s,color .2s}
    .acct-login:hover{border-color:var(--orange);color:var(--orange)}
    .acct-chip{display:flex;align-items:center;gap:9px;background:transparent;border:1px solid var(--border);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;font-family:'DM Mono',monospace;color:var(--body-text);transition:border-color .2s}
    .acct-chip:hover{border-color:var(--orange)}
    .acct-av{width:26px;height:26px;border-radius:50%;background:var(--orange);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:.95rem;color:#0a0a08;flex-shrink:0;overflow:hidden;line-height:1}
    .acct-av.lg{width:44px;height:44px;font-size:1.5rem}
    .acct-av.has-img{color:transparent;background-color:var(--card2)}
    .acct-name{font-size:.68rem;letter-spacing:.06em;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .acct-lvl{font-size:.52rem;letter-spacing:.1em;color:var(--orange);border:1px solid var(--border);border-radius:999px;padding:2px 7px;flex-shrink:0}
    .acct-menu{position:absolute;top:calc(100% + 10px);right:0;min-width:236px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px;flex-direction:column;gap:2px;box-shadow:0 14px 40px rgba(0,0,0,.4);z-index:500;display:flex}
    [data-theme="light"] .acct-menu{box-shadow:0 14px 40px rgba(42,36,32,.16)}
    .acct-menu-head{display:flex;align-items:center;gap:12px;padding:10px 10px 12px}
    .acct-menu-name{font-size:.82rem;letter-spacing:.04em;color:var(--body-text)}
    .acct-menu-title{font-family:'Instrument Serif',serif;font-style:italic;font-size:.92rem;color:var(--orange);margin-top:2px}
    .acct-xp{padding:8px 10px 12px;border-top:1px solid var(--border)}
    .acct-xp-info{display:flex;justify-content:space-between;font-size:.54rem;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
    .acct-xp-bar{height:6px;border-radius:999px;background:var(--border);overflow:hidden}
    .acct-xp-fill{height:100%;width:0;background:linear-gradient(90deg,var(--orange),var(--orange2));border-radius:999px;transition:width .5s ease}
    .acct-menu-item{display:block;width:100%;padding:10px;border-radius:8px;font-family:'DM Mono',monospace;font-size:.64rem;letter-spacing:.09em;text-transform:uppercase;color:var(--body-text);text-decoration:none;background:transparent;border:none;text-align:left;cursor:pointer;transition:background .15s,color .15s}
    .acct-menu-item:hover{background:var(--card2)}
    .acct-menu-item.danger{color:var(--muted)}
    .acct-menu-item.danger:hover{color:#ff5555;background:rgba(255,68,68,.09)}
    .acct-login[hidden],.acct-chip[hidden],.acct-menu[hidden],.acct-lvl[hidden],.acct-menu-title[hidden],.acct-xp[hidden]{display:none}

  </style>
</head>
<body>
<div class="cursor" id="cursor"></div>

<nav>
  <a class="nav-logo" href="index.html">← OM</a>
  <div class="nav-right">
      <div class="acct" id="acct">
        <a class="acct-login" id="acctLogin" href="profile.html" hidden>Anmelden</a>
        <button class="acct-chip" id="acctChip" type="button" aria-haspopup="true" aria-expanded="false" hidden>
          <span class="acct-av" id="acctAv"></span>
          <span class="acct-name" id="acctName"></span>
          <span class="acct-lvl" id="acctLvl" hidden></span>
        </button>
        <div class="acct-menu" id="acctMenu" hidden>
          <div class="acct-menu-head">
            <span class="acct-av lg" id="acctAvLg"></span>
            <div>
              <div class="acct-menu-name" id="acctMenuName"></div>
              <div class="acct-menu-title" id="acctMenuTitle" hidden></div>
            </div>
          </div>
          <div class="acct-xp" id="acctXp" hidden>
            <div class="acct-xp-info"><span id="acctXpLabel">Level 1</span><span id="acctXpVal">0 / 100 XP</span></div>
            <div class="acct-xp-bar"><div class="acct-xp-fill" id="acctXpFill"></div></div>
          </div>
          <a class="acct-menu-item" href="profile.html">Profil</a>
          <button class="acct-menu-item danger" id="acctLogout" type="button">Abmelden</button>
        </div>
      </div>
      <button class="theme-toggle" id="themeToggle" title="Design wechseln">Light</button>
    </div>
</nav>

<div class="head">
  <div class="wrap">
    <h1>RANG<span>LISTE</span></h1>
    <p id="headSub">Wer vorne liegt — aktuelle Challenge, Saison und die Hall of Fame.</p>
    <div class="pills">
      <button class="pill active" data-view="current">Aktuelle Challenge</button>
      <button class="pill" data-view="season">Saison gesamt</button>
      <button class="pill" data-view="hof">Hall of Fame</button>
    </div>
  </div>
</div>

<main class="wrap">
  <div class="view active" id="view-current">
    <div class="view-sub" id="currentSub">Lädt…</div>
    <div id="currentPodium"></div>
    <div id="currentList"></div>
  </div>

  <div class="view" id="view-season">
    <div class="view-sub" id="seasonSub">Gesamtpunkte über alle Monate dieser Saison.</div>
    <div id="seasonPodium"></div>
    <div id="seasonList"></div>
  </div>

  <div class="view" id="view-hof">
    <div class="view-sub">Die Monatssieger — wer hat welchen Monat geholt.</div>
    <div id="hofList"><div class="empty">Lädt…</div></div>
  </div>
</main>

<footer>
  <div class="wrap"><span>© 2026 onlymakkus.de</span> · <a href="impressum.html">Impressum</a> · <a href="datenschutz.html">Datenschutz</a></div>
</footer>

<script>
  const cursor=document.getElementById('cursor');
  document.addEventListener('mousemove',e=>{cursor.style.left=e.clientX+'px';cursor.style.top=e.clientY+'px'});
  document.querySelectorAll('a,button').forEach(el=>{el.addEventListener('mouseenter',()=>cursor.classList.add('big'));el.addEventListener('mouseleave',()=>cursor.classList.remove('big'))});

  const THEME_KEY='om_cf_theme';
  const htmlEl=document.documentElement;
  const themeToggle=document.getElementById('themeToggle');
  function applyTheme(t){htmlEl.setAttribute('data-theme',t);themeToggle.textContent=t==='dark'?'Light':'Dark';localStorage.setItem(THEME_KEY,t)}
  applyTheme(localStorage.getItem(THEME_KEY)||'dark');
  themeToggle.addEventListener('click',()=>applyTheme(htmlEl.getAttribute('data-theme')==='dark'?'light':'dark'));

  const SB_URL='https://bsubsesbcxdaqofmkiqg.supabase.co',SB_KEY='sb_publishable_fA2Dca6SVp0eB8k_WuqLrw_zplTnXBU';
  async function sbFetch(p,o={}){
    const r=await fetch(SB_URL+p,{...o,headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':o.prefer||'',...o.headers}});
    if(!r.ok){const t=await r.text().catch(()=>'');throw new Error('Supabase '+r.status+': '+t.slice(0,200))}
    const t=await r.text();return t?JSON.parse(t):null;
  }

  const SESSION_KEY='om_profile_session';
  let currentProfile=null;
  try{const saved=localStorage.getItem(SESSION_KEY);if(saved)currentProfile=JSON.parse(saved)}catch(e){currentProfile=null}
  const myId=currentProfile&&currentProfile.id;

  function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  const MONTH_LABELS={1:'Januar',2:'Februar',3:'März',4:'April',5:'Mai',6:'Juni',7:'Juli',8:'August',9:'September',10:'Oktober',11:'November',12:'Dezember'};

  // ── Avatar-Map: einmal alle Profile laden, dann per profile_id nachschlagen ──
  const AVATARS={};   // id -> {avatar_url, display_name, name}
  async function loadAvatars(){
    try{
      const rows=await sbFetch('/rest/v1/profiles?select=id,name,display_name,avatar_url');
      (rows||[]).forEach(p=>{AVATARS[p.id]={avatar_url:p.avatar_url,display_name:p.display_name,name:p.name}});
    }catch(e){console.warn('Avatare:',e.message)}
  }
  // Baut einen Avatar-Kreis. Bild wenn avatar_url vorhanden, sonst Anfangsbuchstabe.
  function avatarHTML(profileId, fallbackName, cls='av'){
    const p=profileId!=null?AVATARS[profileId]:null;
    const label=(p&&(p.display_name||p.name))||fallbackName||'?';
    const letter=esc(label.charAt(0).toUpperCase());
    if(p&&p.avatar_url){
      return `<div class="${cls}"><img src="${esc(p.avatar_url)}" alt="" onerror="this.style.display='none';this.parentElement.textContent='${letter}'"></div>`;
    }
    return `<div class="${cls}">${letter}</div>`;
  }
  // Anzeigename: bevorzugt aus der Avatar-Map (aktuell), sonst der mitgelieferte
  function displayNameFor(profileId, fallback){
    const p=profileId!=null?AVATARS[profileId]:null;
    return (p&&(p.display_name||p.name))||fallback||'—';
  }

  // ── Podium bauen (wächst mit: 1=nur Gold, 2=Gold+Silber, 3+=volles Treppchen) ──
  // entries: [{profileId, name, valText}] bereits sortiert (Platz 1 zuerst)
  function buildPodium(container, entries){
    if(!entries.length){container.innerHTML='';return}
    const top=entries.slice(0,3);
    const places=['01','02','03'];
    const cls=['p1 first','p2','p3'];
    // Reihenfolge im Grid: bei 3 -> [2,1,3] (Silber, Gold, Bronze) für Treppchen-Optik
    let order=[0];
    if(top.length===2)order=[0,1];
    if(top.length>=3)order=[1,0,2];
    container.className='podium n'+top.length;
    if(top.length>=3)container.className='podium';
    container.innerHTML=order.map(idx=>{
      const e=top[idx];
      return `<div class="pod ${cls[idx]}">
        <div class="place">${places[idx]}</div>
        ${avatarHTML(e.profileId, e.name)}
        <div class="pod-name">${esc(displayNameFor(e.profileId, e.name))}</div>
        <div class="pod-val">${esc(e.valText)}</div>
      </div>`;
    }).join('');
  }

  // ══════════════════ 1) AKTUELLE CHALLENGE ══════════════════
  async function renderCurrentChallenge(){
    const sub=document.getElementById('currentSub');
    const podium=document.getElementById('currentPodium');
    const list=document.getElementById('currentList');
    try{
      const now=new Date();
      const y=now.getFullYear(), m=now.getMonth()+1;
      const rows=await sbFetch(`/rest/v1/season_months?season_year=eq.${y}&month=eq.${m}&select=*,exercises(*)`);
      const row=rows&&rows[0];
      if(!row){sub.textContent='Diesen Monat läuft keine Challenge.';podium.innerHTML='';list.innerHTML='';return}
      if(row.is_december_vote){sub.textContent='Dezember — die Übung wird gerade per Voting bestimmt.';podium.innerHTML='';list.innerHTML='';return}
      if(!row.exercises){sub.textContent='Keine Übung hinterlegt.';podium.innerHTML='';list.innerHTML='';return}

      const goal=row.custom_goal||row.exercises.default_goal||60;
      const unit=row.exercises.default_unit||'';
      sub.innerHTML=`<b style="color:var(--body-text)">${esc(row.exercises.name)}</b> · ${MONTH_LABELS[m]} ${y} · Ziel ${goal} ${esc(unit)}`;

      const entries=await sbFetch(`/rest/v1/challenge_entries?season_month_id=eq.${row.id}&select=*`)||[];
      if(!entries.length){podium.innerHTML='';list.innerHTML='<div class="empty">Noch keine Einträge — sei der Erste! 💪</div>';return}

      // Sortierung identisch zu challenge.html / finalize_challenge:
      // gedeckelter Wert desc, dann wer zuerst dort war (last_progress_ts asc), dann id
      const capped=e=>Math.min(e.value1||0,goal);
      const ts=e=>{const t=e.last_progress_ts?Date.parse(e.last_progress_ts):NaN;return Number.isNaN(t)?Infinity:t};
      entries.sort((a,b)=>capped(b)-capped(a) || ts(a)-ts(b) || a.id-b.id);

      const podEntries=entries.map(e=>({profileId:e.profile_id,name:e.name,valText:`${e.value1||0} ${unit}`}));
      buildPodium(podium, podEntries);

      list.className='list';
      list.innerHTML=entries.map((e,i)=>{
        const v=e.value1||0, pct=Math.min(100,Math.round(v/goal*100)), done=v>=goal;
        const mine=myId&&e.profile_id===myId;
        return `<div class="row${mine?' me':''}">
          <span class="pos">${i+1<10?'0':''}${i+1}</span>
          ${avatarHTML(e.profile_id, e.name)}
          <div class="row-name">${esc(displayNameFor(e.profile_id, e.name))}${mine?'<span class="row-tag">du</span>':''}
            <div class="row-bar"><div class="row-bar-fill${done?' done':''}" style="width:${pct}%"></div></div>
          </div>
          <div class="row-val">${v} ${esc(unit)}<small>${pct}%</small></div>
        </div>`;
      }).join('');
    }catch(e){
      console.warn('Aktuelle Challenge:',e.message);
      sub.textContent='';podium.innerHTML='';
      list.innerHTML='<div class="empty">Fehler beim Laden.</div>';
    }
  }

  // ══════════════════ 2) SAISON GESAMT ══════════════════
  async function renderSeasonRanking(){
    const podium=document.getElementById('seasonPodium');
    const list=document.getElementById('seasonList');
    try{
      const year=new Date().getFullYear();
      const data=await sbFetch(`/rest/v1/v_season_ranking?season_year=eq.${year}&select=*&order=total_points.desc&limit=20`);
      if(!data||!data.length){podium.innerHTML='';list.innerHTML='<div class="empty">Noch keine Punkte vergeben — erste Challenge läuft!</div>';return}

      const podEntries=data.map(e=>({profileId:e.profile_id,name:e.person,valText:`${e.total_points} Pkt`}));
      buildPodium(podium, podEntries);

      list.className='list';
      list.innerHTML=data.map((e,i)=>{
        const mine=myId&&e.profile_id===myId;
        return `<div class="row${mine?' me':''}">
          <span class="pos">${i+1<10?'0':''}${i+1}</span>
          ${avatarHTML(e.profile_id, e.person)}
          <div class="row-name">${esc(displayNameFor(e.profile_id, e.person))}${mine?'<span class="row-tag">du</span>':''}</div>
          <div class="row-val">${e.total_points} Pkt<small>${e.wins} Siege · ${e.teilnahmen} Challenges</small></div>
        </div>`;
      }).join('');
    }catch(e){
      console.warn('Saison-Ranking:',e.message);
      podium.innerHTML='';list.innerHTML='<div class="empty">Fehler beim Laden.</div>';
    }
  }

  // ══════════════════ 3) HALL OF FAME ══════════════════
  async function renderHallOfFame(){
    const el=document.getElementById('hofList');
    try{
      const months=await sbFetch('/rest/v1/season_months?select=*,exercises(name)&order=season_year.desc,month.asc');
      const results=await sbFetch('/rest/v1/v_month_results?rank=eq.1&select=season_month_id,profile_id,person,points,exercise_name')||[];
      const winnerOf={};
      results.forEach(r=>{winnerOf[r.season_month_id]=r});

      if(!months||!months.length){el.innerHTML='<div class="empty">Noch keine Monate angelegt.</div>';return}
      const years=[...new Set(months.map(r=>r.season_year))].sort((a,b)=>b-a);

      el.innerHTML=years.map((year,yi)=>{
        const rows=months.filter(r=>r.season_year===year && !r.is_december_vote);
        const inner=rows.map(row=>{
          const w=winnerOf[row.id];
          const exName=(row.exercises&&row.exercises.name)||'—';
          if(!w){
            return `<div class="hof-row">
              <div class="hof-month">${MONTH_LABELS[row.month]}</div>
              <div class="hof-info"><div class="hof-pending">läuft noch / offen</div><div class="hof-ex">${esc(exName)}</div></div>
            </div>`;
          }
          return `<div class="hof-row">
            <div class="hof-month">${MONTH_LABELS[row.month]}</div>
            ${avatarHTML(w.profile_id, w.person)}
            <div class="hof-info"><div class="hof-winner">${esc(displayNameFor(w.profile_id, w.person))}</div><div class="hof-ex">${esc(exName)}</div></div>
            <div class="hof-pts">${w.points}</div>
          </div>`;
        }).join('');
        const siege=rows.filter(r=>winnerOf[r.id]).length;
        const open=yi===0;   // neueste Saison offen, ältere eingeklappt
        return `<div class="hof-year${open?' open':''}">
          <button class="hof-year-head" aria-expanded="${open}" type="button">
            <span class="hof-year-label">Saison ${year} <span>${siege} entschieden</span></span>
            <span class="hof-year-arrow">▶</span>
          </button>
          <div class="hof-year-body"><div class="hof-year-body-inner"><div class="hof-year-body-pad">
            ${inner||'<div class="empty">Keine Challenges.</div>'}
          </div></div></div>
        </div>`;
      }).join('');

      el.querySelectorAll('.hof-year-head').forEach(btn=>{
        btn.addEventListener('click',()=>{
          const blk=btn.closest('.hof-year');
          const now=blk.classList.toggle('open');
          btn.setAttribute('aria-expanded',now);
        });
      });
    }catch(e){
      console.warn('Hall of Fame:',e.message);
      el.innerHTML='<div class="empty">Fehler beim Laden.</div>';
    }
  }

  // ── Pills: Ansicht umschalten ──
  document.querySelectorAll('.pill').forEach(pill=>{
    pill.addEventListener('click',()=>{
      document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
      pill.classList.add('active');
      document.getElementById('view-'+pill.dataset.view).classList.add('active');
    });
  });

  // ── Abrechnung (Rückfall, falls Cron nicht lief) ──
  async function checkAndFinalize(){
    if(new Date().getDate()!==1)return;
    try{ await sbFetch('/rest/v1/rpc/finalize_last_month',{method:'POST',body:JSON.stringify({})}); }
    catch(e){ console.warn('Abrechnung:',e.message); }
  }

  // ── Init ──
  (async function init(){
    await loadAvatars();              // zuerst Avatare, dann rendern
    await checkAndFinalize();
    renderCurrentChallenge();
    renderSeasonRanking();
    renderHallOfFame();
  })();

  /* ══════════════════════════════════════════════════════════
     DEZEMBER-VOTING — vorübergehend deaktiviert.
     Der Code bleibt erhalten und zieht später in den Challenge-
     Bereich (challenge.html) um. Bis dahin nicht aufgerufen.
     Die zugehörige DB (december_votes) bleibt unangetastet.
     ══════════════════════════════════════════════════════════ */
</script>
  <script>
(function(){
  var SESS='om_profile_session';
  var acct=document.getElementById('acct'); if(!acct) return;
  var s=null; try{ s=JSON.parse(localStorage.getItem(SESS)||'null'); }catch(e){ s=null; }
  var login=document.getElementById('acctLogin');
  var chip=document.getElementById('acctChip');
  var menu=document.getElementById('acctMenu');
  function initial(n){ n=(n||'').trim(); return n?n.charAt(0).toUpperCase():'?'; }
  function paintAv(el){ if(!el)return; if(s&&s.avatarUrl){ el.style.backgroundImage='url("'+s.avatarUrl+'")'; el.classList.add('has-img'); el.textContent=''; } else { el.textContent=initial(s&&(s.displayName||s.name)); } }
  if(!s||!s.id){ if(login)login.hidden=false; return; }
  if(chip)chip.hidden=false;
  var name=s.displayName||s.name||'Profil';
  var full=name+(s.discriminator?('#'+s.discriminator):'');
  document.getElementById('acctName').textContent=name;
  document.getElementById('acctMenuName').textContent=full;
  paintAv(document.getElementById('acctAv'));
  paintAv(document.getElementById('acctAvLg'));
  if(s.level!=null){ var lv=document.getElementById('acctLvl'); lv.hidden=false; lv.textContent='LV '+s.level; }
  if(s.title){ var ti=document.getElementById('acctMenuTitle'); ti.hidden=false; ti.textContent=s.title; }
  if(s.xp!=null&&s.xpNext!=null){ var xp=document.getElementById('acctXp'); xp.hidden=false;
    document.getElementById('acctXpLabel').textContent='Level '+(s.level!=null?s.level:1);
    document.getElementById('acctXpVal').textContent=s.xp+' / '+s.xpNext+' XP';
    var pct=s.xpNext?Math.max(0,Math.min(100,s.xp/s.xpNext*100)):0;
    document.getElementById('acctXpFill').style.width=pct+'%';
  }
  function closeM(){ menu.hidden=true; chip.setAttribute('aria-expanded','false'); }
  function openM(){ menu.hidden=false; chip.setAttribute('aria-expanded','true'); }
  chip.addEventListener('click',function(e){ e.stopPropagation(); if(menu.hidden)openM();else closeM(); });
  document.addEventListener('click',function(e){ if(!acct.contains(e.target))closeM(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape')closeM(); });
  var lo=document.getElementById('acctLogout');
  if(lo)lo.addEventListener('click',function(){ try{localStorage.removeItem(SESS);}catch(e){} location.href='profile.html'; });
})();
</script>
</body>
</html>
